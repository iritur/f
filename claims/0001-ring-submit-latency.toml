# Not yet measurable — the ring exists, the hardware path does not. Registered
# now so the target is on record before there is a number to be tempted by.
name       = "ring-submit-latency"
status     = "pending"          # pending | tracked | gating
milestone  = "M5"

statement  = """
A single ring submission with a warm cache costs less than 50 ns at p99, and at
least 5x less than an equivalent system call on a tuned Linux baseline.
"""

[baseline]
system  = "linux-6.x-tuned"
# The configuration, not a description of it. E1-D06: the sentence in `notes`
# was the whole baseline until this key existed, and a sentence cannot be
# re-run — so it could not be found to have stopped being true, which is
# claims/README.md rule 1's decay with nothing standing in its way.
# `lint-reproduce` checks the directory is there and carries its three files;
# `cargo xtask release` puts it in the package.
path    = "claims/baselines/linux-6.x-tuned"
notes   = "io_uring enabled and SQPOLL permitted, SCHED_FIFO for the workload rather than sched_ext with the argument written down, transparent huge pages on for the baseline half, mitigations on and stated as a cost. Configured by someone trying to win. Re-tuning produces a new versioned directory beside that one, never an edit to it."

[owner]
# R09: every headline claim names the subsystem that owns it. A claim with
# an owner is a claim somebody can be asked about; energy was in the first
# paragraph of the thesis and had no owner across five documents, which is
# how half a claim goes missing without anybody deciding to drop it.
document = "docs/design/ring-scene-boot.html"
section  = "06"
notes    = "The ring is the subsystem, and section 06 is where its cost table lives — the same table this claim's diagnosis section quotes when a result comes in over 150 ns."

[workload]
path    = "bench/src/bin/ring_submit.rs"
repeat  = 1_000_000
batch   = 32

[metrics]
primary   = "ns_per_op_p99"
secondary = ["instructions_per_op", "joules_per_op", "ns_per_op_p999"]

[threshold]
ns_per_op_p99     = { max = 50 }
ratio_vs_baseline = { min = 5.0 }

[hardware]
runner = "runner-class-A"       # pinned bare metal, thermally stable
notes  = "Shared cloud instances cannot produce defensible tail latency."

[reproduce]
command = "cargo xtask claim ring-submit-latency"

[diagnosis]
# From ring-scene-boot section 06. Recorded here so a red result carries its own
# first debugging step.
over_150ns = "false sharing — check cache-line alignment on the cursors first"
flat_batch = "the batch is not being amortised; you are publishing per entry"
