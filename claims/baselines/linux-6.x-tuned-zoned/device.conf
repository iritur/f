#
# The device, as data.
#
# This file is here because *on the same device* is the whole of what
# `claims/0016-write-amplification.toml` compares, and a device that is
# described in prose is a device the two halves of the comparison can quietly
# disagree about. F's mapping fills zones and a tuned f2fs fills zones; if one
# of them is measured on 256 MiB zones and the other on 64 MiB zones, the ratio
# is a fact about two geometries and not about two mappings.
#
# So the geometry is one file, both halves read it, and `verify.sh` refuses a
# machine whose block device does not report exactly these numbers back.
#
# **Nothing here has been run.** No device of this shape has existed in this
# project: `E2-P10` measured that the development image's QEMU 7.2 has no zoned
# virtio-blk support at all — `-device virtio-blk-pci,help` lists no `zone`
# property and `file.zoned` is rejected as unexpected — so these numbers are a
# specification and not a description. The README says what it would cost to
# make them a description.

# ---------------------------------------------------------------------------
# The zone model.

# Unit: enumeration, as `/sys/block/<dev>/queue/zoned` spells it.
#
# `host-managed` and not `host-aware`. A host-aware device accepts a random
# write and silently does the copy-forward itself, which is the one device on
# which this claim's subject cannot be measured at all: the write amplification
# would be inside the drive, uncounted, and both halves would look excellent.
model = host-managed

# Unit: bytes. The size of one zone, and therefore the unit the mapping and the
# filesystem both allocate in.
#
# 64 MiB, and the three constraints that fix it. Below 2 MiB f2fs cannot use the
# device at all: an f2fs section is a whole zone and a segment is 2 MiB, so a
# zone smaller than a segment has no legal section size — which is also why
# `zone/tests/cycle.rs`'s modelled 1 MiB zone is a geometry the baseline could
# not have been run on, and one more reason its 1.1336 is not this claim's
# number. Above 256 MiB the device needed to force both collectors to run
# becomes tens of gigabytes of emulated writes. 64 MiB is 32 f2fs segments to a
# section, which is a section size f2fs is ordinarily configured with.
zone_size_bytes = 67108864

# Unit: bytes. The writable capacity of one zone.
#
# Equal to `zone_size_bytes` deliberately. A zone whose capacity is below its
# size is a real ZNS feature and f2fs has handled it since 6.x, but it moves
# both sides' arithmetic — every zone carries a hole neither mapping chose — and
# it says nothing about either mapping. A device with capacity below size is a
# different device and therefore a new directory beside this one, which is this
# directory's own rule applied to its first temptation.
zone_capacity_bytes = 67108864

# Unit: count of zones. The whole device, conventional zones included.
zones = 48

# Unit: count of zones, at the start of the device, that accept random writes.
#
# Four, and they are a concession to the baseline rather than a property either
# side asked for. f2fs keeps its superblock, checkpoints, NAT and SIT in
# randomly-writable space; on a device with none it cannot be created, and the
# usual answer — a second conventional device passed to `mkfs.f2fs -c` — would
# put half of the baseline's writes on a device this claim is not counting.
# Conventional zones at the head of the *same* device keep every byte either
# side writes inside one block node, which is what makes `counted_nodes` in
# `comparison.conf` a rule anybody can check rather than an intention.
#
# F's mapping reserves three zones for its superblock and two root zones
# (`DATA_FROM` in `zone/tests/cycle.rs`) and does not need them to be
# conventional. It is given the same four and uses three; the fourth is spare
# the baseline needs and F does not, and it is counted against neither.
conventional_zones = 4

# Unit: bytes. `/sys/block/<dev>/queue/logical_block_size`.
#
# 4096, and this is the choice in this file that costs F the most, which is why
# it is argued rather than defaulted. A record in F's store is padded to the
# logical block, so the fill term the modelled cycle measured — 1.0111 on a
# 512-byte block — is arithmetic that gets worse here, by up to eight times the
# padding per record. The reason to take that cost is that 4096 is what shipping
# zoned SSDs report, f2fs's own block is 4 KiB whatever the device says, and a
# 512-byte device would hand the baseline a free ride the hardware it stands for
# does not offer. A comparison should err against the system making the claim.
logical_block_bytes = 4096

# Unit: count of zones that may be open at once; 0 would mean no limit.
#
# Twelve. f2fs opens one zone per active log and runs six logs by default, so
# anything below six is a device f2fs cannot mount; twelve is the smallest round
# number that leaves both sides room rather than making this a claim about who
# handles zone exhaustion better. That is a real property and it is `E2-P03`'s,
# not this one's.
max_open_zones = 12

# Unit: count of zones that may be active (open or closed but not full) at once.
max_active_zones = 12

# ---------------------------------------------------------------------------
# How the device is obtained.

# Unit: enumeration. What stands behind the guest's zoned virtio-blk.
#
# `null_blk` — the host's own zoned null block device, created with
# `zone_size`, `zone_nr_conv`, `zone_max_open` and `zone_max_active` set from
# the rows above, and handed to QEMU as a host device. This is named rather than
# left open because the alternative is the open question this baseline could not
# settle: whether QEMU can synthesise a zoned virtio-blk from a plain file, or
# whether its zoned support is passthrough of a host zoned device only. The
# development image's QEMU is 7.2 and has neither, so the question could not be
# asked here. `null_blk` is the route that works either way, and it costs a host
# kernel with `CONFIG_BLK_DEV_ZONED` and a privileged `modprobe`.
backing = null_blk

# Unit: version. The QEMU below which the guest half of this comparison cannot
# be run at all.
#
# 8.1, which is where virtio-blk zoned storage arrived. Measured, not assumed:
# the development image's 7.2 answers `Parameter 'file.zoned' is unexpected` and
# lists no `zone` property on `virtio-blk-pci`. `docker/README.md` names the
# one-line base change to trixie that would move it.
qemu_min = 8.1

# Unit: version, inclusive. The kernel the baseline is tuned for.
#
# The same 6.6 floor as `claims/baselines/linux-6.x-tuned`, and for a reason
# that is about this directory rather than about a knob: the two baselines are
# meant to be satisfiable by one project, and a range that differed between them
# would be a pair of baselines no single kernel can be. Below 7.0 because every
# f2fs name in `sysfs.conf` is an internal knob no interface promises to keep.
kernel_min = 6.6
kernel_below = 7.0
