#
# Every sysctl this baseline sets, with its unit and its cost. A real sysctl
# file: `sysctl -p sysctl.conf` applies it, and `verify.sh` reads every line of
# it back off the machine.
#
# There are five, and there are five rather than the sibling directory's dozen
# because this claim counts bytes and not nanoseconds. A scheduler knob does not
# change how many bytes reach a device; a writeback knob does. Copying the other
# baseline's list across would have been a page of settings nothing here reads,
# which is the same failure as a setting nobody applies.

# ---------------------------------------------------------------------------
# Writeback: when a dirty page becomes a device write.
#
# These four are the tuning that matters for this number, and they all move the
# same way: the longer the kernel holds a dirty page, the more overwrites are
# absorbed in memory and the fewer bytes reach the device. Someone trying to win
# raises them. The reason that is not cheating is `counter_read_after = sync` in
# `comparison.conf`: the measurement ends with the page cache emptied onto the
# device and the counter read afterwards, so a deferred write is a write that
# has been *delayed*, not one that has been excluded.
#
# Both halves get the same treatment for the same reason. F's store does its own
# batching under RFC 0060, and a baseline forbidden from batching would be a
# baseline losing to a mechanism it was not allowed to have.

# Unit: percent of available memory dirty before background writeback starts.
vm.dirty_background_ratio = 10

# Unit: percent of available memory dirty before a writer is made to block.
vm.dirty_ratio = 40

# Unit: centiseconds a dirty page may sit before writeback will take it.
vm.dirty_expire_centisecs = 3000

# Unit: centiseconds between writeback wakeups.
vm.dirty_writeback_centisecs = 500

# ---------------------------------------------------------------------------
# Swap.

# Unit: enumeration, 0 to 200; 0 means swap only to avoid an out-of-memory kill.
#
# Fairness rather than tuning. A swapped page is device bytes the application
# never asked for, arriving from the host's memory pressure rather than from
# either mapping — so a run that swapped would charge the baseline for the size
# of the guest. `comparison.conf` additionally requires the run to fit in memory;
# this is the setting that makes a violation of that visible as an OOM rather
# than as a quietly worse ratio.
vm.swappiness = 0
