#
# What both halves have to do identically for the ratio to be a ratio.
#
# This file has no sibling in `claims/baselines/linux-6.x-tuned/`, and the
# reason it exists here is the difference between the two claims. `claims/0001`
# compares one operation against one operation: the submit is the submit, and
# a tuned machine is the whole of what could differ. `claims/0016` compares two
# *mappings under a workload*, and a workload has a dozen dials — how much is
# written, in what sizes, how often it is made durable, how much of it is kept —
# each of which moves write amplification by more than any tuning knob in this
# directory. A ratio taken with those dials set differently on the two sides is
# not a worse comparison; it is not a comparison.
#
# So the workload is configuration too, in the same directory, versioned with
# the claim for `claims/README.md` rule 1's reason. `E1-D06`'s rule is that a
# baseline is configuration in the tree or it is prose that decays. The dials
# below are the half of the baseline that would have decayed fastest, because
# they are the half a well-meaning reader would re-derive from whatever the
# harness happened to do that week.

# ---------------------------------------------------------------------------
# What is written.

# Unit: bytes. The smallest and largest object the client publishes.
#
# The same draw `zone/tests/cycle.rs` uses, so that the modelled decomposition
# and the measured ratio are at least about the same shape of object even though
# they are taken at different boundaries. Objects this size are large enough that
# per-record padding rounds to nothing and small enough that a zone holds many;
# a workload of sixty large objects would measure the padding term at zero and a
# workload of a million small ones would measure almost nothing else.
object_min_bytes = 131072
object_max_bytes = 196608

# Unit: seed for `f_env::Env`. One draw, reproducible, RFC 0004.
seed = 1

# Unit: multiples of the device's sequential capacity, written by the client.
#
# Three, and it is the number that decides whether this measures anything at
# all. Write less than one fill and no zone is ever reused: both sides report
# their fill term, no copy-forward, and a ratio near one that means the
# collectors were never asked. `zones_reset` in `claims/0016`'s threshold table
# is the same refusal expressed as a floor. Three fills is the smallest count
# that puts both collectors past their first steady state rather than in it.
#
# With `device.conf`'s 44 sequential zones of 64 MiB, three fills is about 8 GiB
# of application bytes, or roughly 52 000 objects at the size draw above.
device_fills = 3

# Unit: one kept generation in this many published.
#
# Eight, from `zone/tests/cycle.rs`'s `KEEP_EVERY`. Retention is what creates
# the live fraction the collector has to copy forward, so a run that kept
# nothing would measure a store that never garbage-collects anything and a run
# that kept everything would measure one that cannot reclaim. The baseline's
# equivalent is that one file in eight is kept and the rest are unlinked, at the
# same points in the stream.
retention_keep_every = 8

# ---------------------------------------------------------------------------
# What is promised.

# Unit: enumeration. Where the durability point is.
#
# Per object, and this is the fairness constraint with the largest effect on the
# number. F's publish is durable when it returns; a baseline that batched sixty
# objects into one fsync would be measured writing far less per application byte
# for a reason that has nothing to do with its mapping. `fsync_mode=strict` in
# `filesystem.conf` is the setting that makes the baseline's fsync mean what F's
# publish means.
durability = per_object_fsync

# Unit: percent of the device held back from the client, on both sides.
#
# Twenty. Spare room is the input write amplification is most sensitive to —
# a mapping with more of it copies less forward, whatever its ranking does — so
# a comparison that gave the two sides different amounts of it would be
# measuring the gift rather than the mapping. `mkfs.f2fs -o 20` in
# `filesystem.conf` is this number on the baseline's side; the mapping's free
# zone reserve is this number on F's, and `zone/tests/cycle.rs`'s `SLACK_ZONES`
# is the constant the boot has to derive from it rather than keep its own copy
# of.
overprovision_percent = 20

# Unit: enumeration. On, on both sides.
#
# Not a tuning choice. F issues FLUSH and the modelled cycle counts 138 of them;
# a baseline mounted `nobarrier` would be promising less than F promises, which
# is the cheapest way there is to win this ratio dishonestly.
barriers = on

# Unit: enumeration. Off, on both sides.
#
# F does not compress. A compressing baseline turns the ratio into a comparison
# between a compressor and a mapping, and the compressor wins on any workload
# whose objects are compressible — a property of the test data rather than of
# either system.
compression = off

# ---------------------------------------------------------------------------
# How it is counted.

# Unit: enumeration. The counter, and it is the same counter for both halves.
#
# QEMU's `query-blockstats` over QMP, read from outside the guest. Outside is
# the point: a guest counting its own writes is counting what it asked for, and
# this claim's subject is what the device was made to do. `claims/0016` says it
# in its own words — *a count taken at a different boundary is a different count
# however similar it looks* — and it says it because the number in that file
# today is taken at the modelled `ZonedDevice` boundary in a host process and is
# marked `modelled_` for exactly that reason.
counting_boundary = query-blockstats

# Unit: enumeration. Which block nodes are summed.
#
# All of them. `device.conf` puts the conventional zones the baseline needs on
# the same device as the sequential ones precisely so that this rule has one
# node to name; if a future geometry moves f2fs's metadata to a second device,
# that device's `wr_bytes` is part of the baseline's number and a comparison
# that dropped it would be handing the baseline free metadata.
counted_nodes = every writable node attached to the guest

# Unit: enumeration. When the counter is read.
#
# After `sync`, and after both collectors are idle. Two failures this closes,
# and they pull in opposite directions: reading before `sync` excludes dirty
# pages that will certainly be written, which flatters whichever side had the
# larger page cache; reading while a collector is still running excludes
# copy-forward that has been earned and not yet paid, which flatters whichever
# side collects more lazily. `zone/tests/cycle.rs`'s phasing — fill with the
# collector held, collect to quiescence with the client idle, then count — is the
# same rule on the modelled side, and RFC 0059 is why it is a requirement rather
# than a convenience.
counter_read_after = sync

# Unit: enumeration. What must be true of the guest for the number to be read.
#
# The working set fits in the guest's memory, so that neither side swaps.
# `vm.swappiness = 0` in `sysctl.conf` makes a violation an out-of-memory kill
# rather than a quietly worse ratio.
quiescence = collector_idle
