#
# The runtime knobs under `/sys`, as data.
#
# The key is the path: `queue_<name>` is `/sys/block/<dev>/queue/<name>` and
# `f2fs_<name>` is `/sys/fs/f2fs/<dev>/<name>`. The setting is written once and
# the path is derived from it in `lib.sh`, because the alternative — a name here
# and a path in each script — is two copies of one fact, which is the decay this
# whole directory exists to prevent, one level down.

# ---------------------------------------------------------------------------
# The block layer.

# Unit: enumeration. Fairness rather than tuning; the argument is in
# `filesystem.conf` beside the same value, and it is stated in both files
# because one of them is read by a person deciding whether the filesystem is
# configured and the other by a script deciding whether the machine still is.
queue_scheduler = mq-deadline

# Unit: count of requests in the block layer's queue.
#
# 256, the ordinary default, and deliberately not raised. A deeper queue changes
# when bytes reach the device and not how many, so raising it would buy this
# metric nothing while making the run less like the one a reader would repeat.
queue_nr_requests = 256

# ---------------------------------------------------------------------------
# f2fs.

# Unit: enumeration. 0 = f2fs's default victim selection, 1 = greedy, 2 =
# cost-benefit.
#
# 2, and this is the knob where "configured by someone trying to win" has real
# content. Greedy takes the segment with the fewest valid blocks, which is the
# same ranking `zone/src/collect.rs` uses — RFC 0059's *least live zone
# available*, and the reason the modelled copy-forward term came out at 0.1225
# rather than the 0.33 that `f/(1 − f)` predicts. Setting the baseline to greedy
# would be choosing its algorithm to match F's, which is the opposite of tuning
# it: cost-benefit additionally weights a segment's age, and on a workload with
# any age skew it copies less. The baseline gets the better of the two.
#
# The reversal is a measurement rather than an argument: if a run shows
# cost-benefit copying more than greedy on this workload, the baseline was
# mis-tuned, and it is re-tuned as a new directory beside this one.
f2fs_gc_idle = 2

# Unit: enumeration. 0 = off.
#
# Off. Urgent GC is a mode for reclaiming under pressure and it copies more, not
# less; a baseline left in it would be a baseline losing on a setting nobody
# chose. `background_gc=on` in `filesystem.conf` is the collector that should be
# doing this work.
f2fs_gc_urgent = 0

# Unit: count of segments searched when choosing a victim.
#
# 16384, four times the default. This claim counts bytes and not time, so a
# longer search is free in the metric being measured and buys emptier victims —
# which is exactly the kind of knob a tuner turns and a defender of a number
# should be uncomfortable leaving at its default. The cost it does have, CPU per
# collection, is real and belongs to `claims/0012`'s subject rather than this
# one; R12 says state it rather than hide it.
f2fs_max_victim_search = 16384

# Unit: enumeration. 0 = never update in place.
#
# 0, and it is a check on the *device* wearing a filesystem knob's clothes.
# A sequential zone cannot be overwritten, so there is nowhere on a host-managed
# device for an in-place update to go; a machine reporting anything else here has
# a device that is not the device `device.conf` describes, whatever its `zoned`
# attribute says.
f2fs_ipu_policy = 0

# Unit: count of prefree segments reclaimed per checkpoint.
#
# 4096, the default, and named rather than left unnamed: a knob this directory
# does not mention is a knob that can drift without either script noticing, which
# is R04 aimed at the machine.
f2fs_reclaim_segments = 4096
