#
# The filesystem, as data: which one, how it is made, and how it is mounted.
#
# Every line here is either a setting somebody trying to win would choose, or a
# setting chosen to make the two halves answer the same question — and the two
# kinds are not interchangeable, so each one says which it is. A tuning choice
# that quietly changes the question is how a comparison stops being one.

# ---------------------------------------------------------------------------
# Which filesystem, and why it is the peer worth beating.

# Unit: enumeration.
#
# f2fs, in zoned mode. It is the mainline filesystem with native host-managed
# zoned support, and — the part that matters for *this* number — it is
# log-structured: it appends, it seals, and it garbage-collects, which is the
# same three verbs `zone/src/map.rs` and `zone/src/collect.rs` implement. A
# write-amplification ratio against a filesystem that did not copy anything
# forward would be a ratio against a system answering a different question, and
# `claims/README.md` rule 1's decay is only the second-worst way to get that
# wrong.
#
# The two that were considered and are not here. **btrfs in zoned mode** is the
# other mainline answer and is a defensible second baseline; it is not this one
# because its copy-forward is entangled with its snapshot and reference-counting
# machinery, so a ratio against it would carry a term neither F nor f2fs has.
# **ext4 over dm-zoned** is not a peer at all: dm-zoned hides the zone model
# behind a conventional block device, so the amplification moves into the mapper
# and the comparison becomes F against a shim.
fs = f2fs

# Unit: shell words, passed to `mkfs.f2fs` before the device.
#
# `-m` is zoned mode and is the whole point. `-o 20` is the overprovision ratio
# in percent, and it is the single most consequential number in this file: more
# spare room means less copy-forward, on both sides, so a baseline given more
# spare than F would win the ratio by arithmetic. `comparison.conf` holds the
# 20 as a fairness constraint and this line reads the same number, once —
# `overprovision_percent`. `-t 1` keeps discard enabled at mkfs time.
mkfs_opts = -m -o 20 -t 1

# Unit: comma-separated mount options, every one required to appear in
# `/proc/mounts` for the mount point.
#
# What each is doing, and which kind of choice it is:
#
#   noatime          tuning. An atime update is a metadata write the application
#                    did not ask for, and charging the baseline for them would be
#                    charging it for a default nobody measuring would leave on.
#   background_gc=on tuning, and the one place where turning a thing *on* helps
#                    the baseline: f2fs's collector reclaims in the background,
#                    which is what F's does, and a baseline measured with GC off
#                    would report the amplification of a device that had not yet
#                    been asked to reuse anything.
#   inline_data      tuning. Small files live in the inode rather than in a data
#                    block; fewer blocks written for the same application bytes.
#   inline_dentry    tuning, the same shape for directory entries.
#   flush_merge      tuning. Concurrent fsyncs share one device flush, which is
#                    the baseline's version of the barrier batching RFC 0060
#                    gives F.
#   fsync_mode=strict fairness, and it costs the baseline. F's publish is durable
#                    per object; f2fs's default `posix` fsync persists less than
#                    that, so leaving it default would let the baseline skip work
#                    F is being charged for. R12: the cost is stated rather than
#                    hidden in the metric.
#
# What is deliberately absent, because each would make the comparison dishonest
# in the baseline's favour:
#
#   compress=…       F does not compress. A compressing baseline is a comparison
#                    between a compressor and a mapping.
#   nobarrier        F issues FLUSH and the modelled cycle counts 138 of them.
#                    A baseline with barriers off is a baseline promising less.
mount_opts = noatime,background_gc=on,inline_data,inline_dentry,flush_merge,fsync_mode=strict

# Unit: enumeration, as `/sys/block/<dev>/queue/scheduler` spells the chosen one.
#
# Not a tuning choice and not free to change: Linux requires a scheduler that
# preserves per-zone sequential write ordering on a host-managed device, and
# `mq-deadline` is the one that does it. `none` is legal only where the
# filesystem writes exclusively with zone append, which f2fs does not. It is
# here so that a machine that drifted to `none` is caught as a machine whose
# writes may be reordered into failure, rather than as a slow one.
scheduler = mq-deadline
