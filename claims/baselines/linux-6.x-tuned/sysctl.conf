#
# Every sysctl this baseline sets, with the unit and the cost of each.
#
# The shape is a real sysctl file — `sysctl -p sysctl.conf` applies it, and
# `/etc/sysctl.d/50-f-baseline.conf` is where it goes if you want it to survive
# a reboot. `apply.sh` sets each one with `sysctl -w` instead, and `verify.sh`
# reads the same file and compares against the running value, so there is one
# list and two things read it.
#
# Every number here carries its unit in the comment above it, including the
# ones whose unit is "a boolean" and the ones whose unit is "a count", because
# `-1` means three different things in this file.

# --- io_uring, which is half of what the baseline is being asked to be. -----

# 0 = every process may create a ring; 1 = only CAP_SYS_ADMIN or the group in
# `kernel.io_uring_group`; 2 = nobody. Unit: an enumeration, not a boolean.
#
# The default is 0 on a stock kernel and several distributions ship 2. Setting
# it explicitly is what lets `verify.sh` distinguish "io_uring is on" from
# "nothing on this machine can tell", which is why `baseline.conf` puts the
# kernel floor at 6.6 — the version this knob first existed in.
#
# SQPOLL is permitted by this alone: `IORING_SETUP_SQPOLL` has been available
# to unprivileged callers since 5.13. What is *not* granted here is
# `IORING_SETUP_SQ_AFF`, pinning the poll thread to a named core, which needs
# CAP_SYS_NICE on the calling process. `apply.sh` prints the `setcap` line and
# does not run it: a script that grants a capability to a binary it was not
# told about is a script that grants a capability to the wrong binary.
kernel.io_uring_disabled = 0

# --- The scheduler, for the SCHED_FIFO policy `baseline.conf` chose. --------

# Microseconds of real-time execution permitted per `kernel.sched_rt_period_us`
# (1 000 000 µs). -1 means no throttling. Unit: microseconds, or the sentinel.
#
# The default is 950000 µs, which throttles a busy-polling FIFO thread for
# 50 ms in every second — a 50 000 µs stall, arriving once per second, in the
# tail of every distribution taken here. Left at the default this single line
# would be most of the baseline's p99.9.
#
# **The cost, stated rather than discovered:** this removes the only thing that
# stops a runaway real-time thread from making the machine unreachable. On a
# measurement machine with a serial console that is a reboot; on anything else
# it is a trip to the rack. This is a baseline for a dedicated machine and not
# a tuning suggestion for a server.
kernel.sched_rt_runtime_us = -1

# Boolean. Autogrouping puts a session's threads in a shared cgroup and shares
# CPU between sessions rather than between threads, which is the right default
# for a desktop and is an extra scheduling entity between the workload and the
# core here.
kernel.sched_autogroup_enabled = 0

# Boolean. NUMA balancing samples page access by unmapping pages and taking the
# fault, which is a stall inside the measurement window with no other name.
# Single-socket machines still run it, and RFC 0007 requires pre-faulted memory
# that is never migrated.
kernel.numa_balancing = 0

# Boolean. Timers armed on an isolated core are otherwise migrated onto a
# housekeeping core when the isolated one is idle, and migrated back — which is
# a cross-core wake-up on the path a timer-driven workload is being measured
# on. `nohz_full` alone does not turn this off.
kernel.timer_migration = 0

# --- The counters bench/ reads. ---------------------------------------------

# 0 = per-CPU and per-process events allowed, no raw tracepoint access;
# 1 = per-process only; 2 = user-space measurements only; -1 = everything.
# Unit: an enumeration, and the values run the wrong way round from every other
# knob in this file — smaller is more permissive.
#
# `bench/src/lib.rs` reports `instructions_per_op` beside nanoseconds, because
# claims/README.md rule 4 says an instruction count survives a hardware change
# and a nanosecond does not. Reading it for a *pinned* workload is a per-CPU
# event, which needs 0; the distribution default of 2 or 3 gives the harness a
# permission error rather than a counter, and `Metric::Unavailable` is what a
# reader then sees in place of the number.
#
# 0 rather than -1, and the difference is the cost: -1 additionally opens raw
# tracepoints and kernel-address leakage through perf, and buys nothing this
# harness uses. A machine with mitigations on and `perf_event_paranoid = -1` is
# a machine making two contradictory statements about what it is defending.
#
# Today this counter is not wired — `Sample::new` reports it as unavailable,
# owed to E0-P05's machine. The sysctl is here anyway, because the failure it
# prevents is silent: the harness would report "no counters" on a machine that
# has them, and nobody would suspect a permission.
kernel.perf_event_paranoid = 0

# Boolean pair. Both watchdogs run a periodic per-CPU perf event and a per-CPU
# kernel thread; `nmi_watchdog=0` is also on the command line, and this is the
# same statement made where a running kernel can be asked about it.
kernel.watchdog = 0
kernel.nmi_watchdog = 0

# --- Memory: nothing moves under a reservation. -----------------------------

# 0..200, unitless. 0 does not disable swapping and this machine has none —
# what it does is stop the kernel preferring to reclaim anonymous memory, which
# is the workload's registered buffers.
vm.swappiness = 0

# 0..100, a percentage of a background compaction effort. 0 = off. Proactive
# compaction moves pages that nobody asked to have moved, which under a
# reservation is the definition of interference.
vm.compaction_proactiveness = 0

# Boolean. Zone reclaim throws away page cache rather than allocating from a
# further zone, and on one socket it can only cost.
vm.zone_reclaim_mode = 0

# Seconds between the per-CPU vmstat counters being folded into the global
# ones, on every CPU. The default is 1 s, so it is a wake-up per core per
# second forever. `nohz_full` quiesces it on isolated cores in most cases and
# not in all; 300 s is the largest value that keeps `/proc/vmstat` useful
# afterwards for a run of a few minutes.
vm.stat_interval = 300

# Count of huge pages the pool may grow by at run time. 0, deliberately: the
# pool is carved at boot by `hugepages=` in `cmdline.txt`, and a pool that can
# grow later is a pool whose growth is a compaction pass inside a measurement.
vm.nr_overcommit_hugepages = 0
