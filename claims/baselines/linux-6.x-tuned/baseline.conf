#
# The settings of this baseline that are neither a boot parameter nor a sysctl.
#
# There are three kinds of setting on this machine and they are applied through
# three different interfaces, so a file that could hold only one of them would
# force the other two into script bodies — which is where a setting stops being
# data and starts being something you have to read code to find. `cmdline.txt`
# holds what only a reboot can change, `sysctl.conf` holds what `sysctl -w`
# changes, and this holds the rest: a governor in sysfs, a scheduling policy
# the workload is launched under, a daemon that has to be off.
#
# `key = value`, one per line. `#` starts a comment. Read by `lib.sh`, which is
# not a parser for anything more general than this.

# The kernel version this baseline is a baseline for, as a half-open range, in
# one place, because a version stated twice is a version that disagrees with
# itself later.
#
# The floor is 6.6 and the reason is mechanical rather than editorial: 6.6 is
# the LTS that introduced `kernel.io_uring_disabled`, which is the switch this
# baseline uses to say io_uring is on. On 6.5 the switch does not exist, so
# `verify.sh` cannot distinguish "io_uring is enabled" from "nothing here can
# tell", and a check that cannot fail is not a check.
#
# The ceiling is the next major version and is a statement about what is
# checkable rather than about what works. Every name in `cmdline.txt` and
# `sysctl.conf` is a kernel-internal knob that no interface promises to keep;
# `intel_pstate=disable` and `vm.compaction_proactiveness` are two that have
# already changed meaning once. When 7.0 exists, this directory is re-tuned
# against it as a *new versioned directory* — see the README's reversal
# condition — and the range in that copy is the new one. Widening this range
# in place is the decay the whole directory exists to prevent.
kernel_min                = 6.6.0
kernel_below              = 7.0.0

# `performance`, applied per policy in sysfs rather than trusted from
# `cpufreq.default_governor` on the command line. The command-line default is
# what a policy is created with; a driver that re-creates a policy after boot,
# or a distribution unit that sets one at login, silently wins over it.
governor                  = performance

# The scheduling policy the baseline's workload runs under, and the choice is
# written down here rather than left to whoever launches it.
#
# **SCHED_FIFO, at priority 80.** The alternative was a `sched_ext` BPF
# scheduler, which is what "configured by someone trying to win" would reach
# for on a 6.12 or later kernel, and it was rejected for a reason that is about
# this repository rather than about Linux: a sched_ext baseline is a BPF
# program, and a program is a second artefact with its own source, its own
# build and its own version — none of which this tree builds, and all of which
# would have to be re-checked by `A-04` alongside the settings here. A baseline
# nobody can re-run is the failure mode this directory exists to remove, and
# shipping one whose scheduler is an unbuildable binary would reintroduce it
# one level down.
#
# SCHED_FIFO on an isolated core, with `kernel.sched_rt_runtime_us = -1` so it
# is not throttled, is the strongest policy a stranger can apply with one
# command and no compiler. It is also not a handicap: on a core that runs one
# runnable thread, FIFO and a well-written sched_ext policy make the same
# decisions, because there is nothing to decide between.
#
# *Reversal:* a datapath claim at `E1-P10` whose baseline result is attributable
# to wake-up placement — the SQPOLL thread and the submitter landing on the
# wrong cores, or a wake-up crossing an LLC — rather than to the cost of the
# submission itself. That is the case sched_ext exists for and FIFO cannot
# answer, and it produces a new versioned directory, not an edit to this one.
sched_policy              = FIFO
sched_priority            = 80

# Transparent huge pages, on, for the baseline half of the comparison.
#
# This is the one setting in this directory that deliberately disagrees with
# `claims/runner-class-A.md`, which puts `transparent_hugepage=never` on the
# kernel command line — and `cmdline.txt` keeps it there, because the boot
# parameter sets the initial state and this sets the running one. The
# disagreement is the point and it is a cost, stated here rather than argued
# later (R12):
#
#   F does not use Linux's transparent huge pages at all. It maps 1 GiB pages
#   itself, pre-faulted, under RFC 0007, and khugepaged scanning or compacting
#   underneath a reservation is interference the reservation is supposed to
#   exclude. So `never` is right for F's half.
#
#   A tuner running io_uring on Linux would set `always`, and giving the
#   baseline 4 KiB pages because F does not want THP would be a comparison
#   against a machine nobody configures. So `always` is right for the baseline
#   half.
#
#   The asymmetry therefore *raises* the baseline. A reader who suspects this
#   directory of flattering F should start here, and find the knob turned the
#   other way.
#
# `defrag = always` — synchronous compaction at fault time — for the same
# reason. The workload faults and locks its buffers before the measurement
# window opens, so compaction is paid in setup; `defer+madvise`, the usual
# default, would quietly hand the baseline 4 KiB pages whenever a huge one was
# not immediately available, which is exactly the flattering failure above with
# no line in any log.
#
# khugepaged is then told not to defragment on its own during the run: the
# pages exist by the time the window opens and nothing after that should be
# moving them.
thp_enabled               = always
thp_defrag                = always
khugepaged_defrag         = 0

# irqbalance off, and the interrupts pinned by hand to the housekeeping set.
# Off alone is not enough — it leaves whatever affinity the daemon last wrote,
# which on a machine that has ever booted with it running is usually a spread
# across every core including the measured ones.
irqbalance                = off

# The sysctls whose *absence* satisfies this baseline, and the only ones.
#
# `sysctl.conf` fails closed: a knob it names and the kernel does not have is
# drift, because "the knob is missing" and "the feature is off" are different
# statements and only one of them is a configuration. These two are the
# exception, and each is an exception for the same checkable reason — the knob
# exists if and only if the feature was compiled in, so a kernel without the
# knob cannot be doing the thing the setting turns off:
#
#   kernel.numa_balancing          CONFIG_NUMA_BALANCING
#   kernel.sched_autogroup_enabled CONFIG_SCHED_AUTOGROUP
#
# Nothing else goes on this line without the same argument written beside it. In
# particular `kernel.io_uring_disabled` never does: a kernel that lacks it is a
# kernel that cannot say whether io_uring is on, which is the whole reason
# `kernel_min` is 6.6.
sysctl_optional           = kernel.numa_balancing kernel.sched_autogroup_enabled
