# The third gating claim, and it gates for `claims/0005`'s reason rather than a
# new one: **the number is a share of lines, not a duration**. A percentage of a
# named list of functions is the same figure on a fast host and a slow one, and
# `bench/src/lib.rs` refuses to record a timing in a container and is right to.
#
# The wall-clock figures in `[workload] notes` are costs and are in no threshold,
# which is the same split `cargo xtask hostile` and `cargo xtask sweep` both
# make. They are here because a run nobody can afford is a run nobody performs.
name       = "entry-validation-coverage"
status     = "gating"           # pending | tracked | gating
milestone  = "E1"

statement  = """
A submission entry generated by its **structure** — a real opcode with a flag
this build does not know, a live set id with an index one past the set, a length
one byte past the arena, a deadline in the past, a reserved word with a single
bit set, a registration whose region does not divide — drives the
entry-validation path, and the corpus those cases were minimised into covers
**more than 95% of that path's lines**.

The path is a list and not a gesture. `[metrics] path` names thirty-seven
functions across five files; `ENTRIES_PATH` in `xtask/src/main.rs` holds the same
list, and `entries_path_matches_claim` requires the two to be the same set on
every run. Until somebody says which lines are in it, *95% of the validation
path* means nothing, so the list is the claim and the number is a consequence of
it.

Three things the number is measured *with* rather than *despite*, each stated
because a coverage figure is the easiest number in this repository to inflate:

  **From the committed corpus alone.** Not from a long drawn run. A figure taken
    over a seeded run says the generator reaches the path; a figure taken over
    `ring/entries-corpus.txt` says a stranger with this checkout reaches it, in
    seconds, with no seed. The corpus is a release content for the same reason.
  **Per function, by name, out of the instrumentation.** `llvm-cov report
    --show-functions` over the five source files, matched against the list above
    by mangled-symbol fragments. A member that matches no symbol **fails the
    run** rather than shrinking the denominator, which is the one way a coverage
    number goes up because something stopped being measured.
  **With link-time optimisation off.** With `lto = true` — which is what
    `[profile.release]` carries — `llvm-cov` reports mismatched data and hands
    back near-zero coverage for functions that demonstrably ran. So the
    instrumented build is not the shipped build, and this is a figure about the
    source rather than about the optimiser's output. `LTO_GAP`, RFC 0048.

Beside the number, and the reason it is not the whole claim: three **oracles**,
because *no panic* would be free here. `ring/tests/hostile.rs` already drives
nine orders of magnitude more input through the same crate and asks whether
anything crashes; what this asks is whether the answer was *right*.

  **The envelope, exactly.** R04 — unknown opcode, unknown flag, non-zero
    reserved word are refusals and never ignored — computed from the entry's own
    bytes before the code under test sees them, and required to match in domain
    *and* code, in the order `f_ring::execute` and `f_abi::buf::Request::read`
    both state.
  **The ledger.** A slot's generation only ever increases, so an id is never
    reissued. `retire` saturates rather than wrapping precisely so that a slot's
    sixty-five thousandth registration runs out of slots instead of handing back
    a name somebody still holds — and `World::Spent` is a table driven to exactly
    that state, sixty-five thousand registrations at a time, so the assertion has
    something to be about. This is the shape of defect that had already reached
    this tree once: a registration generation that would wrap after 65 536 uses,
    with no test reaching that far.
  **The reach.** A resolved buffer is the one the entry named, inside the set
    the client registered, and a buffer already out is not lent twice.

And a fourth that is an invariance rather than an assertion: `f_ring::execute`
reads neither `deadline` nor `class` and says so, so the same entry with a drawn
deadline earns the same answer. The day that stops being true this goes red,
which is `E1-B06`'s reversal condition arriving as a failing test rather than as
a surprise.

Each oracle has a deliberate defect behind it — `mutate-ignored-flag`,
`mutate-reusable-slot`, `mutate-lenient-index` — and `cargo xtask entries
--mutate` requires each to be found by *its own* oracle and by no other. Three
oracles with one defect between them is one oracle under test and two
decorations, which is RFC 0042's finding applied one task later.

Underneath all of it, the reach counts. Thirty-seven of them, each a **minimum per
262 144 cases** scaled to the run that actually happened. A quarter of a million
cases that all bounced off the first envelope check would report *no finding*
truthfully and would have tested one branch — which is what the first working
version of `ring/tests/hostile.rs` did for a billion draws, and is the reason
this list exists rather than being trusted to be unnecessary.

One gap is declared rather than left to be found. **`FRAME_GAP`**: the frame's
own service, `kernel/src/ring.rs`, is not in the path and cannot be — the kernel
has no host harness, so no instrument in this repository produces a coverage
figure for it. What stands in its place is `cargo xtask run`'s boot, which drives
the same `f_ring::execute` and both of its refusal paths on the target, and
`cargo xtask runtime`'s fourth boot, which drives it against a scribbled header.
Neither is a percentage. RFC 0048.
"""

[baseline]
# No comparison, for `claims/0005`'s and `claims/0008`'s reason. This is an
# absolute statement about how much of this system's own validation path a
# committed corpus reaches, and there is no other system whose entry-validation
# path is the same list of functions.
system  = "none"
notes   = "A coverage figure is only comparable against the same denominator, and the denominator here is thirty-seven functions of this repository. io_uring is the honest peer for the *shape* of the interface and not for this number: its entry validation is spread across a kernel and its coverage is measured, where it is measured at all, over whole files. Comparing 95% of thirty-seven named functions against 60% of a subsystem would be two different questions with one number between them."

[owner]
# R09: every headline claim names the document that owns it.
document = "docs/design/proving-ground.html"
section  = "08"
notes    = "Section 08 is layer 4, and its first bullet is the sentence being tested — *structure-aware generation of submission entries, with coverage feedback, and the corpus committed*. The subsystem that owns the number is the pair `f_abi` and `f_ring`: `abi/src/buf.rs` for the two readings of an entry's buffer fields, `abi/src/lib.rs` for the opcode vocabulary, `ring/src/lib.rs` for the frame's executor, `ring/src/registry.rs` for the service's table, `ring/src/buffers.rs` for what a client does with what a service wrote. RFC 0048 is the design; RFC 0024 and RFC 0028 are what the ledger and reach oracles are assertions of."

[workload]
path     = "ring/tests/entries.rs"
corpus   = "ring/entries-corpus.txt"
seed     = "0xf00dbeefcafe1234"
cases    = 262144
notes    = "Measured on the four-core development container, and none of these is in a threshold. The gate — 262 144 drawn cases — takes about 2.5 s in release, which is what makes it affordable inside `cargo xtask verify`; the whole of `verify` around it is 8 min 17 s. The coverage measurement is a separate and much more expensive step: it rebuilds `f-abi`, `f-env` and `f-ring` with `-Cinstrument-coverage` and with link-time optimisation off, replays the corpus, and merges a profile — about 40 s on a cold target directory and 9.6 s warm — which is why it is a CI step of its own rather than part of the local loop. `cargo xtask entries --mutate` is four runs of 65 536 cases at 42 s, most of it three rebuilds of the crate with one feature each. The recording run, `--record`, is the only build with the per-case coverage signal compiled in, draws 1 048 576 cases, and took 2 min 09 s and 2 min 16 s over two runs: resetting and reading the profile runtime's counter array once per case is roughly an order of magnitude on top of the ordinary run, which is the price of per-input feedback and is why the gate does not have it."

[metrics]
primary   = "path_line_coverage"
secondary = [
  # The two the fuzzer reports itself. Both are zero on a healthy tree, and
  # `cargo xtask entries --mutate` is what shows each can be non-zero.
  "panics",
  "wrong",
  # The count the reach minimums are stated per.
  "cases",

  # And the reach. Every row below is a **minimum**. The three groups are the
  # three questions a reader should ask of a clean fuzzing run: what was drawn,
  # what was answered, and what was refused.
  "family_well_formed",
  "family_unknown_flag",
  "family_unknown_opcode",
  "family_reserved_bit",
  "family_index_past_set",
  "family_forged_generation",
  "family_past_arena",
  "family_unstatable_length",
