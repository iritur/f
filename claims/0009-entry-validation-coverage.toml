# The entry-validation path, function by function.
#
# This is the denominator of the primary metric, and it is here rather than only
# in `xtask` because *which lines are in it* is the whole of what the number
# means. `entries_path_matches_claim` requires this list and `ENTRIES_PATH` in
# `xtask/src/main.rs` to be the same set on every run, so a member added to one
# and not the other fails rather than becoming a published figure nothing
# measures.
#
# What is deliberately **not** in it, and why, is in `statement` above for the
# kernel's service and in `ENTRIES_PATH`'s own documentation for the rest: the
# five `SetId` accessors, which are one expression each and fully covered, and
# the three functions by which a *client* composes an entry rather than a
# service validating one.
path = [
  # The envelope, and the two readings of an entry's buffer fields.
  "SetId::is_issuable",
  "SetId::from_completion",
  "Name::read",
  "Request::read",
  "opcode::is_registration",
  "op::known",
  "Cqe::error",
  "error::unpack",
  # The frame's executor.
  "execute",
  "write_serial",
  "Arena::copy_out",
  # The service's registration table.
  "Table::execute",
  "Table::register",
  "Table::unregister",
  "Table::retire_all",
  "Table::resolve",
  "Table::release",
  "Table::slot_of",
  "Table::issued",
  "retire",
  "negotiated_for",
  "Registered::bind",
  "SharedVirtual::bind",
  "Registered::resolve",
  "Registered::release",
  "SharedVirtual::resolve",
  "SharedVirtual::release",
  # The client's side of what a service wrote.
  "Fixed::from_completion",
  "Fixed::name",
  "Virtual::name",
  "BufferSet::bind",
  "BufferSet::carve",
  "Idle::submit",
  "InFlight::complete",
  "InFlight::reclaim",
  "InFlight::drop",
  "PeerGone::of",
]

[threshold]
# The number the exit is about, in hundredths of a per cent so the row is an
# integer like every other threshold in this registry. 9500 is 95.00%.
#
# `cargo xtask entries --coverage` computes it from the committed corpus and
# refuses a run below it, naming the members that fell short. A figure *above*
# this is still a run that met the claim; a figure below is either a corpus that
# stopped covering a member or a path that grew a branch nothing reaches, and
# the per-member table the command prints says which.
path_line_coverage            = { min = 9500 }

# The count the gate performs — `cargo xtask claim entry-validation-coverage`,
# and `cargo xtask verify`. A minimum rather than an equality because a larger
# run is still a run that met this claim.
cases                         = { min = 262144 }

# The two properties. Zero, and there is no acceptable rate of a validation path
# answering wrongly, so there is nothing here to tune when a run goes red.
panics                        = { max = 0 }
wrong                         = { max = 0 }

# The reach, and the reason the two zeros above are not free. Each is a path the
# generator has to have driven for *no finding* to be a statement about the
# validation path rather than about a run that was refused at the first check.
#
# **Each is stated per `cases` — per 262 144 — and scaled to the run.** So the
# gate enforces the number written here and a short diagnostic run still enforces
# *reached at all*. The values are about a hundredth of what a healthy run
# produces, measured on the four-core development container at the gate's own
# count: a floor that fires on a collapse and not on drift, which is the lesson
# `claims/0008` recorded after a `min = 1` caught only a path that had stopped
# entirely.
#
# The rows below are read from *this file*: `entries_reached` in
# `xtask/src/main.rs` requires every key here to have a counter in
# `ENTRIES_REACHED`, so a row deleted from either side stops being enforced
# loudly rather than quietly.

# What was drawn. The thirteen families, and the split between them is the
# generator's design: `flipped_bytes` is twice any other single family and still
# only an eighth of the run, because an `Sqe` is a typed record whose first
# check is *the reserved word is zero* and sixty-four random bytes fail it with
# probability 1 - 2^-32.
family_well_formed            = { min = 400 }    # observed 49087
family_unknown_flag           = { min = 150 }    # observed 16455
family_unknown_opcode         = { min = 150 }    # observed 16337
family_reserved_bit           = { min = 150 }    # observed 16298
family_index_past_set         = { min = 150 }    # observed 16368
family_forged_generation      = { min = 150 }    # observed 16343
family_past_arena             = { min = 150 }    # observed 16322
family_unstatable_length      = { min = 150 }    # observed 16296
family_past_deadline          = { min = 150 }    # observed 16462
family_indivisible_region     = { min = 150 }    # observed 16461
family_refused_capability     = { min = 150 }    # observed 16547
# The two aimed at a reading rather than at a field, and they are weighted higher
# than any other single family for the reason `Draw::family` gives: `Name::read`
# and `Request::read` hold nine refusals between them, and nine refusals need
# more than one draw in sixteen to be reached.
family_malformed_name         = { min = 190 }    # observed 20452
family_malformed_registration = { min = 190 }    # observed 20438
family_nudged_field           = { min = 110 }    # observed 12275
family_flipped_bytes          = { min = 300 }    # observed 32707

# The one world that costs something to reach, and the only one with a row of
# its own: `World::Spent` is a table driven to `SetId::RETIRED_GENERATION`, which
# is sixty-five thousand registrations, and it is drawn once in two hundred and
# fifty-six cases for exactly that reason. Without this row the ledger oracle
# would have nothing to be about and the run would say so nowhere.
world_spent                   = { min = 10 }     # observed 1053

# What was answered. Without `answers_accepted` and `answers_arena_bytes_copied`
# every refusal row below could be met by a run in which nothing ever succeeded,
# which is a different system.
answers_accepted              = { min = 500 }    # observed 51757
answers_silent                = { min = 30 }     # observed 3249
answers_ids_issued            = { min = 150 }    # observed 15650
answers_buffers_resolved      = { min = 300 }    # observed 34934
answers_buffers_released      = { min = 300 }    # observed 39822
answers_sets_torn_down        = { min = 400 }    # observed 46649
answers_arena_bytes_copied    = { min = 7000 }   # observed 782408

# What was refused, by domain and code. Nine of them, and the three R04 names —
# unknown opcode, unknown flag, reserved not zero — are the rows that would go to
# zero first if the generator ever went back to drawing a reserved word on every
# malformed entry.
refused_bad_address           = { min = 350 }    # observed 39326
refused_feature_not_negotiated = { min = 200 }   # observed 23539
refused_reserved_not_zero     = { min = 250 }    # observed 26274
refused_unknown_flag          = { min = 100 }    # observed 11126
refused_unknown_opcode        = { min = 90 }     # observed 9581
refused_no_such_cap           = { min = 400 }    # observed 41064
refused_revoked               = { min = 180 }    # observed 18900
refused_feature_required      = { min = 450 }    # observed 45230
refused_quota_exhausted       = { min = 50 }     # observed 5643

# And the client's half: what it did with what a service wrote back.
client_namings_taken          = { min = 170 }    # observed 17973
client_buffers_returned       = { min = 50 }     # observed 5193
client_buffers_reclaimed      = { min = 3000 }   # observed 356858
client_submissions_refused    = { min = 70 }     # observed 7806
client_regions_refused        = { min = 40 }     # observed 4457

[hardware]
runner = "runner-class-A"       # pinned bare metal, thermally stable
notes  = "**This claim does not need that machine, and says so rather than pretending.** The primary metric is a share of lines produced by replaying a committed file, so it is the same figure in a container and on bare metal; every reach row is a count produced by a generator driven from a seed, so those are too. `f_bench::Environment` refuses to record a timing here and this records none — the wall-clock figures in `[workload] notes` are costs and are in no threshold. The runner is named because `lint-reproduce` requires every claim to name one with a specification file beside it, and because the day this claim acquires a *rate* — cases a second, which is what would make a much larger count affordable per commit — the machine stops being irrelevant."

[reproduce]
# The registry publishes one command per claim and `lint-reproduce` requires this
# line to be exactly `cargo xtask claim <name>`. That command performs both
# halves: the gate's 262 144 drawn cases with every reach minimum checked, and
# then the coverage measurement over the committed corpus.
command = "cargo xtask claim entry-validation-coverage"
# The halves, separately, for somebody who wants one of them. Not `command`,
# because a registry with two published commands per claim is a registry where a
# stranger has to choose.
coverage = "cargo xtask entries --coverage    # path_line_coverage, from the corpus alone"
corpus   = "cargo xtask entries --corpus      # replay every entry and require each to be clean"
mutate   = "cargo xtask entries --mutate      # three defects, one per oracle"
# What `cargo xtask verify` does NOT run, said here because a gating claim whose
# primary metric nothing local checks is a claim that gates somewhere else.
# `verify` runs the 262 144-case gate and the three defects; it does not measure
# `path_line_coverage`, because that needs a second compile of three crates with
# `-Cinstrument-coverage` and link-time optimisation off. The percentage is
# checked by the `coverage` line above, by `cargo xtask claim` and by the CI
# `entries` job — and `verify`'s closing text now names the omission rather than
# leaving a green line to imply it.

[diagnosis]
# Written now, while the mechanism is understood, rather than at 2 a.m. when it
# is not.
coverage_fell = "the corpus stopped covering a member of the path, or the path grew a branch nothing reaches. The per-member table `--coverage` prints says which, and the two need opposite fixes: a corpus that has fallen behind is `cargo xtask entries --record`, which draws again with the per-case signal on and re-minimises; a *new* uncovered branch is a finding about the code, and the honest answers are a case family that reaches it or a line in this claim saying it is unreachable and why"
member_absent = "a member of the path matched no symbol in the llvm-cov report, and the run refused rather than counting a smaller denominator. Either the fuzzer no longer reaches that function at all — rustc then emits only the zero-coverage placeholder record for it, which this skips — or the symbol mangling moved and `ENTRIES_PATH`'s fragments name a symbol that no longer exists. `llvm-cov report --show-functions` over the five source files prints what it actually saw"
wrong = "an oracle refused the answer, which is this claim's own failure and not `claims/0008`'s. The finding names the oracle in its own line — *the envelope*, *the ledger* or *the reach* — and the `repro` beside it is a whole case, a world and an entry, which stands alone because nothing carries over between cases. Start at the check the oracle names: R04's three refusals are in `f_ring::execute` and `f_abi::buf::Request::read` in that order, the ledger is `retire` and `Table::register`, and the reach is `Table::resolve`"
panic = "the ring panicked on an entry, which is `ring/tests/hostile.rs`'s property and is asserted here too because a panic during a case would otherwise be reported as an oracle failing. That file drives nine orders of magnitude more input at the same crate and is where the diagnosis for a panic lives"
reach_zero = "the run was clean and a path was never drawn or never answered, which is the failure this list exists to make visible. `Draw::family`'s sixteen weights and `Draw::world`'s two hundred and fifty-six are where a family goes to zero; a *refusal* row at zero is more often the code than the generator, because a refusal that stopped being produced is a check that stopped being made"
feedback_absent = "`--record` reported that nothing was kept, which means the profile runtime's counters were not there — the build carried `--features coverage-feedback` and not `-Cinstrument-coverage`, or the other way round. A recorder that keeps nothing and exits zero is a fuzzer claiming feedback it does not have, so this is refused rather than survived. The run's own `feedback` line says which build it was"
