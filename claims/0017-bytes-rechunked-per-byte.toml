  "bytes_rehashed_per_edit_starved_large",
  # The class RFC 0064 named: outside every starved run, and with one inside the
  # window the flat clause allows itself. Recorded with no flat threshold, and
  # with the second clause asserted over it below.
  "bytes_rechunked_per_edit_near_starved_small",
  "bytes_rechunked_per_edit_near_starved_large",
  "rechunk_edits_clear_of_a_starved_run_small",
  "rechunk_edits_clear_of_a_starved_run_large",
  "rechunk_edits_near_a_starved_run_small",
  "rechunk_edits_near_a_starved_run_large",
