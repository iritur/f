  # asserts exactly that, and RFC 0058's second object kind exists because of it.
  # Named `_starved_` and not `_zero_filled_` since RFC 0062: the mixture label
  # decides nothing and the candidate gaps decide everything, so the row is
  # keyed to the content's own structure. The bench prints the drawn period
