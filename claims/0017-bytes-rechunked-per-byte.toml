# The cost of an edit, and the number behind the word *bounded* in `E2-B01`'s
# second exit — "an edit near the start of a large object re-chunks only a
# bounded region". Registered here rather than at `E2-B09` because a bound
# nobody has written down as a number is prose, and this slice is where the
# bound was falsified, reversed and re-stated. `intent/0006-state/plan.md`
# step 8 names this file.
#
# **0017 and not 0016.** `intent/0006-state/spec.md` reserves 0016 for
# `write-amplification`. That hole is now filled — `E2-B02` registered it on
# 2026-09-07 — and the sentence stays because the *reason* it was a hole is what
# the next reader needs: it was a reservation and not a withdrawal, which the
# RFC directory spent two epochs teaching about the number 0012.
#
# **Why this is still `pending` now that the denominator exists.** The claim's
# own subject is *bytes re-chunked per application byte written*, and an
# application byte is defined once, in the spec, as a byte the client submitted
# **on the objects ring**. `bench/src/bin/rechunk.rs` now exists and writes 4096
# bytes at a drawn offset through a real `Store` over a modelled device, which
# is a write path and a denominator — and it is not a client on a ring, because
# `user/objects` is `E2-B08` and has not been built. So the ratio below is
# counted at a boundary one layer under the one the claim names, and the claim
# says so rather than promoting itself.
#
# **What the two workloads each supply.** `blob/tests/chunker.rs` measures the
# numerator's worst case directly — the distance from an edit to the first
# boundary the two streams agree on again — over 32 (seed, mixture) pairs; the
# bench measures the cost of a write, on both object kinds, at two object sizes.
# One row of the first was not met on the day this file was registered, was
# written down as not met rather than left out, and was **replaced rather than
# widened** by the four rows RFC 0062 produced. One row of the second was not
# met on the day the bench first ran at full geometry, was written down here the
# same way, and was answered by RFC 0064 scoping the clause it belongs to rather
# than by moving the number it failed: see `[diagnosis]`, and RFC 0061, 0062 and
# 0064.
#
# **Both workloads are run by this claim's one command, and every row below is
# compared against what they print.** That was not true until 2026-09-07: the
# reproduction ran the test alone, the bench was unreachable from
# `cargo xtask claim`, and a threshold breach inside it went unobserved inside a
# green `verify`. A threshold nothing compares against is a number in a file.
name       = "bytes-rechunked-per-byte"
status     = "pending"          # pending | tracked | gating
milestone  = "E2"

statement  = """
An edit re-chunks a bounded region around it, and the bound does not scale with
the object — **on content that admits no forced cut near the edit, which is the
clause RFC 0064 added after the bench measured what happens without it.**

The bound is `CHUNK_MAX_BYTES` + `RESYNC_BOUND_BYTES` = 786 432 bytes on the
chunked kind, at both object sizes, so a number that grows with the object
fails, **provided no starved run meets the window that clause allows itself,
`[X + L, X + L + RESYNC_BOUND_BYTES]`**. A starved run is RFC 0061's: a maximal
run in which no two consecutive candidates are closer than
`CHUNK_MAX_BYTES − CHUNK_MIN_BYTES` = 245 760 bytes. Where one meets that
window the second clause applies instead — agreement by the run's end plus one
chunk — and that number scales with the object, which is what the second object
kind exists for. On the extent kind the bound is `2 × EXTENT_BYTES` =
2 097 152 bytes, the copy-on-write granularity and not the object's size.

**Why the scope sentence is there, and it is a measurement rather than a
hedge.** Run at the geometry below, the bench measured
`bytes_rechunked_per_edit_chunked_small` = **1 138 541 bytes against the
786 432-byte threshold**, on 5 of the 158 edits at 8 MiB that were outside a
starved run by the predicate this file used until then — all five on
`concatenated` content, every one of them a hundred kilobytes or so ahead of a
candidate gap of 645 661 or 576 301 bytes that both boundary streams then walked
into and forced a cut in at different phases. RFC 0061's own words are *except
**across** a starved run*; both workloads read *across* as *inside*. RFC 0064
scopes the clause by the window rather than by the point, moves no threshold and
no constant, and the four rows are re-measured at **345 390 bytes at 8 MiB and
262 144 at 128 MiB** — sixteen times the object and a smaller number, which is
the comparison that makes this a bound rather than a description.

What the scope costs, stated because a scope that is not priced is an excuse:
the flat clause covers **231 of the 1280 drawn edits**, 117 and 114 at the two
sizes. The rest are excused by the second clause — 87 near a starved run and 962
inside one, most of the latter on the three mixtures RFC 0062 accounts for —
zero-filled by the register's fixed point, the two periodic ones by its theorem — and the second clause is *asserted* over every one of them at
`rechunk_edits_exceeding_the_second_clause = 0`, because a class excused from
one clause and asserted under none is a class that cannot go red. On uniform
content the arithmetic says the flat clause covers about 74% of edits: roughly
one edit in four, on content this chunker is good at, has a cost the flat clause
does not bound.

**The extent kind, and RFC 0058's two predictions confirmed.** The extent path's
maximum is 2 097 152 bytes — exactly `2 × EXTENT_BYTES`, and *the same number at
8 MiB and at 128 MiB*, so it is bounded by the granularity and not by the object;
`pieces_touched_max` is 2. Straddling writes are 5 of the 1280 drawn, **0.391%**,
against the `4095 / 1048576` = 0.3906% RFC 0058 derived from the geometry before
anything was built. One straddling write per cell is *placed* rather than drawn,
and the count of placed writes is printed beside the drawn one so that nobody has
to guess which observations were arranged.

What the second workload measures, and it is the numerator rather than the
ratio — kept because the rows above rest on it and because the stricter reading
of the starved clause lives there. `blob/tests/chunker.rs` inserts a drawn run of bytes at a drawn offset into a
drawn object, chunks both streams, and reports the first offset at which the two
boundary sequences agree again. Over eight recorded seeds and four content
mixtures:

  the published bound holds on **32 of 32** (seed, mixture) pairs — no pair
    re-agrees later than `max(X + L + RESYNC_BOUND_BYTES, starved_end +
    CHUNK_MAX_BYTES)`, which is zero violations — **on an effective sample of
    18**. On the other 14 pairs — 8 zero-filled, 5 periodic, 1 concatenated —
    the allowance reaches past the edited object's own end, so `agreed >
    allowed` cannot be true whatever the chunker does, and on every one of those
    14 `agreed` *is* the object's end: nothing after the edit was preserved. The
    starved clause that produces that allowance is RFC 0062's decision and is
    not in question here. The count is, because *32 of 32, zero violations*
    without it reports more than the run measured, and the number a reader needs
    in order to weigh the loosening is the 18;
  the tighter flat clause — agreement by the first accepted boundary at or after
    `X + L + CHUNK_MIN_BYTES + 64` — applies on 13 pairs, holds on all 13, and
    is met *exactly* on 12 of them;
  and the split between the bound's two clauses, which is recorded as counted
    data rather than as a distribution the design promises: **13 of 32 pairs
    have their edit outside a starved run**, 5 of the 8 periodic pairs are
    starved and all 8 zero-filled pairs are, and every unstarved pair is carried
    by the flat clause.

The third of those replaced a row that was red, and the row was red because RFC
0061's arithmetic about periodic content was wrong rather than because the
chunker was built wrong. RFC 0062 is the reversal and it withdraws a forecast,
not the rule: a period below `CHUNK_MIN_BYTES` = 16 KiB is starved under *every*
boundary rule this design permits, because past the first 64 bytes the register
on `p`-periodic content is a function of `i mod p`, so any predicate over a
bounded window has a candidate set closed under adding `p`, and a set with that
symmetry offers no candidate the minimum will accept. The measurement that says
so is on the drawn periodic objects rather than the edited ones: candidates at
or after position 64 are 41, 0, 0, 0, 77, 0, 83 and 0 over seeds 1 to 8, against
drawn periods of 63 201, 56 522, 5783, 33 219, 48 380, 29 558, 57 751 and
53 363 — all-or-nothing, exactly as the argument requires, and the 1, 1, 3 and 1
candidates the *edited* objects carry are the insertion's uniform bytes.

Deduplication, measured on the same pairs and recorded because a reader will
reach for it as a check on the above and it is not one: 32 of 32 pass, **on an
effective sample of 19**. Uniform content deduplicates 1 885 867 to 2 080 094
bytes of the 1 572 864 owed. On the other 13 pairs — 8 zero-filled and 5
periodic — the allowance covers the whole two-megabyte shared run, the
requirement is zero and the assertion holds at `agreed = 0`; **5 of those, all
periodic, deduplicated nothing at all**. That last number is the design's worst
case rather than a defect and RFC 0062's theorem predicts it: two placements of
the same period-below-`CHUNK_MIN_BYTES` run differ in the phase of their forced
cuts and share no chunk. It is recorded rather than asserted against a floor,
because a floor above zero there would be a number this chunker cannot meet. A
defect that makes every boundary after an edit wrong costs a byte-weighted
average only in the region where the boundaries actually disagree, so a
respectable deduplication ratio beside a destroyed resynchronisation bound is
what this class of failure *looks like*. Neither number checks the other.
"""

[baseline]
# `claims/0014` gives the reason this one inherits, and RFC 0058 sharpens it.
# The systems `docs/design/lineage-and-debts.html` compares against do not
# expose this count: a filesystem that rewrites a file in place re-chunks
# nothing because it chunks nothing, and a content-addressed store that does
# chunk does not publish bytes-rescanned-per-edit. A comparison against a system
# answering a different question is worse than none. Adding one is a versioned
# directory under claims/baselines/ and a diff somebody writes, never an edit
# here.
system  = "none"
notes   = "An absolute statement about what this chunker was made to do, rather than a ratio against somebody else's. The number is falsifiable without a peer: the threshold is a stated multiple of two compiled-in constants, and a measurement above it means the bound is not a bound."

[owner]
# R09: every headline claim names the subsystem that owns it.
document = "docs/design/deadline-all-the-way-down.html"
section  = "04"
notes    = "Section 04 is where the sentence being priced lives — line 204, *an edit near the start of a large file does not re-chunk everything after it* — which `E2-P02` measured false on periodic content and RFC 0061 restates. The subsystem that owns the number is the chunker, `blob/src/chunk.rs` with the mask in `blob/src/gear.rs`; RFC 0061 is the decision, RFC 0062 is what its own confirming run bought — the rule stands, the forecast about which clause carries periodic content does not — RFC 0064 is what the bench bought, which is the scope of the flat clause and not its number, RFC 0058 is the second object kind that answers the class neither reaches, and `E2-P02` and `bench/src/bin/rechunk.rs` are the two workloads."

[workload]
# Today's workload, and it is deliberately not the one this claim will finally
# be taken with. `blob/tests/chunker.rs` measures the numerator — the distance
# from an edit to re-agreement — over content drawn from `Env`, which is the
# only thing that can be measured before a store exists. `E2-B09` replaces this
# path with `bench/src/bin/rechunk.rs`, which is where the denominator arrives:
# two object sizes so that a number scaling with the object fails, 4 KiB writes,
# and both object kinds. The row is a path rather than a description so that
# swapping it is a diff naming the swap.
path      = "bench/src/bin/rechunk.rs"
# The second workload, and it is a row rather than a sentence because both are
# run by this claim's one reproduction command and neither on its own carries
# the table below. `cargo xtask claim bytes-rechunked-per-byte` runs the test
# first — it is seconds against the bench's minutes, so a red cheap row says so
# before the expensive one starts — then the bench, then compares every row of
# `[threshold]` against what the two printed. A row neither prints is a failure
# and not a silence: that was the state this claim was in until 2026-09-07, when
# the bench measured 1 138 541 against a published 786 432 and nothing in the
# tree said a word, because `path` named the file below and the route ran it.
also      = "blob/tests/chunker.rs"
seeds     = 2
mixtures  = 5
pairs     = 32
edits     = 1280
notes     = "**Two workloads, and which row comes from which is the whole of why there are two.** `bench/src/bin/rechunk.rs` writes 4096 bytes at a drawn offset into an 8 MiB and a 128 MiB object, on both object kinds, over five iterated mixtures and two seeds — 1280 edits — and it is where the write path, the extent kind and the object-size comparison live. `blob/tests/chunker.rs` inserts a drawn run into a drawn 2-to-4 MB object over eight seeds and four mixtures — 32 pairs — and is where the resynchronisation and deduplication rows live, because those need a pair of streams rather than a write path. The `resync_*` and `dedup_*` rows below are the test's; every other row is the bench's. — Four content mixtures in the test, iterated rather than drawn: uniform, zero-filled, periodic with a period below `CHUNK_TARGET_BYTES`, and concatenations of those. The mixture is the load-bearing part of the geometry and is stated rather than left in the source — uniform bytes alone would have let a chunker that is bad at zero-filled content pass without anybody seeing it, and the periodic mixture is the one that falsified the first bound. The bench draws a fifth — periodic below `CHUNK_MIN_BYTES`, which RFC 0062 owed this claim by name — with the drawn period printed beside every number it produces, because a bounded cost at a 48 KiB period means one thing and at a 4 KiB period means another. — What no run in this tree observes yet: a re-chunk driven by a client's write **over the objects ring**, which is why this claim is still `pending` after the denominator arrived. The bench's denominator is a 4096-byte write through a real `Store` over a modelled device, which is a write path and not a client; `user/objects` is `E2-B08` and does not exist. — **What `E2-B09` owed this workload, paid on 2026-09-07.** A periodic-below-`CHUNK_MIN_BYTES` object, drawn at a period below 16 KiB and with that period recorded beside the number, as its own row next to the zero-filled one. The 786 432-byte threshold does **not** apply to it: on starved content the re-chunk cost scales with the object, which is the design admitting what it admits, and a threshold there would be either false or vacuous. It is recorded for the reason the zero-filled row is — so that the number the design is bad at is visible rather than averaged into a mean — and the period must be below 16 KiB, because a bench drawing 48 KiB periods would report a bounded number and hide the whole class RFC 0062 names. The extent-kind rows are owed on that content too: periodic content below the minimum is now a measured member of the class the second object kind exists to serve, so a run that never handed the extent path that content has not measured the case the kind was bought for."

[metrics]
# Distributions rather than summaries where there is a distribution to keep:
# the per-pair agreement offsets are printed per (seed, mixture) by the test, so
# a mean is never the only surviving record.
primary   = "bytes_rechunked_per_edit_chunked_large"
secondary = [
  # The small-object twin, which is what makes the primary a bound rather than a
