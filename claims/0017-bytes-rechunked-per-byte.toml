[threshold]
# Copied from the derivations in `intent/0006-state/spec.md` and RFC 0061 rather
# than invented here, and unmoved by the reversal: RFC 0061 says in as many
# words that `RESYNC_BOUND_BYTES` stays at 512 KiB as the published outer
# allowance, *because a bound whose repair moved its own threshold would be a
# bound fitted to its measurement*.
#
# The primary and its twin. `CHUNK_MAX_BYTES` 256 KiB + `RESYNC_BOUND_BYTES`
# 512 KiB, the same number at both object sizes.
# **The scope these four are stated over, and RFC 0064 is where it was
# established with a measurement rather than assumed.** They are maxima over the
# edits *clear of every starved run* — no maximal candidate gap of
# `CHUNK_MAX_BYTES - CHUNK_MIN_BYTES` = 245 760 bytes meets
# `[X + L, X + L + RESYNC_BOUND_BYTES]`. That predicate is a function of the
# content and the edit and is fixed before the chunker runs; it is not the set of
# edits that passed, which would be the fitted threshold the `[diagnosis]` below
# tells the next reader not to write. Measured 345 390 and 262 144 — sixteen
# times the object and a smaller number.
bytes_rechunked_per_edit_chunked_large  = { max = 786432 }
bytes_rechunked_per_edit_chunked_small  = { max = 786432 }
# Re-hashing cannot exceed re-scanning; equality is the expected case and this
# row exists so that a run reporting more hashed than scanned is red rather than
# interesting.
bytes_rehashed_per_edit_chunked_large   = { max = 786432 }
bytes_rehashed_per_edit_chunked_small   = { max = 786432 }
# The published outer allowance on its own, which is the second clause of the
# bound and the row a starved object is allowed to exceed.
resync_bytes_max                        = { max = 524288 }
# **The positive control on RFC 0064's scope, and the reason that scope is not
# an excuse.** A scope that excuses every edit asserts nothing, so the count it
# still covers is a threshold. Sixty-four is derived and not measured: the
# uniform mixture alone puts `seeds x writes` = 128 edits into each size, and on
# uniform content the candidate gaps are geometric with mean `2^MASK_BITS` =
# 65 536 bytes, so an edit is inside a starved run with the length-biased
# probability `(1 + r)e^(-r)` = 0.112 at `r = 245760 / 65536` = 3.75, and a
# starved gap begins inside the 512 KiB window with probability
# `1 - e^(-8 e^(-r))` = 0.172 — leaving 0.736 clear, about 94 of the 128, with a
# standard deviation near five. Sixty-four is six of those below it and is
# reachable by a broken generator and nothing else. Measured 117 and 114 in
# total, of which the uniform mixture's own share is 99 and 102 — the rest is
# the concatenated mixture, and the three RFC 0062 accounts for contribute
# nothing at all.
rechunk_edits_clear_of_a_starved_run_small = { min = 64 }
rechunk_edits_clear_of_a_starved_run_large = { min = 64 }
# **The excused classes' own threshold**, over both sizes and both classes:
# `agreed <= max(X + L + RESYNC_BOUND_BYTES, run_end + CHUNK_MAX_BYTES)`, with
# the run taken from the content rather than from where the two streams happened
# to agree — an allowance derived from the outcome would be satisfied by any
# outcome. Zero is the only threshold it can have, because RFC 0061 states the
# clause as an equality of kind: the sequences agree by the end of the run plus
# one chunk. Measured 0 over the 1049 excused edits of 1280, which is the first
# run in which that clause was asserted anywhere rather than assumed.
rechunk_edits_exceeding_the_second_clause = { max = 0 }
# Property 4 as RFC 0061 states it: every pair inside the published bound.
# Measured 32 of 32, and the row below says on how many of them that could have
# come out otherwise.
resync_pairs_within_the_published_bound = { min = 32 }
# **The effective sample, and the row the audit of this slice bought.** The
# allowance is `max(flat, starved_end + CHUNK_MAX_BYTES)`, so on a pair whose
# starved run reaches the object's end the allowance is past the end, `agreed`
# is at most the end, and the row above cannot fail there. Measured 14 of 32,
# leaving 18 the bound was exercised on. Neither bound here is the measurement.
# The floor is exact: zero-filled content has no candidate anywhere, so all
# eight of its pairs are in this count by the same fixed-point argument that
# gives `resync_pairs_starved_zero_filled` its exact 8, and a count below eight
# is that fixed point having drifted. The ceiling is `32 − 4`, derived from
# `resync_pairs_unstarved`'s positive control: an unstarved pair's allowance is
# the flat clause, which on an object of two megabytes and up lands well before
# the end, so every unstarved pair is falsifiable and at most 28 pairs are not.
resync_pairs_where_the_allowance_exceeds_the_object = { min = 8, max = 28 }
# **The four rows RFC 0062 put where `resync_pairs_carried_by_the_flat_clause`
# was.** That row required the flat clause to carry 24 of 32 pairs and measured
# 16. It is replaced and not widened: 16 is the measurement, and a threshold set
# to the measurement is the fitted number the `[diagnosis]` below tells the next
# reader not to write. What replaces it is keyed to the candidate gap the edit
# sits in rather than to a mixture name, because RFC 0062's theorem says the
# name decides nothing.
#
# Carriage, restated over content: every pair whose edit is outside a starved
# run agrees by the first accepted boundary at or after
# `X + L + CHUNK_MIN_BYTES + 64`. Zero is the only threshold this row can have —
# outside a starved run no forced cut separates the streams and the window
# argument applies unaided. Measured 0 of 13.
resync_pairs_unstarved_missing_the_tight_clause = { max = 0 }
# The positive control, without which the row above passes by having no pairs to
# apply to. A uniform edit lands in a 240 KiB candidate gap with probability
# `e^(−3.75)` = 2.4%, so the eight uniform seeds alone put four beyond anything
# but a broken generator. Measured 13.
resync_pairs_unstarved                  = { min = 4 }
# The starved fraction on periodic content, and the largest threshold eight
# seeds can carry: `P(empty) = e^(−p / 65536)` averages 0.632 over the drawn
# periods, so a correct mask starves all eight with probability 2.6%. At eight,
# `MASK_BITS` or the gear table has drifted and the chunked kind has stopped
# serving periodic content altogether. Measured 5.
resync_pairs_starved_periodic           = { max = 7 }
# Exact rather than statistical, and a second guard on the fixed point
# `claims/0018` guards from the other side: zero-filled content has no candidate
# anywhere, so every edit in it is inside a starved run. Measured 8.
resync_pairs_starved_zero_filled        = { min = 8, max = 8 }
# The deduplication half's own effective sample. `owed` is the shared run less
# the allowance, so a pair whose allowance covers the whole two-megabyte run
# requires nothing and passes at zero deduplicated bytes; measured 19 of 32 with
# something to prove, and 5 of the other 13 deduplicated nothing. The threshold
# is the eight uniform pairs' positive control and is derived the way
# `resync_pairs_unstarved` is — a `STARVED_GAP_BYTES` gap in uniform content has
# probability `e^(−3.75)` = 2.4% and this needs a chain of them spanning the
# object — so four is out of reach of anything but a broken generator. There is
# deliberately no floor on the deduplicated bytes of a starved pair: RFC 0062's
# theorem says two placements of a period-below-16-KiB run share no chunk, so a
# floor there would be a number the design cannot meet.
dedup_pairs_with_a_non_zero_requirement = { min = 4 }
# The extent kind, RFC 0058's number and the comparison this claim exists to
# make. `2 x EXTENT_BYTES` = 2 097 152 is the copy-on-write granularity, and the
# row that makes it a *bound* is the pair: the same maximum at 8 MiB and at
# 128 MiB. Measured 2 097 152 at both, which is the worst case reached rather
# than approached — a 4 KiB write that straddles a piece boundary rewrites two
# whole pieces, and the workload places one per cell so that the case is
# observed rather than waited for.
bytes_rechunked_per_edit_extent_small   = { max = 2097152 }
bytes_rechunked_per_edit_extent_large   = { max = 2097152 }
bytes_rehashed_per_edit_extent_small    = { max = 2097152 }
bytes_rehashed_per_edit_extent_large    = { max = 2097152 }
# Two, and it is what the 2 above is made of: a 4 KiB write touches one piece or
# two, and three would mean the piece size or the write size had moved without
# the threshold moving with it.
pieces_touched_max                      = { max = 2 }
# The geometry `bench/src/bin/rechunk.rs` owes, as minimums, so that the two
# object rows above are a bound and not a description of a small draw.
object_bytes_small                      = { min = 8388608 }
object_bytes_large                      = { min = 134217728 }
write_bytes                             = { min = 4096, max = 4096 }
writes_per_object                       = { min = 64 }

[hardware]
runner = "runner-class-A"       # pinned bare metal, thermally stable
notes  = "**This claim does not need that machine, and says so rather than pretending** — the same note `claims/0014` carries. Every metric is a count of bytes the chunker scanned or hashed, taken by the workload itself, and it is the same count on a fast host and a slow one; `f_bench::Environment` refuses to record a *timing* and this records none, which is why it may gate in the development container the day it stops being `pending`, the way `claims/0005` does. The runner is named because `lint-reproduce` requires every claim to name one with a specification file beside it."

[reproduce]
command = "cargo xtask claim bytes-rechunked-per-byte"

[diagnosis]
# Recorded while the system is understood rather than at 2 a.m. when it is not.
resync_pairs_starved_periodic_above_7 = "the mask has drifted and nobody noticed what it does to short periods, which is the regression RFC 0062 documents happening once already — `MASK_BITS` 14 to 16 moved `P(empty) = e^(−p / 65536)` from 0.245 to 0.632. At eight of eight the chunked kind has stopped serving periodic content altogether rather than serving a third of it. **The diagnosis is not that a better rule exists.** A period below `CHUNK_MIN_BYTES` = 16 KiB is starved under every boundary rule this design permits, because the candidate set of any predicate over a bounded window of `p`-periodic content is closed under adding `p` and a minimum of `m > p` accepts none of it. So the repair is RFC 0058's second object kind and not a chunker change, and the only knob that moves the class is `CHUNK_MIN_BYTES` itself — which is a superblock field, decides every object hash ever written, and costs the size distribution `claims/0018` gates on. Local-maximum chunking is the answer this row used to name and RFC 0062 forecloses it: MAXP's minimum is its own 32 KiB window, so it starves strictly *more* periods, including both of the ones RFC 0058 names"
resync_pairs_unstarved_below_4 = "the positive control has gone, and with it the meaning of the two rows above it: the tight clause and the carriage check are both conditioned on the edit being outside a starved run, so a run in which everything is starved asserts nothing while reporting green on both. Look first at the generator — a draw that stopped producing uniform content would do this — and only then at the chunker"
bytes_rechunked_per_edit_above_786432 = "the bound is failing as a bound on the content it is stated over, and there is no clause left to move it into — the mixture is not the question and the starved run is not the answer, because the row is already scoped to edits with no starved run in the flat clause's own window. RFC 0064 is the entry that put that scope there and it says this is the observation it most wants somebody to go looking for. Read the per-edit line the bench prints beside the violation: it names the edit, the region rescanned and the widest candidate gap crossed. A gap below `CHUNK_MAX_BYTES − CHUNK_MIN_BYTES` = 240 KiB there means no cut was forced anywhere in the region, which leaves the acceptance rule reading something outside its window, and `blob/src/chunk.rs`'s three words are where to look. **What is not a repair is widening this row.** The number a violation reports is a fact about one drawn candidate gap; the next seed draws a different one, and a threshold set from the measurement is red again the first time a wider gap appears"
rechunk_edits_exceeding_the_second_clause_above_0 = "the *second* clause is wrong, which is a larger finding than a red flat row and lands in the same command. RFC 0061 says the two sequences agree by the end of the starved run plus one chunk; a violation says they do not, and then the bound has no clause that holds — not the flat one, which this content was excused from, and not this one. Look at `starved_end` and at the forced-cut suppression in `blob/src/chunk.rs` before anything else: the clause rests on a forced cut being taken at exactly `CHUNK_MAX_BYTES` from the previous boundary in both streams once the run ends"
rechunk_edits_clear_of_a_starved_run_below_64 = "the scope has eaten the sample and the four rows above it are green over nothing, which is the same vacuity `resync_pairs_unstarved` names one level up and has the same first suspect: the generator. A draw that stopped producing uniform content does this. The second suspect is `MASK_BITS`, which sets candidate density and therefore how often a 240 KiB gap appears — the floor of 64 is derived from gaps being geometric with mean 65 536 bytes, so a mask change invalidates the derivation before it invalidates the count"
large_and_small_disagree = "the number scales with the object, which is the failure the two rows exist to separate. That is phase-lock: two cut orbits with identical spacing and different phase, which the chunker was rewritten to remove. Reproduce with `cargo test -p f-blob --test chunker` and read which clause carried each pair before concluding anything about the store"
resync_pairs_where_the_allowance_exceeds_the_object_above_28 = "the bound is being asserted on a sample smaller than the positive control allows, so `resync_pairs_within_the_published_bound` has become a count of pairs that could not fail rather than a count of tests. Read it with `resync_pairs_unstarved`, which fails at the same time and for the same reason: the draw has stopped producing content the chunker can cut. Look at the generator before the chunker. Below 8 is the opposite event and a worse one — zero-filled content has acquired a candidate, which is the register's fixed point hitting the mask, and every object hash ever written has changed"
dedup_pairs_with_a_non_zero_requirement_below_4 = "property 5 is passing on a draw it asserts nothing about, which is exactly the state this row was added to make visible: `owed` is the shared run less the allowance, and an allowance that has grown to cover two megabytes on most pairs makes `agreed >= owed` true at zero deduplicated bytes. It is the same event as the row above and has the same first suspect, the generator. What it is *not* evidence of is a deduplication regression: a starved pair deduplicating nothing is RFC 0062's theorem holding, and the number that would say deduplication had regressed is a shortfall on a pair whose requirement is not zero"
zero_filled_row_missing = "the workload stopped drawing the zero-filled mixture, and the starved case has gone back to being a number averaged into an aggregate. That is the shape `intent/0006-state/spec.md` names as the thing not to do to it"
