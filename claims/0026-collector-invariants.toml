# RFC 0059's three invariants, and the counts that say the run reached the
# instants they are stated at.
#
# **Why a property test needs a claim at all.** Because the interesting failure
# of an invariant test is not a red run, it is a green one that asserted
# nothing. I1 is evaluated at the instant a `ZONE_RESET` is submitted, so a run
# in which no zone was ever reset asserts it zero times and passes; I3's bound
# is one collector operation ahead of a hard-class read, so a run in which no
# hard-class entry ever had anything to overtake passes on a queue that has
# stopped ordering by rank. `zone/tests/invariants.rs` fails on each of those,
# and this registry is where the numbers behind those refusals are published —
# so that a change which quietly stopped reaching a case is a red row in a
# reproduction command rather than a comment nobody reads.
#
# **0026 and not a reserved number.** `intent/0006-state/spec.md`'s registry
# list has six entries and none of them is `E2-P03`'s; 0019 through 0022 are
# reserved (`resident-bytes-per-unit-of-work`, `read-path-latency`,
# `generation-swap-pause`, `copies-per-read`), 0023 and 0024 are registered
# files, and 0025 is `cut-outcomes` in this same diff. A reservation outranks a
# landing here — `claims/0017` established that when it skipped 0016 for a claim
# that did not exist — so this takes the first number that is neither.
name       = "collector-invariants"
status     = "gating"           # pending | tracked | gating
milestone  = "E2"

statement  = """
The collector's three invariants hold at every instant RFC 0059 states them at,
while allocation, a hard-class reader and the collector are interleaved — and
the run reaches each of those instants often enough for that to mean something.

Measured by `cargo xtask claim collector-invariants` —
`zone/tests/invariants.rs` over four seeds, a modelled zoned device of 256 KiB
zones, collection and one client action interleaved step by step:

  collector operations ahead of a hard read        1   the bound, and the witness
  I1 evaluations, at a reset instant               38
  I2 evaluations, at every step boundary        4 926
  I3 evaluations, at every step boundary        4 926
  ZONE_RESET submissions                           38
  of those, with a multi-zone publish open          8
  resets held by the third conjunct                10
  hard-class entries submitted                    414
  of those, bytes read back and verified          185
  of those, submitted behind queued work          232
  collector operations queued as backlog          687
  multi-zone publish: zones spanned                34
  collector cycles begun                           14
  collector steps                               2 411

**I1 is asserted twice over and the second is what makes it evidence.** Once as
the mechanism RFC 0059 says implies it — every root in `R` marked, every bit of
`B` in the condemned zone's range clear — and once as the formula itself,
`blobs(z) ∩ reach(R) = ∅`, over a walk this run does from the store's own
hash-to-block map rather than from the collector's bitmap. A mark that was
wrong satisfies the mechanism and fails the formula, which is the difference
between a collector checking its own homework and a collector being checked.

**I3's witness is required to equal the bound, not merely to respect it.** At
zero the invariant held because nothing was ever ahead of anything, which tests
nothing; above one it is false. So `collector_operations_ahead_of_hard_read` is
pinned at 1 in both directions, and the 687 backlog entries are why the run can
reach it: `Queue::collector_operation` drives one operation at a time, so with a
backlog of one the witness is bounded by the device's chain length whatever the
queue's ordering does. That was measured rather than assumed — the ordering was
replaced by arrival order and the run stayed green until the backlog existed.

**Concurrency here is a seeded interleaving and not threads, by policy.** RFC
0004 puts ordering behind `f_env::Env`, so *concurrent* means *interleaved at a
stated granularity*: one collector step — at most one device operation plus
bounded computation, which is the unit RFC 0059 says a cycle is a sequence of —
and one drawn client action between each pair. Two runs of one seed interleave
identically, which is what makes a failure a reproduction rather than an
anecdote. A threaded version of this run would not be a stronger test; it would
be the policy violation, and it would publish a number nobody could re-derive.
"""

[baseline]
# No other system, and the comparison that would matter is not against one. What
# is claimed is that three named predicates hold over this collector's own state
# at instants this collector defines; a generational collector in another
# runtime holds different predicates over different state.
system  = "none"
notes   = "The honest baseline for an invariant is the same run with the invariant's mechanism removed, and that comparison is in the tree rather than in a directory: the ordering `Queue` applies by `f_abi::deadline::Inherited::rank` was replaced by arrival order while this run was being written, and the run stayed green until the collector had a backlog — which is the measurement that put `collector_backlog_entries` in the table below. `cargo xtask mutate` is where this project builds that comparison as a command for the frame; the collector has no mutation build yet, and that is stated here rather than implied."

[owner]
# R09: every headline claim names the subsystem that owns it.
document = "docs/design/deadline-all-the-way-down.html"
section  = "04"
notes    = "Section 04 is where the collector is argued as three sentences, and RFC 0059 is what turned those sentences into predicates over named state — the root set `R`, the mark bitmap `B`, each zone's state and live byte count, and the driver's queue — precisely so that `E2-P03` could assert a predicate rather than watch for a symptom. The subsystems that own the number are `zone/src/collect.rs` for the cycle, `zone/src/mark.rs` for `B`, `zone/src/roots.rs` for `R` and the open-publish clause, and `zone/src/queue.rs` for the bound in I3, which is `f_virtio_blk::pending::IN_FLIGHT` re-derived and checked against the driver's own source."

[workload]
path        = "zone/tests/invariants.rs"
seeds       = 4
block_bytes = 512
zone_blocks = 512
notes       = "Four seeds and not one: the interleaving is drawn, and a property asserted against a single schedule is a property asserted against a schedule. Four is what keeps the per-commit gate near the cost of `zone/tests/cycle.rs`; a sweep passes `--seeds`. The 256 KiB zone is smaller than that run's mebibyte on purpose — this run wants *many* zones, because every zone is another selection, another condemnation and another reset instant at which I1 is evaluated, and because it puts a record across a zone boundary routinely. — What stands in: the device is `ZonedMemory` in the host, so nothing here is evidence about a real device's reset latency or about what a driver does under queue pressure; what is modelled is the *ordering*, which is the whole of what the three invariants are about. And I3 is a count of device operations rather than a duration, which RFC 0059 chose deliberately: a bound in time is a clock, and the reversal condition that would change it — a hard-class read missing a deadline with the count at 1 — is not observable from a host model and is not claimed to be."

[metrics]
# Counts, every one of them, and no duration anywhere. The order is the order
# the run prints them in.
primary   = "collector_operations_ahead_of_hard_read"
secondary = [
  "i1_evaluations_at_a_reset",
  "i2_evaluations",
  "i3_evaluations",
  "zone_resets",
  "zone_resets_with_a_publish_open",
  "resets_held_by_the_third_conjunct",
  "hard_reads_submitted",
  "hard_reads_verified",
  "hard_reads_overtaking",
  "collector_backlog_entries",
  "multi_zone_publish_zones_spanned",
  "collector_cycles",
  "collector_steps",
]

[threshold]
# I3, and the one row in this file that is exact in both directions. RFC 0059
# derives the 1 from `f_virtio_blk::pending::IN_FLIGHT` — the one chain
# `Driver::execute` keeps inside the device — and says the row moves when
# `E1-B09` raises it, re-derived in the same diff. Below 1 the bound was never
# approached and the invariant held vacuously; above 1 it is false.
collector_operations_ahead_of_hard_read = { min = 1, max = 1 }
# The three evaluation counts, as floors. Each says the predicate was actually
# evaluated: I1 only at a reset instant, I2 and I3 at every step boundary, so a
# zero in any of them is a run that asserted the invariant zero times and
# reported that it held.
i1_evaluations_at_a_reset               = { min = 1 }
i2_evaluations                          = { min = 1 }
i3_evaluations                          = { min = 1 }
# The cases the workload exists to reach, each a floor and each one of
# `zone/tests/invariants.rs`'s own vacuity refusals written as a number. A reset
# with a multi-zone publish open is the case the first invariant's open-publish
# clause exists for and the one `intent/0006-state/plan.md` names; a reset held
# by `reads_outstanding(z) = 0` is the third conjunct doing something rather
# than being always true; a hard-class entry submitted behind queued work is I3
# having anything to measure; and the backlog is what makes the witness reach
# the bound at all.
zone_resets                             = { min = 1 }
zone_resets_with_a_publish_open         = { min = 1 }
resets_held_by_the_third_conjunct       = { min = 1 }
hard_reads_verified                     = { min = 1 }
hard_reads_overtaking                   = { min = 1 }
collector_backlog_entries               = { min = 1 }
# Two, because the publish held open across the sweeps has to be the multi-zone
# case to be that case at all. A publish inside one zone is the ordinary one and
# the clause is about the other.
multi_zone_publish_zones_spanned        = { min = 2 }

[hardware]
runner = "runner-class-A"       # pinned bare metal, thermally stable
notes  = "This claim does not need that machine, for `claims/0023`'s and `claims/0024`'s reason. Every metric is a count taken by the run itself over a modelled device from a stated seed; there is no clock anywhere in `zone/`, which is `lint-determinism` finding nothing there rather than an oversight, and `f_bench::Environment` has nothing to refuse. The runner is named because `lint-reproduce` requires every claim to name one with a specification file beside it."

[reproduce]
command = "cargo xtask claim collector-invariants"

[diagnosis]
# Recorded while the system is understood rather than at 2 a.m. when it is not.
collector_operations_ahead_of_hard_read_above_one = "I3 is false: a deadline-class read was submitted with more than the device's one in-flight operation ahead of it, which is collection starving a hard-class reader. Read `zone/src/queue.rs` first and `f_abi::deadline::Inherited::rank` beside it — the queue orders by rank and the collector's own work is batch-class, so a witness above one is either the ordering no longer applying or a collector operation that stopped being batch-class. It is not repaired by raising this row: RFC 0059 derives the 1 from `f_virtio_blk::pending::IN_FLIGHT`, so the row moves when `E1-B09` raises that constant and in the same diff that re-derives it"
collector_operations_ahead_of_hard_read_is_zero = "worse than the row above and quieter: the invariant held because nothing was ever ahead of anything. Every hard-class entry went into an empty queue, so the ordering was never asked a question and this run would stay green on a queue that had stopped ordering entirely. Look at `collector_backlog_entries` and `hard_reads_overtaking` in the same output — a zero in either is the cause, and the fix is in the workload rather than in the collector"
i1_evaluations_at_a_reset_is_zero = "no zone was ever reset, so *nothing reachable is swept* was asserted zero times. The collector selects below `SWEEP_LIVE_FRACTION` = 0.25, so the likely cause is a run whose zones never fell below it — check the garbage the pre-phase writes and the unpin actions — and the unlikely one is the sweep no longer submitting `ZONE_RESET` at all, which `zone/tests/cycle.rs` would also see. Either way the invariant is unasserted and the green run means nothing"
zone_resets_with_a_publish_open_is_zero = "the case RFC 0059's open-publish clause exists for did not arise: no sweep took a reset while a multi-zone publish was in flight. That clause is the whole reason a publish registers as a transient root at its first write, and without this row the sweep could reset a zone the open publish is filling and the root record would land naming a zone that no longer holds anything. Read the workload's held-open publish first — it is opened before the first cycle and must survive two resets — not the collector"
resets_held_by_the_third_conjunct_is_zero = "`reads_outstanding(z) = 0` never held a reset back, so the guard's third conjunct was always true and tested nothing. The hard-class reader takes a belief on a zone and holds it across steps; a zero here means either the reader stopped resolving into zones the sweep wants, or `reads_outstanding` stopped being taken. Note that `location` is not gated on condemnation — the run keeps that convention by hand — so a change that let a reader resolve into a condemned zone would move this row in the other direction and hold a reset off indefinitely"
hard_reads_verified_is_zero = "hard-class entries were submitted and none of them read any bytes back, so the reader was a queue entry and not a read. I3 would still be asserted, but the run would no longer be evidence that a hard-class *read* is served — check that the reader resolves a pinned root through the map and verifies what comes back against its own name"
