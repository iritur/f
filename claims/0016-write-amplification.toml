# The number `E2-B02`'s exit calls *write amplification*: device bytes the
# store causes per application byte the client submitted. Reserved at this
# number by `intent/0006-state/spec.md` before `zone/` existed, which is why
# `claims/0017` landed first and why the hole between 0015 and 0017 was a
# reservation rather than a withdrawal.
#
# **Why this is `pending` when the primary row has a number today, and this is
# the whole of the honesty in this file.** The claim's own subject, as the spec
# defines it, is `device_bytes_per_app_byte` counted by QEMU's
# `query-blockstats` on an emulated zoned device, inside a guest, against a
# tuned Linux baseline on the identical device — with `emulated = true` beside
# the runner and copied into the artefact header. No such run has happened. Two
# things are missing and neither is a detail:
#
#   the boot. `intent/0006-state/spec.md` says B02 closes on a QEMU boot of
#     `user/objects` over the blk driver's ring against zoned virtio-blk.
#     `user/objects` is `E2-B08` and does not exist; `user/virtio-blk` numbers
#     the five zone opcodes and answers two of seven. So the boot is owed to a
#     task that has not started;
#   the device. Zoned virtio-blk emulation is materially better from QEMU 8 and
#     the development image is on bookworm's 7.2. `docker/README.md` names the
#     one-line base change to trixie, and the image digest is in every
#     reproduction, so that change is its own commit.
#
# **`E2-P10` paid the third thing and measured the other two rather than
# repeating them.** The baseline is no longer prose: `[baseline] path` below
# names `claims/baselines/linux-6.x-tuned-zoned/`, which exists, holds the device
# geometry and the workload as data beside the tuning, and is checked by
# `lint-reproduce` like any other. What that task found when it went to run the
# comparison is worse than the sentences above, and both halves are now
# measurements rather than expectations:
#
#   the device is not merely *worse* in QEMU 7.2, it is absent. `-device
#     virtio-blk-pci,help` lists no `zone` property and `file.zoned` is rejected
#     as an unexpected parameter. The same 7.2 does emulate zoned *NVMe* — the
#     whole `zoned.*` family on `nvme-ns` — which is the tempting wrong answer
#     and is named here so nobody reaches for it: F has no NVMe driver, so a
#     baseline on ZNS and an F on virtio-blk would be two systems on two devices
#     and this claim's sentence is *on the identical device*. The trixie base
#     change could not be attempted either, because the development container has
#     no network egress: `curl http://deb.debian.org/debian/` does not connect,
#     and `cargo` could not reach `static.crates.io` until the registry volume was
#     seeded from an already-warm one;
#   the boot is still absent after `E2-B08` landed. `user/objects` now exists and
#     its read path is measured, but `user/objects/tests/reads.rs` says in its own
#     header that it is the host over a modelled zoned device and that no QEMU
#     boot has run; `grep -rn zoned xtask/src` finds one doc comment and no verb.
#     So a trixie image would buy a device with nothing on it, which is why the
#     image change is the cheap half and is still not the half that unblocks this.
#
# The baseline README's last section carries the ordered cost of the four things
# that remain, and it is the file to read before anybody plans this again.
#
# What exists is `zone/tests/cycle.rs`: a full fill-seal-copy-forward-reset
# cycle against a modelled zoned device in the host, with every device byte
# counted at the `ZonedDevice` boundary. **A count taken at a different boundary
# is a different count however similar it looks**, so the rows below say which
# boundary each was taken at, and the modelled ones do not gate. The value they
# have is the ratio's *decomposition* — how much is data, how much copy-forward,
# how much block padding — which is a property of the design rather than of a
# device, and which is the part of `E2-B02` a reviewer can check today.
name       = "write-amplification"
status     = "pending"          # pending | tracked | gating
milestone  = "E2"

statement  = """
The store writes at most 1.5 device bytes per application byte, and at most
what a tuned Linux filesystem writes on the identical zoned device.

**Measured at the modelled boundary, and that is not the boundary above.**
`cargo test -p f-zone --test cycle` publishes 64 objects of 128 to 192 KiB into
a modelled zoned device of 20 data zones, one generation in eight pinned, with
the collector held; then collects to quiescence with the client idle; then
counts. From seed 1:

  application bytes submitted        10 558 873
  device bytes, fill phase           10 676 224     1.0111 per application byte
  device bytes, collect phase         1 293 824     0.1225 per application byte
  device bytes, total                11 970 048     1.1336 per application byte
    of which ZONE_APPEND             11 969 536
    of which positioned WRITE               512

  zones reset by the collector               10     of 20 data zones
  ZONE_FINISH entries                        11
  ZONE_RESET entries                         10
  FLUSH entries                             138
  collector steps                         2 637
  operations ahead of an urgent read          1

The decomposition is the part worth arguing with. The fill term is 1.0111
rather than 1.0 because a record is padded to the 512-byte logical block, which
is the whole of the overhead the format costs at rest. The copy-forward term is
0.1225 against the 0.33 that `f/(1 − f)` predicts at `SWEEP_LIVE_FRACTION` =
0.25, because the sweep takes the *least* live zone available rather than one at
the threshold, so the mean live fraction of a swept zone is well under the
quarter that constant admits — RFC 0059 fixes the ceiling and the ranking
decides where under it a run lands. The root records are 512 bytes in total,
which rounds to nothing here and would not on a workload that published sixty
objects one at a time.

**What this run is evidence for, and what it is not.** It is evidence that a
full cycle happens: 10 of 20 data zones were reset, 1 293 824 bytes were copied
forward, 9 kept generations were read back and verified after collection, and a
publish spanning two zones survived a 78-step cycle taken while it was open. It
is evidence that the ratio's shape is what the design says. It is **not**
`device_bytes_per_app_byte` as this claim finally defines it, because nothing
here is counted by a device: `ZonedMemory` is a model, and a model cannot
report the writes a real device does that nobody asked for. That number is owed
by the boot, and the boot is owed by `E2-B08` and by QEMU 8.

The baseline half — `ratio_vs_baseline` against a tuned Linux filesystem — has
a directory and still has no number, and the gap between those two facts is
`E2-P10`'s whole result. `claims/baselines/linux-6.x-tuned-zoned/` is f2fs in
zoned mode with its victim policy, its overprovision ratio, its writeback and
its forbidden mount options as data; the device it runs on as data; and — the
part with no sibling in `claims/baselines/linux-6.x-tuned/` — the workload as
data, because this claim compares two mappings under a load and a load has more
dials than any tuning knob in the directory. Its `verify.sh` checks four of those
dials against `zone/tests/cycle.rs`'s own constants, so the two copies of the
workload cannot drift apart silently.

**No number was taken against it and none may be invented for it.** A ratio
needs a numerator this tree cannot produce and a denominator this environment
cannot run, and the four things standing between here and both are listed in
that directory's README with what each costs. A comparison against an untuned or
an imagined Linux would be worse than this empty row: an empty row is a debt, and
a wrong row is evidence.
"""

[baseline]
# It was `none` until `E2-P10`, with the debt recorded in prose beside it because
# naming a directory that did not exist would have made `lint-reproduce` red for
# the right reason. The directory exists now, so the name moves out of the
# sentence and into the row, where a lint reads it: `lint-reproduce` requires the
# README, the apply and the verify, `cargo xtask release` packages the whole of
# `claims/baselines/`, and the directory's own `verify.sh` reads this row back
# and fails when the claim stops naming it.
#
# **A named baseline is not a measured one, and this row is the first half
# only.** `system` says which configuration the comparison is against;
# `ratio_vs_baseline` under `[threshold]` says what the comparison must show; and
# nothing anywhere in this file says what it did show, because it has not been
# run. `status` is still `pending` and that is the field to read.
system  = "linux-6.x-tuned-zoned"
path    = "claims/baselines/linux-6.x-tuned-zoned"
notes   = "f2fs in zoned mode, cost-benefit victim selection, 20 percent overprovision, writeback held as long as the kernel will hold it, and `fsync_mode=strict`, barriers on and compression off as fairness constraints that cost the baseline rather than tuning that helps it. The device is configuration in the same directory — 48 zones of 64 MiB, four of them conventional, a 4096-byte logical block that costs F more than it costs the baseline — because *on the identical device* is the whole of what this claim compares and a device described in prose is one the two halves can quietly disagree about. Nothing in that directory has been run: the ratio row has no number and this claim cannot be more than `pending` however good the absolute figure looks. The absolute row is falsifiable without a peer — 1.5 is derived from `SWEEP_LIVE_FRACTION` = 0.25 as 1.0 for the data plus `f/(1 − f)` = 0.33 of copy-forward plus padding and root records, totalling 1.39 with the rest as margin — and the ratio row is not falsifiable at all without one. Re-tuning produces a new versioned directory beside that one, never an edit to it — with the one exception that directory's reversal condition states, which is that a configuration no number has ever been taken against may still be corrected in place."

[owner]
# R09: every headline claim names the subsystem that owns it.
document = "docs/design/deadline-all-the-way-down.html"
section  = "04"
notes    = "Section 04 is where the zoned mapping and its copy-forward are argued. The subsystem that owns the number is `zone/`: `zone/src/map.rs` for the fill, `zone/src/collect.rs` for the sweep and its ranking, `zone/src/device.rs` for the counting boundary. RFC 0059 is the decision that fixes `SWEEP_LIVE_FRACTION` = 0.25 and the three invariants the cycle asserts, and RFC 0060 is the barrier sequence the FLUSH count above is a count of."

[workload]
path      = "zone/tests/cycle.rs"
objects   = 64
seeds     = 1
notes     = "Phased, and the phasing is load-bearing rather than convenient: *fill N zones with the collector held; collect to quiescence with the client idle; count*. Copy-forward bytes depend on the live fraction at the moment each zone is swept, so a collector running concurrently with a client makes this number a function of the interleaving between two components rather than of (seed, commit). RFC 0059 requires the phasing and the explicit `COLLECT` verb that makes it expressible. — One seed and one object count are the defaults; `--objects 256` and `--seed` are arguments, and a longer run is a different draw rather than a different measurement. — **What the workload is not**: a boot. It is a host process against `ZonedMemory`, a model of a zoned device, reached through the same `ZonedDevice` trait the driver will implement. RFC 0034 is why a modelled device is allowed to be a peer on the real types; it is not why a modelled device may be called a device in a published ratio, and this claim does not call it one."

[metrics]
# Two boundaries, and every row says which. The `device_*` rows are the claim's
# subject and have no number; the `modelled_*` rows are what
# `zone/tests/cycle.rs` counts and are recorded so that the design's arithmetic
# can be checked before the boot exists.
primary   = "device_bytes_per_app_byte"
secondary = [
  "ratio_vs_baseline",
  "modelled_device_bytes_per_app_byte",
  "modelled_fill_bytes_per_app_byte",
  "modelled_copy_forward_bytes_per_app_byte",
  "zones_reset",
  "data_zones",
  "zone_finish_entries",
  "zone_reset_entries",
  "flush_entries",
  "collector_operations_ahead_of_hard_read",
]

[threshold]
# **The two rows this claim finally gates on, stated now and measured never.**
# They are here rather than added later because a claim registered without its
# thresholds is a claim whose thresholds get written to fit its first
# measurement. 1.5 is `intent/0006-state/spec.md`'s and is derived from
# `SWEEP_LIVE_FRACTION`; 1.0 is the statement that this store writes no more
# than a tuned Linux filesystem does on the same device, which is the whole of
# the comparison and is either met or the design has a problem the ratio names.
device_bytes_per_app_byte              = { max = 1.5 }
ratio_vs_baseline                      = { max = 1.0 }
# The modelled boundary's row, under the same ceiling and marked by its name so
# that nobody reads it as the row above. If the arithmetic on a *model* — where
# no device does anything nobody asked for — cannot fit inside the ceiling, the
# real one will not either, so this is the cheap half of the test and it is worth
# having early. Measured 1.1336.
modelled_device_bytes_per_app_byte     = { max = 1.5 }
# The cycle happened at all, which is what `E2-B02`'s exit asks for and what a
# green run without it would not show. Both are asserted by
# `zone/tests/cycle.rs`, which fails when no zone is reset or no block is copied
# forward; the numbers are floors and not the measurement — measured 10 zones of
# 20, and 1 293 824 bytes copied.
zones_reset                            = { min = 1 }
# RFC 0059's third invariant as a count, and `claims/0012`'s `in_flight` rather
# than an invented number: the collector may be at most one operation ahead of a
# deadline-class read. Measured 1.
collector_operations_ahead_of_hard_read = { min = 1, max = 1 }

[hardware]
runner   = "runner-class-A"     # pinned bare metal, thermally stable
# `intent/0006-state/spec.md` requires this field beside the runner for this
# claim specifically, and requires it copied into the artefact header: the
# device both sides are counted on is emulated, so a reader comparing this
# against a number from real zoned hardware is comparing two things. It is
# `true` before the QEMU run exists and stays `true` after it, because the run
# it describes is the emulated one.
emulated = true
notes    = "The modelled rows do not need this machine and do not pretend to: every one of them is a count of bytes the mapping asked the device for, taken by the workload itself, and it is the same count on a fast host and a slow one — the same note `claims/0014` and `claims/0017` carry. The runner is named because `lint-reproduce` requires every claim to name one with a specification file beside it, and because the row above it will need a machine the day `query-blockstats` is the counter."

[reproduce]
command = "cargo xtask claim write-amplification"

[diagnosis]
# Recorded while the system is understood rather than at 2 a.m. when it is not.
modelled_ratio_above_1_5 = "the copy-forward term has moved, and the first place to look is the sweep's ranking rather than `SWEEP_LIVE_FRACTION`. The ceiling admits a live fraction of 0.25, which is `f/(1 − f)` = 0.33 of copy-forward per application byte; the measured 0.1225 says the ranking picks zones well under that. A ratio at the ceiling with the constant unchanged means the sweep is taking zones it should not have — read `zones reset by the collector` beside it, because a run that reset many more zones for the same application bytes is a run whose retention policy changed, not whose collector did"
fill_term_above_1_05 = "record padding, and it is arithmetic rather than a defect: a record is padded to the logical block, so the term is `1 + (padding per record / bytes per record)`. Above 1.05 either the block grew or the records shrank, and the second is the interesting one — a fill of many small objects pays padding per object. Check the object size draw in `zone/tests/cycle.rs` before concluding anything about the mapping"
zones_reset_at_zero = "the run collected nothing and proved nothing, which the workload already refuses — it fails rather than reporting a green cycle. If it is ever seen green with a zero here, the refusal itself has been removed, and that is the finding"
ratio_vs_baseline_above_1_0 = "the store wrote more than a tuned f2fs did on the same device, and the first move is **not** to read `zone/`. Read `claims/baselines/linux-6.x-tuned-zoned/comparison.conf` and ask which of its dials the two halves were run with differently, because every one of them moves this ratio further than any mapping decision does: `overprovision_percent` is the same number on both sides or the ratio measures the gift rather than the mapping; `durability` is per object on both sides or the baseline is being measured making a weaker promise; `counter_read_after` is after `sync` on both sides or whichever side had the larger page cache is being flattered; and `counted_nodes` is every writable node or the baseline is getting free metadata. Only when all four are confirmed identical is this a finding about `zone/` — and then it is the same finding as `modelled_ratio_above_1_5`, read against the fill and copy-forward terms separately, because a store losing on the fill term has a padding problem and one losing on the copy-forward term has a ranking problem"
ratio_vs_baseline_far_below_1_0 = "not a pass, and this is the row that will be reported as one. A ratio of, say, 0.3 against a log-structured filesystem doing the same work with the same spare room is more likely to mean the two halves did not do the same work: check that the baseline's collector ran at all — `background_gc=on`, and `device_fills` of 3 rather than a run that never reused a zone — and that both sides' bytes were read from the same counter at the same moment. `zones_reset` has a floor for this reason on the modelled side; the baseline needs the same question asked of it, and f2fs's own GC counters under `/sys/fs/f2fs/<dev>/` are where it is asked"
collector_operations_ahead_above_1 = "RFC 0059's third invariant is broken and a deadline-class read is queued behind more than one collector operation. `zone/src/queue.rs` holds the bound and `claims/0012`'s `in_flight` is where the number comes from; the two move together or the invariant is asserting a number nothing else believes. Below 1 is the opposite event and is not a pass: it means the urgent read never arrived while a collector operation was in flight, so the invariant was not asked anything"
