# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# compositor: the component that holds the machine's scene graph, and the first
# thing in E3 that is not a library.
#
# `user/virtio-gpu/manifest.toml` is the fullest manifest in this tree and every
# field below was written against it rather than copied from it. The two
# components are neighbours on the same path and are not alike: a display driver
# moves one frame's pixels from a client's memory to a device and is finished,
# and this component *retains* — a scene it holds between frames, built out of
# differences a client sent it, which is what `docs/design/ring-scene-boot.html`
# part II asks for and what nothing in this tree had until this file.
#
# `docs/manifest.md` is the schema and `cargo xtask lint-manifests` is what
# refuses this file when it stops fitting.
#
# What it declares, in one paragraph: a compositor in the `private` speculation
# domain, made out of an account's memory with a heap large enough for one
# retained graph, serving one client on one ring whose deltas travel inline;
# restarted on a fault and not on an exit, at the price of every client's
# retained scene; in the soft class, because nothing here yet has a deadline it
# can miss; and publishing fifteen numbers about itself that a reader can check
# against what a client asked for — four about what it applied, five that are one
# frame's story (the rung it would draw with, the frame it last closed, the
# deadline that frame carried, what a frame costs here, and what was given up to
# fit), three about the theme it resolved: that it resolved one, how many
# decisions the resolver made on its author's behalf, and how many rules it owes
# between grounds that do not part on their own — and three about the
# synchronisation of the frame it last closed: whether anything is still waiting,
# what value it reached, and how many frames it has abandoned.
#
# Fifteen words and a subtree is sixteen nodes, which is `abi::manifest::
# STATE_NODES_MAX` exactly. This manifest is full, and the paragraph at the foot of
# the file says what the next node costs.

schema = 4
name   = "compositor"
image  = "user/compositor"

# `private`, and the argument is this component's own rather than the display
# driver's next door.
#
# What a compositor holds is not a frame in transit. It is the **structure of
# everything on the screen, retained between frames**: a tree of nodes with
# transforms, paths, paints — and, when `E3-D01`'s vocabulary arrives on the
# wire, roles, labels and values in plain text. Every client's subtree lives in
# one arena, in one address space, on one heap. What separates two clients here
# is this component's own bookkeeping and nothing else: node identifiers are
# chosen in the *submitter's* space, no capability crosses between two clients,
# and a compositor whose arithmetic was wrong would hand one client's subtree to
# another with no boundary having been crossed anywhere.
#
# That is a sharper case for isolating it than the display driver's. A display
# driver holds one frame's pixels for as long as a transfer takes; this holds
# the shape and the text of every window for as long as the machine is up, which
# is where a password is typed and a document is read. `shared` would be a
# declaration that co-residency with an attacker cannot matter to that. It can.
#
# The cost is RFC 0005's flush on every crossing into and out of this component,
# and here there is a real prediction attached to it rather than a hope. This
# component's crossings are *per frame* and not per operation — that is the whole
# of `E3-B01`'s exit, boundary crossings per UI frame under ten — so the flush is
# amortised over a frame's worth of deltas rather than paid per delta. The number
# that would reverse this is RFC 0005's cross-domain call cost, measured at
# E1-P10, set against the frame budget `ring-scene-boot` section 09 draws. If a
# handful of flushes per frame is visible in that budget then `private` is not
# affordable *for a compositor* and the argument moves to the RFC, which is where
# it belongs, rather than to this file.
domain = "private"

# --- Device: none, and the absence is the declaration -------------------------
#
# There is no `[[device]]` table here and there will not be one. A compositor
# reaches a display by asking the driver that binds it — `user/virtio-gpu` —
# rather than by binding the part itself, and RFC 0067's whole point is that two
# manifests may not claim one device. The day this component draws, what it
# gains is a `sibling:virtio-gpu` need and not a device row.

# --- Needs: routed at spawn, in this order, one handle each -------------------

# The heap, and it is the one need this component genuinely could not do without.
#
# `f_scene::arena::Arena` is 131 096 bytes. A component's stack is four pages,
# and a component may hold **no writable static at all** — its text page is
# mapped read-only and `cargo xtask component` refuses an image carrying one — so
# the retained graph has exactly one place it can live: a region the frame maps
# and describes before the first instruction, which is `f_ring::heap` and RFC
# 0094's arrangement.
#
# One hundred and forty-three thousand three hundred and sixty bytes is
# thirty-five pages: the graph at 131 096 and a sixty-four-delta frame under
# construction at 5 672, with at most 64 more for the allocator's prologue and
# the rounding on the two blocks — 136 832 of it — plus the page a wider delta
# record would spend before anybody has to edit this file.
# `f_compositor::HELD_BYTES` measured against
# `f_compositor::routing::HEAP_BYTES` is a compile-time assertion, so a graph
# that outgrew this number stops the build rather than failing an allocation at
# ring 3 where nothing could report it; and `kernel/src/compositor.rs` reads the
# figure back out of this manifest and refuses a boot where the two disagree.
#
# Read and write and nothing else. A component that could derive from its own
# heap could hand a piece of it on, and an allocator whose memory has left is an
# allocator that will hand it out again.
[[capability]]
name   = "heap"
type   = "untyped"
rights = ["read", "write"]
from   = "supervisor"
bytes  = 143_360

# The place's own endpoint, routed back to it. `write` is the right to connect
# and `grant` is the right to hand the endpoint on, which together are what a
# component needs to introduce a peer to itself without the supervisor having to
# know every client — and a compositor is the component in this system with the
# most clients it did not choose. Not `revoke`: nothing may stop its own
# occupant, because a component that could refill its own place is a component
# that has become its own supervisor.
[[capability]]
name   = "self"
type   = "endpoint"
rights = ["write", "grant"]
from   = "supervisor"

# --- Rings: the control ring is implicit; this is the data ring ---------------

# One server ring, one client, speaking `scene` version 1 — the opcode space
# `abi/src/scene.rs` fixes: create, transform, path, paint, remove, commit.
#
# `payload = "inline"`, and it is the opposite of what the neighbouring driver
# declares for a reason that is the whole of part II. A display driver's payload
# is a frame of pixels and belongs in a registered buffer the device reads
# directly; a scene delta's payload is fifty-six bytes of record, and the thing
# this component is for is that **no pixel buffer crosses this ring at all**. A
# `registered` payload here would be a compositor that takes surfaces, which is
# the design this one exists instead of.
#
# `clients = 1`, and the number is a statement rather than a ceiling somebody
# picked. One SPSC ring per client is the rule, the frame maps exactly one data
# ring into this component's address space, and a manifest declaring four would
# be declaring three rings nothing routes — a promise nothing can refuse, which
# is R08. What raises it is `E3-B01g`, where a delta ring runs between two
# components and a second client is something that can actually connect.
#
# `entries = 16`: sixteen is what every channel in this boot is, and a frame of
# up to sixty-four deltas therefore fills and drains the ring several times
# rather than sitting in it — which is deliberate, because a client that never
# waits is a client whose back-pressure path is untested.
#
# `features` is empty. `admission_control` is absent for the reason the three
# driver manifests give: this component serves in arrival order and refuses
# nothing for want of time, and a bit claiming otherwise would be R08 with a
# feature name on it. `E3-B01h` is what computes a wake time from a commit's
# deadline, and that is the task that may declare it.
[[ring]]
name        = "scene"
role        = "server"
protocol    = "scene"
version_min = 1
version     = 1
entries     = 16
payload     = "inline"
clients     = 1
features    = []

# --- Restart: the supervisor's policy, the frame's mechanism ------------------

# On a fault, and not on an exit. The numbers are the display driver's numbers,
# and that is a decision rather than a copy: RFC 0008 fixes the budget as how
# many restarts in what window, the argument for eight in a minute is about how a
# component fails rather than about what it does, and inventing a fourth pair
# here would be four numbers with evidence for none of them.
#
# What differs from every driver in this tree is worth a comment rather than a
# field, and it is the sharpest consequence of retaining anything. A restart of a
# block driver loses the requests in flight; a restart of a display driver loses
# the resource identifiers it held. **A restart of this component loses every
# client's scene** — the graph *is* the state, and the successor comes up holding
# an empty arena while its clients believe their trees are still there.
#
# What makes that survivable rather than fatal is the one piece of this epoch
# that was already green before this component existed: `E3-B01l`'s reconciler
# keeps the client's own tree on the client's side and emits differences against
# it, so a client that is told its compositor changed generation reconciles
# against an empty scene and sends a whole tree. That is a frame of extra work
# and not a lost window — and it is the reason this line can say `on_fault` at
# all. The day a client cannot rebuild its tree, this becomes an argument for
# `in_place` below rather than for a longer backoff here.
[restart]
policy           = "on_fault"
backoff_first_ms = 10
backoff_max_ms   = 1_000
max_restarts     = 8
budget_window_ms = 60_000

# --- Reservation: what admission may refuse ----------------------------------

# Soft class, and the reader who expects otherwise is owed the argument, because
# a compositor is the component a reader would most expect to hold a deadline.
#
# It does not hold one yet, and declaring `hard` on the strength of what it will
# hold would be R08's own failure: nothing in this build schedules against a
# commit's deadline, so there is no deadline this component can miss and a
# reserved core would be capacity held for work nothing does. `E3-B01h` is the
# task that computes a wake time backwards from the next scanout, and that task
# is what earns `hard` here — together with RFC 0007's schedulability test, which
# is what would have to grant it.
#
# **`E3-B01h` has now landed and this line did not move, which is worth stating
# rather than leaving as a forecast that quietly came due.** What that task built
# is the arithmetic: a rolling p99 over this component's own frames, a wake time
# computed backwards from the next scanout, and a word saying whether the last
# frame fitted. What it did not build is anything that *misses* — nothing here
# renders, so no work is scheduled against a deadline and there is still no
# deadline this component can fail to meet. `hard` would be capacity reserved for
# work nothing does. The line that earns it is the first one that draws, together
# with RFC 0007's schedulability test, which is what would have to grant it.
#
# The word is load-bearing at run time and not only at admission, exactly as it
# is for the three drivers: the frame reads it out of the compiled record and
# writes it into the component's routing page as the ceiling RFC 0025's bound 1
# clamps against.
#
# Sixty-four kibibytes is the footprint: address space, page tables, text, stack,
# control ring, board, data ring, state tree and capability table. The graph is
# **not** in it and that is the same distinction `user/virtio-gpu/manifest.toml`
# draws about its queues — the heap above is a routed need that the account pays
# for separately, and folding it in here would make one number mean two things.
[reservation]
class        = "soft"
memory_bytes = 65_536

# --- Transfer: what this component declares about being updated in place ------

# `restart_only`, and here it is not a taste but an arithmetic fact.
#
# RFC 0063's transfer window is one page — `kernel::process::SWAP_WINDOW_MAX` —
# and this component's state is a hundred and thirty kilobytes of retained graph.
# An `in_place` declaration would be a promise to hand over something that does
# not fit in the mechanism that would carry it, which is worse than an
# unexercised promise: it is one whose failure would be discovered at the moment
# a swap was already under way.
#
# There are two reversals and they are different sizes. The small one is a window
# sized by the declaration rather than by one page, which is a change to the
# frame. The interesting one is that a compositor may not need to carry its graph
# at all: `E3-B01l`'s reconciler can rebuild the whole scene from the client's
# side, so the honest in-place transfer for this component is *the registrations
# and the frame token, and let the clients redraw* — which is a state record of a
# few words rather than an arena. That is the version worth building, and it
# belongs with the task that has a second client to try it against.
[transfer]
mode = "restart_only"

# --- State: what this component publishes about itself ------------------------

# RFC 0013 puts a state tree in every component and RFC 0065 is what makes
# "every" mean every: this array is the declaration, the frame writes the schema
# block out of it before this component's first instruction, and a manifest that
# declared nothing would be refused `ADMISSION/NO_STATE_TREE` at the spawn.
# `cargo xtask compositor mute` is that refusal driven against *this* record —
# the same record, with its declaration emptied and nothing else changed — so the
# sentence above is a thing this tree does rather than a thing it says.
#
# Every node here is a number `f_compositor::tree::Counters` or
# `f_compositor::tree::Story` already keeps, which is the whole of what makes the
# declaration honest rather than decorative: there is no collect step, no
# sampling interval and no second copy that can disagree with the first. And each
# of them is checkable from outside: a client that sent two frames of known shape
# at known deadlines, over a clock it wrote itself, knows what all twelve should
# say — which is what `kernel/src/compositor.rs` compares them against rather
# than taking the component's word. The last three are checkable from further
# outside than that: the frame resolves the same theme itself and compares, so the
# three are two independent answers to one question rather than one answer read
# twice.
#
# Ids are permanent and are never reused, for the reason `TODO.md` never reuses a
# task id: the id is the only thing that makes two readings of this component
# across time comparable at all. `f_compositor::routing::node` carries the same
# ids for the code that writes them.

[[state]]
id   = 1
name = "compositor"
kind = "subtree"
unit = "none"

# Frames that closed: a commit that reached the graph whole.
#
# The unit is `events` and not `frames`, and the difference is not pedantry:
# `f_abi::state::unit::FRAMES` means *physical frames* in this system — pages of
# memory — and a reader charting UI frames against page counts would be adding
# two unrelated things. The node's name says which frame is meant and the unit
# says what kind of quantity it is, which is exactly the division RFC 0013 draws
# between the two fields.
[[state]]
id     = 2
parent = "compositor"
name   = "frames"
kind   = "counter"
unit   = "events"

# Deltas that reached the graph, summed from what each commit applied. Published
# beside the frame count and never alone: *two frames closed* says nothing about
# whether anything changed, and a compositor that committed two empty frames
# would move one of these and not the other.
[[state]]
id     = 3
parent = "compositor"
name   = "edits"
kind   = "counter"
unit   = "entries"

# How many nodes the graph holds now. A gauge, because it goes both ways, and it
# is the one node here that is read out of the arena's own census rather than
# accumulated as things happen — so a build whose removals never reached the
# graph publishes the same `edits` and a different number here.
[[state]]
id     = 4
parent = "compositor"
name   = "nodes"
kind   = "gauge"
unit   = "nodes"

# Entries refused, by the wire or by the graph. Published beside the three above
# and never alone, for the reason `user/virtio-gpu/manifest.toml` gives about its
# own pair: *nothing was refused* is a claim about a component, and a component
# that was asked nothing refused nothing either.
[[state]]
id     = 5
parent = "compositor"
name   = "refused"
kind   = "counter"
unit   = "entries"

# --- The frame's story, E3-B01k ----------------------------------------------
#
# Five nodes that are one declaration. A reader of this component wants all five
# at once, because no one of them can be acted on alone: a pacing estimate with
# no deadline beside it does not say whether the machine is keeping up, a
# degradation with no frame token beside it does not say which frame gave
# something up, and a rung with neither says only what the machine could have
# drawn with.
#
# Every one of them is a value `f_compositor::tree::Held` already holds, which is
# the rule `user/virtio-gpu/manifest.toml` states at length and this file obeys
# rather than restates: a node with no counter behind it would be a serialisation
# with extra steps wearing RFC 0013's name. There is no collect step here, no
# sampling interval and no second copy that can disagree with the first — the
# component writes these twelve words out of one `Counters`, one `Story` and one
# `Readability`, and
# `f_compositor::routing::reported` carries the same numbers onto the board so
# that the frame can require the two to agree.
#
# Ids 6 to 10, ascending, and 1 to 5 keep what they had. A node's id is never
# reused and never renumbered: two readings of this component across time are
# comparable only because `frames` was 2 before this task and is 2 after it.

# Which rung of RFC 0080's ladder this compositor is holding, as
# `Rung::index()` plus one — so zero is *this machine satisfies no rung* and is
# not confusable with the top one, which is the good answer.
#
# A gauge and not a counter, because it is a level rather than a tally, and the
# unit is `none` because a rung ordinal is not a quantity: a reader that summed
# two of these would be adding two positions on a ladder.
#
# **It is reported and not acted on.** Nothing in this build chooses a renderer,
# because there is no renderer — `E3-B02b` is the task where a rung decides one
# and where a backend satisfying no rung is refused a compositor rather than
# handed the floor. That task's exit says *a backend with compute shaders and no
# usable scan starts at rung 2 and says so in the compositor's tree*, and this is
# the node it says it in.
[[state]]
id     = 6
parent = "compositor"
name   = "rung"
kind   = "gauge"
unit   = "none"

# The token of the last frame that closed, as the client named it.
#
# Published beside `frames` and never instead of it: *two frames closed* and
# *the last one was called two* are different claims, and a compositor that had
# closed one frame twice would move one of these and not the other.
#
# `none`, because a frame identifier is chosen by the submitter and is opaque
# here — `abi/src/scene.rs` refuses a zero, so a zero in this node is *no frame
# has closed* rather than *frame zero closed*, which is the distinction the unit
# is carrying.
[[state]]
id     = 7
parent = "compositor"
name   = "frame"
kind   = "gauge"
unit   = "none"

# The deadline that frame carried.
#
# Out of `f_abi::scene::Frame::deadline`, which the wire refuses a commit
# without. It is the client's own statement of when the frame was due,
# republished where a reader who never saw the submission can find it — and it
# is the number `degraded` below is measured against, so a tree carrying one
# without the other would be publishing a verdict with its evidence removed.
#
# Nanoseconds in the channel's epoch, which is `f_env::Instant`'s and is the only
# clock in this system with ordering authority. RFC 0009.
[[state]]
id     = 8
parent = "compositor"
name   = "deadline"
kind   = "gauge"
unit   = "nanoseconds"

# What a frame costs on this machine: the rolling p99 over the last hundred and
# twenty-eight frames this component closed.
#
# `f_compositor::pacing` is the arithmetic and argues it in full — exact by
# nearest rank over integers, no binary fraction anywhere, and a window that
# forgets on a schedule. What is worth saying in a manifest is which of the four
# numbers in `E3-B01h`'s sentence this one is: the wake time is a scanout, an
# estimate and a margin, and **the estimate is the only one of the three that is
# about this component**. The other two were told to it by the frame, and a tree
# republishing what it was told would be RFC 0013's *read, never delivered* run
# backwards. All four are on the board, where the frame can check the
# subtraction.
[[state]]
id     = 9
parent = "compositor"
name   = "pacing"
kind   = "gauge"
unit   = "nanoseconds"

# What was given up, one answer per frame, for the last sixteen frames.
#
# **A choice from `E3-B07b`'s order and not a boolean**, which is the whole of
# why this node is worth having. `scene/src/degrade.rs` opens by refusing an
# order that is deterministic but unwritten, on the grounds that it is not a
# decision anybody made; a node that said only *something was degraded* would
# repeat that mistake one layer up, publishing the existence of a policy rather
# than its choice. The word is a `Criterion::priority()` offset by
# `pacing::degraded::FIRST_CRITERION`, with three values below it for the answers
# that are not a criterion — the frame fitted, the policy was asked and had
# nothing left to give, and there was no estimate worth asking it about — and
# `NONE` below those for a frame that never happened.
#
# **And sixteen of them and not one, which is `E3-B07d` and RFC 0118.** Until
# 2026-09-24 this node carried the last frame's answer, and that word was
# byte-identical between a compositor that decided per frame and one that decided
# once at start — so *every frame carries the reduction it chose* was not a
# sentence a reader of this tree could check. It is a register now: sixteen
# fields of four bits, newest first. The honest alternative was a seventeenth
# node, and **this manifest has none to give** — sixteen rows against
# `abi::manifest::STATE_NODES_MAX` of sixteen — so the choice was between widening
# a wire bound every component in this system pays for and making the word that
# already exists carry what the line needs. RFC 0118 prices both and takes the
# second, and the cost it names is stated rather than hidden: history older than
# sixteen frames is gone, and a reader who wants a run-long record is reading
# `late` on the board beside this.
#
# Today every over-budget frame answers `SHORT`, and the reason is a wire format
# rather than a defect: `abi/src/scene.rs` has six opcodes and none of them
# declares an effect, so the policy runs over an empty slice. That is written down
# in `pacing::degraded::SHORT` with what would reverse it, and it is why this node
# is declared now rather than when the criteria start being reached — the id is
# permanent, and a reader comparing this component across that change wants the
# same id on both sides of it.
[[state]]
id     = 10
parent = "compositor"
name   = "degraded"
kind   = "gauge"
unit   = "none"

# --- The resolved theme, E3-B06d ----------------------------------------------
#
# Three nodes that are one declaration, and the thing they are evidence for is a
# negative: that this component does **not** decide readability. RFC 0079 puts
# every contrast floor, every metric bound and every clamp inside
# `interface/src/token.rs`, hands a compositor exactly one obligation — draw the
# rule between two grounds that do not part on their own — and names the way that
# arrangement fails silently: a projection that stops asking `Resolved::on` for a
# pair and starts remembering an ink's colour. `cargo xtask lint-token-pair` reads
# this component's source for that, which is the negative half. These three nodes
# are the positive half, and they are here because a negative read out of a source
# file says nothing about what ran.
#
# Every one of them is a value `f_compositor::tree::Readability` already holds —
# the rule this file obeys everywhere else: a node with no counter behind it is a
# serialisation with extra steps wearing RFC 0013's name. There is no collect step
# and no second copy, and `f_compositor::routing::reported` carries the same three
# onto the board so the frame can require them to agree.
#
# Ids 11 to 13, ascending, and 1 to 10 keep what they had.

# That the theme was resolved once and has not been resolved since.
#
# One, for the life of an instance. The node exists because *one* is checkable
# and *did not recompute* is not: a compositor that re-resolved every frame would
# answer every colour question with the same colours and differ only in what it
# spent, so a reader with no count here has no reading that separates the two
# builds. A boot that closes two frames and finds a one has seen the difference.
#
# A counter and not a gauge, because it only ever goes up, and `none` because a
# resolution is an event rather than a quantity of anything. The day a theme
# legitimately changes while this component runs — a caller switching to a dark
# theme is the obvious one — this node stops reading one and starts reading *once
# per theme*, and the id stays what it is so that a reader can compare across
# that change.
[[state]]
id     = 11
parent = "compositor"
name   = "resolves"
kind   = "counter"
unit   = "events"

# How many decisions the resolver made that the theme's author did not.
#
# `f_interface::token::Report::len`, which counts every clamp: an ink moved to
# clear a floor, a metric that took its bound, a font preference dropped. Zero
# under a theme this layer agrees with — `Theme::DEFAULT` resolves clean, and a
# token layer whose own default needed correcting would have a floor or a bound
# that is wrong rather than a default that is unlucky.
#
# **This is the node that makes RFC 0079 auditable.** That decision chose to clamp
# a hostile theme rather than refuse it, and the whole argument for clamping rests
# on every clamp being reported to somebody: a compositor that resolved a theme,
# moved somebody's colours and published nothing would have made the clamp silent,
# which is the outcome that RFC spends four alternatives avoiding. A report
# computed and dropped is the failure mode, and this node is what dropping it
# would look like from outside.
#
# `entries` rather than `events`, because a note is a record in a report rather
# than a thing that happened at a time: `f_interface::token::NOTES_MAX` bounds how
# many fit, and the count of those that did not is on the board beside it where
# the frame checks it.
[[state]]
id     = 12
parent = "compositor"
name   = "notes"
kind   = "gauge"
unit   = "entries"

# How many ordered pairs of distinct grounds owe a rule between them.
#
# RFC 0079 places exactly one obligation on a compositor and states it there
# rather than leaving it implied: `Resolved::boundary` says, for any two grounds,
# whether they part on their own, and carries the colour of the rule that must be
# drawn when they do not. The signal that the obligation has gone unimplemented is
# this component existing with no caller of `boundary` in it, and this node is
# what that caller produced.
#
# Six is the maximum — three grounds, ordered pairs, and a ground over itself is
# one region rather than a boundary — and six is what `Theme::DEFAULT` produces,
# because white, near-white and white part from nothing. That is RFC 0079's own
# example rather than a corner case: `#F2F2F2` on `#FFFFFF` is the ordinary idiom
# for a raised surface and it carries no contrast at all, which is why the answer
# is a rule rather than a clamp.
#
# **Rules owed and never rules drawn.** Nothing in this build draws anything;
# `E3-B02` owes the pixels. A node that counted rules drawn would be reporting
# work nobody did, and RFC 0079 names that as the one outcome that would not be
# acceptable. A gauge, because it is a property of the theme in force rather than
# a tally, and `none` because an ordered pair of grounds is not a quantity.
[[state]]
id     = 13
parent = "compositor"
name   = "rules"
kind   = "gauge"
unit   = "none"

# --- The synchronisation state, E3-B05f ---------------------------------------
#
# Three nodes that are one declaration, and the reader they are for is a
# supervisor rather than a person. `E3-B05e` — *a timeout is a named fate, the
# supervisor decides it* — is a different line and RFC 0008 puts the deciding
# above the frame; what a policy up there needs before it can decide anything is
# the reading, and the reading is these three at once. *One wait outstanding* with
# no last-reached value beside it does not say which frame is stuck; a
# last-reached value with no outstanding count does not say whether anything is
# waiting on the next one; and neither of them says whether this has happened
# before, which is the difference between a pipeline in flight and a component
# that abandons a frame every time.
#
# All three come out of `f_compositor::waits`, which holds the one
# `f_abi::sync::Chain` in this component and enters every wait through a door that
# takes the frame trace. `abi/src/trace.rs` named the direction it could not hold
# — *nothing in a type makes a compositor hand every submission to a recorder* —
# and that module is where it is held, in one file rather than by a reviewer.
#
# **These three fill this manifest.** `abi::manifest::STATE_NODES_MAX` is sixteen
# and with them this file declares sixteen: the subtree and fifteen words. The
# next node this component wants is an RFC widening that bound, with the state
# record's fixed width as the cost, and not a row added here —
# `cargo xtask lint-manifests` is what makes the attempt a red build rather than a
# discovery. It is why `E3-B01j`'s boundary-crossing figure is on the board and in
# `claims/0038` and not in this tree: that number is evidence about one run and the
# board is where a run is reported, so the bound cost nothing this time. It will
# not always.
#
# Ids 14 to 16, ascending, and 1 to 13 keep what they had.

# Waits the last frame entered and did not get out of.
#
# `f_abi::trace::Trace::unreleased` over the trace of the last frame that closed,
# which is a gauge and the state of **one frame** rather than a total: a reader of
# a live machine is asking *is it happening now*, and `timeouts` below is what
# answers *has it happened before*. The two are published together for that
# reason and neither is derivable from the other.
#
# `none`, because a wait is not one of the quantities `f_abi::state::unit` names.
# `entries` would say it is a ring record, which it is not — a wait is a value on
# a timeline that has not been reached — and a unit that was nearly right would be
# worse than the one that says plainly it is not a quantity of anything counted
# elsewhere in this tree.
[[state]]
id     = 14
parent = "compositor"
name   = "waits"
kind   = "gauge"
unit   = "none"

# The highest value that has landed on this compositor's own timeline.
#
# `f_abi::sync::Timeline::signalled`, and the field's own rule is what makes this
# worth a node rather than a derivation from `frames`: it moves at the **landing**
# and never at the submission, because submitting work is not the work having
# happened. A component that had submitted three signals and reached one publishes
# three frames and a one here, and a build that moved the timeline at submission
# would publish three with nothing else in this tree disagreeing.
#
# The compositor's own and not the application's. It is the only timeline this
# component produces — `f_abi::sync`'s first premise is that a timeline has
# exactly one producer — and the application's half is advanced from the arrival
# of its commit, so republishing it would be republishing `frames` under a second
# name. `f_compositor::waits` argues that asymmetry and names what reverses it: a
# client that publishes its own timeline record, adopted through
# `Timeline::adopt`.
#
# A gauge and `none`: a timeline value is an ordinal, not a tally, and the day one
# is adopted out of this tree rather than started from zero the node has to read
# back as the same kind of thing it was written as.
[[state]]
id     = 15
parent = "compositor"
name   = "signalled"
kind   = "gauge"
unit   = "none"

# Frames that closed with a wait outstanding and no room left to satisfy it.
#
# **There is no timer in this component and this node is not one.** RFC 0004 gives
# a component no clock, and `E3-B01k` is the precedent for what a node that could
# only move if one existed would be: a published zero wearing a measurement's
# name. So a timeout here is defined out of two numbers this component already
# publishes and is already checked on — the deadline the client put on the wire
# and the p99 estimate in `pacing` — and it counts the frame whose promised value
# is therefore never reached.
#
# `f_compositor::waits` carries the argument for the half that is arguable: the
# compositor's value means *this frame is composited*, nothing in this build draws,
# so there is no instant at which it is genuinely reached and the component
# decides. It decides as the pipeline would — a frame that could not fit before its
# deadline has missed the scanout it was paced against — and the present engine's
# wait on that value stays open, which is exactly the hang `abi/src/trace.rs` says
# it can record and not prevent. The reversal is named there: a renderer, at which
# point the landing comes from the rasteriser and two lines are deleted.
#
# A counter, because a frame that was abandoned stays abandoned however the next
# one goes, and `events` rather than `frames`: `f_abi::state::unit::FRAMES` means
# pages of memory in this system, which is the same trap the `frames` node above
# avoids and for the same reason.
[[state]]
id     = 16
parent = "compositor"
name   = "timeouts"
kind   = "counter"
unit   = "events"
