[package]
name = "f-compositor"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The compositor: a component that holds the retained scene graph and takes a client's deltas across one ring."

# A library and not a binary, for the reason `user/init/Cargo.toml` states at
# length and the four component crates before this one repeat: a binary needs an
# entry point, naming one means `#[unsafe(no_mangle)]`, and that is an unsafe
# attribute a crate forbidding unsafe code cannot write. `user/init/link.ld`
# finds the entry by the section `component::start` was compiled into, which is
# why this crate's entry has that path too — one script, one placement rule, one
# check, now across five component crates.

[dependencies]
f-abi.workspace = true
f-ring.workspace = true
# The retained graph. **This row is the task**: `scene/src/lib.rs` says the
# compositor is a component and the graph is not, and until this line the graph
# was a library nothing linked into a boot. What the crate brings is `Arena` —
# one fixed allocation with a named maximum — and `commit::Batch`, which is the
# rule that a frame reaches the graph whole or not at all.
f-scene.workspace = true
# The ladder and what a backend says about itself. **This row is `E3-B01k`'s
# rung**: `f_interface::backend::select` turns the capability set the frame
# reports into one of RFC 0080's four rungs, and the component publishes which
# one it is holding. `interface/` is a leaf crate with no dependencies of its
# own, which is the property that made its own comment willing to be taken by a
# compositor — so this row adds one crate to this component's graph and not a
# subtree. Nothing here *runs* a rung: choosing once at start and never
# promoting is `E3-B02b`, and this component reports the choice rather than
# acting on it.
f-interface.workspace = true
# The stamp and the prediction forward to the next scanout. **This row is
# `E3-B01i`**: a late latch re-reads the pointer between a commit closing and a
# submission crossing, and what it re-reads is a `f_input::predict::Predictor`
# over reports the driver stamped at interrupt time. The crate brings no clock
# with it — `f-env` is `f-input`'s dependency and not this component's, and a
# component at ring 3 has nothing to read one through — so what arrives here is
# arithmetic over numbers somebody else took.
#
# The row puts this crate on `xtask`'s `INPUT_PATH`, which is RFC 0120: until it
# landed that list said the late latch was `interface/`'s, and `interface/` holds
# no arena, no chain and no frame.
f-input.workspace = true

# No override. This crate inherits `unsafe_code = "forbid"` from the workspace,
# and here that inheritance costs something a reader should see stated: the
# graph is a hundred and twenty-eight kibibytes and a component has four pages
# of stack, so it lives in the heap the frame maps and is reached through a
# `Box`. There is no `static mut` version of this file to fall back to —
# `cargo xtask component` refuses an image with any writable symbol in it — and
# that refusal is what makes the heap the answer rather than a preference.
[lints]
workspace = true

# The seeded environment, and it is a dev-dependency rather than a dependency
# because a component cannot hold one. RFC 0004 puts every observation of time
# behind `f_env::Env`; a component at ring 3 has no clock and no port to read
# one through, so the frame reads the clock and writes it into this component's
# routing page — `routing::at::TICK_NANOS` — and `pacing` is arithmetic over
# what it was told. What the `Env` is for is the *test*: `E3-B01h`'s exit says
# two runs from one seed compute the same wake time on both architectures, and
# a `SeededEnv` driving the corpus is what makes the seed in that sentence real
# rather than a fixed array. It is never linked into the image.
[dev-dependencies]
f-env.workspace = true

# The image half, on by default and turned off by the one crate that links this
# as a library rather than building it into a component file.
#
# It exists because a `#[panic_handler]` is a lang item and there may be exactly
# one in a linked artefact. `component::start` needs one — a component has no
# serial port and no unwinder, so stopping is the whole handler — and the frame
# already has its own. The frame links this crate for `routing`'s offsets and
# for the heap size the boot has to agree with the manifest about, so the two
# would collide; `kernel/Cargo.toml` turns this off and says why.
#
# `dep:`-free, because this crate's `image` gate turns on a module rather than a
# dependency: `f-scene` is linked by both halves, since the frame reads
# `scene::arena::NODES_MAX` to size what it expects a published census to be.
[features]
default = ["image"]
image = []
