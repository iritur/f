# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# virtio-input: the fourth driver that lives outside the frame, and the first
# one that produces rather than answers. Written before the driver, the way the
# three before it were and for the same reason: the shape the driver has to fit
# predates the driver. `docs/manifest.md` is the schema and
# `cargo xtask lint-manifests` is what refuses this file when it stops fitting.
#
# What it declares, in one paragraph: an input driver in the `private`
# speculation domain, holding one virtio-input device's register pages, memory
# for its event queue and the device's interrupt, connected to the broker for
# anything it may ever have to ask for and to one consumer it submits to;
# speaking one typed protocol on one **client** ring whose payload is inline;
# restarted on a fault and not on an exit; in the soft class, with two mebibytes
# for everything it is made of.
#
# What it is not: a device that timestamps its own events. That is `E5-B06`.
# This is a virtio device under an emulator and `user/virtio-input/src/clock.rs`
# is where what that costs is written down.

schema = 4
name   = "virtio-input"
image  = "user/virtio-input"

# `private`, and the argument is a third one rather than either of the two
# already written. RFC 0005 leaves the choice to review.
#
# A block driver's clients are separated by a field in its protocol — an offset —
# and a network driver's are not separated at all, which is why one reached
# `private` by carelessness-tolerance and the other by the proposition that a
# network exists to deny. This driver has **one** peer and no clients, so neither
# argument applies and the question is a different one: what does this component
# hold that a peer must not read speculatively.
#
# It holds every keystroke. A component whose memory contains, in plain form and
# in order, everything the user has typed — including into a password field,
# because this stage has no idea what a password field is — is the clearest case
# in this tree for the flush RFC 0005 costs. `shared` here would be a declaration
# that no two users of the machine hold anything from each other's keyboards.
#
# The cost is RFC 0005's flush on every crossing into and out of this driver, and
# the number that would reverse it is the one virtio-blk names: RFC 0005's
# cross-domain call cost, measured at E1-P10. If it dominates *here* first that is
# information rather than a coincidence, because this driver crosses once per
# report rather than once per sector.
domain = "private"

# --- Device: what part this driver binds, as a property -----------------------

# RFC 0067, and the same shape the three drivers before it declare: a property,
# never an address. The transitional id — 0x1000 — is absent here for the reason
# it is absent there, and the reason is not weaker for an input device than for a
# network card: a transitional device addresses physical memory by specification,
# and this build refuses it.
#
# 0x1052 is the modern id for device type 18, which is `virtio-input`. QEMU
# publishes it for `virtio-keyboard-pci`, `virtio-mouse-pci` and
# `virtio-tablet-pci` alike — they differ only in what they report, not in what
# they are — which is the fact `user/virtio-input/src/transport.rs` names as the
# reason a second instance cannot be told from the first by this file.
[[device]]
vendor = 0x1af4
device = 0x1052

# --- Needs: routed at spawn, in this order, one handle each -------------------

# The transport's register pages: common configuration, notification, ISR and
# device configuration, as the modern PCI transport lays them out in one BAR and
# as QEMU places them. Four pages is that layout, and it is *the same four* every
# other virtio driver here declares because it is a property of the transport
# rather than of the device — a finding E1-B03 set out to make and this file is
# the fourth sample of.
[[capability]]
name   = "mmio"
type   = "frame"
rights = ["read", "write"]
from   = "supervisor"
frames = 4

# Memory the driver retypes into its event queue and the buffers the device
# writes into. Untyped rather than frames because the driver decides the split,
# and `derive` is what lets it retype.
#
# Sixty-four kibibytes, the same figure the other three declare, and here the
# slack is larger than anywhere: the layout is one queue and sixty-four
# eight-byte records, which is eight kibibytes. The difference is deliberate for
# the reason virtio-blk states — a manifest sized to exactly what a build needs
# is a manifest that has to change every time the build does — and the number is
# held the same as the others so that a reader comparing four manifests is
# reading four decisions rather than four measurements.
[[capability]]
name   = "queues"
type   = "untyped"
rights = ["read", "write", "derive", "revoke"]
from   = "supervisor"
bytes  = 65_536

# The device's interrupt, delivered to this component rather than to the frame.
# No vector is named, for the reason virtio-blk's manifest gives: which vector a
# device raises is the topology's to bind and the machine's to know, and a
# manifest that named one would be bound to one machine.
#
# Unused today and declared anyway, and **this is the driver where the reversal
# is nearest**. A block driver polls a used ring it has just kicked, so its spin
# is bounded by a device that owes it an answer; a network driver's receive queue
# is owed nothing by a peer that may never send. This driver is owed nothing by a
# *person*, who may not touch the machine for hours, and every one of those turns
# is a core spinning on a register read. E1-B09 is what turns this handle into a
# wait, and until it does this driver counts its idleness and publishes the count.
[[capability]]
name   = "notify"
type   = "irq"
rights = ["read"]
from   = "supervisor"

# The peer this driver submits to. `write` on an endpoint is the right to connect
# and nothing else — RFC 0008 — and it is what the `to` field of the ring below
# names.
#
# It is a *need* and not an ask, which is the decision worth stating: an input
# driver bound to its device at spawn has one consumer, chosen by whoever
# composed the system, and a driver that picked its own would be a keyboard
# choosing what to type into. `E3-B04`'s parent is where a second consumer — a
# second seat, or a recording tap — would be composed, and it is composed by
# adding a ring here rather than by this component asking for one.
[[capability]]
name   = "consumer"
type   = "endpoint"
rights = ["write"]
from   = "supervisor"

# The broker. RFC 0008 says an ask is resolved by connecting to the powerbox,
# whose endpoint reaches a component through its needs like any other need, and
# in E1 the supervisor occupies that place. This manifest declares no ask today,
# so the honest statement is that this handle is held for the asks a later task
# may add, and that adding one changes this file and therefore the hash a spawn
# names. Connect-only.
[[capability]]
name   = "powerbox"
type   = "endpoint"
rights = ["write"]
from   = "supervisor"

# --- Rings: the control ring is implicit; this is the data ring ---------------

# One ring, and this component holds the **client's** end of it — the first
# driver in this tree that does. Nobody asks for an input event, so there is
# nothing for a server to answer; there is a device that produces and a peer that
# drains.
#
# `payload = "inline"`, and it is a declaration rather than a default. The three
# drivers before this one declare `registered` and count a zero: the bytes of a
# sector, a frame or a screenful never pass through them, because the device
# transfers into the client's own memory. **This driver cannot make that claim
# and does not.** A `virtio_input_event` is eight bytes in the evdev vocabulary
# and an `f_abi::input::Event` is a different record in a different one;
# something has to translate, the translator is the stage that holds the device,
# and a manifest claiming otherwise would be `cargo xtask lint-datapath` going
# green about a property nobody has.
#
# Two hundred and fifty-six entries. A report is at most two entries, so this is
# a hundred and twenty-eight reports of slack between this driver and a consumer
# that has stopped draining — at which point entries are dropped and counted
# rather than blocking the device. `user/virtio-input/src/routing.rs`'s `DROPPED`
# is that count and it exists because an input event nobody is waiting for is one
# that simply never happened as far as every later stage is concerned.
#
# `features` is empty. `admission_control` is absent for the reason virtio-blk
# states: this driver floors and reports rather than refusing.
[[ring]]
name        = "input"
role        = "client"
to          = "consumer"
protocol    = "input"
version_min = 1
version     = 1
entries     = 256
payload     = "inline"
features    = []

# --- Restart: the supervisor's policy, the frame's mechanism ------------------

# On a fault, and not on an exit. The numbers are virtio-blk's numbers, and that
# is a decision rather than a copy: RFC 0008 fixes the budget as *how many
# restarts in what window*, the argument for eight in a minute is about how a
# driver fails rather than about what it drives, and inventing a different pair
# here would be two numbers with evidence for neither.
#
# One thing differs and it belongs in a comment rather than in a field: a restart
# of *this* driver loses the pointer's position, because the position is an
# accumulation over relative movements and nothing outside this component holds
# it. The user sees the pointer jump. That is a cost of the accumulator being
# here, `user/virtio-input/src/driver.rs` is where the accumulator is argued, and
# the repair is a consumer that remembers where the pointer was — which is a
# compositor's business and not a driver's.
[restart]
policy           = "on_fault"
backoff_first_ms = 10
backoff_max_ms   = 1_000
max_restarts     = 8
budget_window_ms = 60_000

# --- Reservation: what admission may refuse ----------------------------------

# Soft class. An input driver holds no deadline of its own: the deadline that
# matters on this path belongs to the frame that will *show* an event, is set by
# `E3-B01h`, and has not been decided at the moment an entry is written —
# `abi/src/input.rs` says exactly that and refuses a deadline on every input
# opcode because of it.
#
# The word is load-bearing at run time and not only at admission: the frame reads
# it out of the compiled record and writes it into this driver's routing page as
# the class every entry this component submits carries. RFC 0025 bound 2, from
# the submitting end — an entry claiming something more urgent than the channel
# reports about its submitter is refused, so the honest value is the one the
# frame admitted this component at and there is no field in this crate that could
# raise it.
#
# The memory is the account this component's whole footprint is retyped from and
# not the queues above, which are a routed need.
[reservation]
class        = "soft"
memory_bytes = 2_097_152

# --- Transfer: what this component declares about being updated in place ------

# `restart_only`. RFC 0063 requires this table for the reason `[restart]` is
# required: a manifest that says nothing has not chosen. The same answer
# virtio-net and virtio-gpu give, and here there is one extra reason to give it:
# an in-place swap would move the pointer's accumulated position from one
# instance to another, and nothing in this component's state is transferred by a
# swap that does not know the position is state.
[transfer]
mode = "restart_only"

# --- State: what this component publishes about itself ------------------------

# RFC 0013 puts a state tree in every component and RFC 0065 is what makes
# "every" mean every: this array is the declaration, the frame writes the schema
# block out of it before this component's first instruction, and a manifest that
# declared nothing would be refused `ADMISSION/NO_STATE_TREE` at the spawn.
#
# The nodes are this driver's own `Counters`, one for one, which is the whole of
# what makes the declaration honest rather than decorative: every word here is a
# number the crate already keeps, so publishing it is the store the driver was
# already going to make and there is no collect step, no sampling interval and no
# second copy that can disagree with the first.
#
# Ids are permanent and are never reused.

[[state]]
id   = 1
name = "input"
kind = "subtree"
unit = "none"

# `virtio_input_event` records read off the device.
[[state]]
id     = 2
parent = "input"
name   = "records"
kind   = "counter"
unit   = "entries"

# Reports that closed — `SYN_REPORT` boundaries with something in them, which is
# how many times the device said *that is one thing the user did*. Published
# beside the one above and never alone: the ratio is the number a reader wants,
# because a run whose two counts are equal is a run that saw no motion.
[[state]]
id     = 3
parent = "input"
name   = "reports"
kind   = "counter"
unit   = "entries"

# Reports that took a stamp.
#
# **The node this whole task is about.** Equal to `reports` at rest and greater
# by at most one in flight, which is the difference between a report opened and a
# report closed. It is published rather than asserted because *every event is
# stamped once* is a claim, and a claim with one count behind it cannot be
# checked against anything.
[[state]]
id     = 4
parent = "input"
name   = "stamped"
kind   = "counter"
unit   = "entries"

# Entries put on the data ring.
[[state]]
id     = 5
parent = "input"
name   = "submitted"
kind   = "counter"
unit   = "entries"

# Entries built and not submitted, because the consumer had not drained.
#
# Published rather than swallowed: a compositor that seems to have missed a
# keystroke and one that was never sent it are the same symptom with different
# repairs, and this is the number that tells them apart.
[[state]]
id     = 6
parent = "input"
name   = "dropped"
kind   = "counter"
unit   = "entries"

# Records this build has no opcode for — `EV_ABS`, autorepeat, and everything
# else. Counted rather than refused, which is the one place this component
# deliberately does not apply R04's *refuse what you do not know*, and
# `user/virtio-input/src/driver.rs` is where that is argued.
[[state]]
id     = 7
parent = "input"
name   = "ignored"
kind   = "counter"
unit   = "entries"

# Entries this component built that its own format check refused.
#
# **Required to be zero**, and it is the encoder checked against the decoder
# inside the component that owns the encoder: `f_abi::input::Event::check` is the
# same code path a consumer's `decode` runs. A non-zero here is this driver about
# to submit something its peer will refuse, counted at the one place that still
# knows which record produced it.
[[state]]
id     = 8
parent = "input"
name   = "malformed"
kind   = "counter"
unit   = "entries"
