[package]
name = "f-virtio-blk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The block driver, outside the frame. Speaks the modern virtio transport and copies nothing."

# A library and not a binary, for the reason `user/init/Cargo.toml` states at
# length: a binary needs an entry point, naming one means
# `#[unsafe(no_mangle)]`, and that is an unsafe attribute a crate forbidding
# unsafe code cannot write. `user/init/link.ld` finds the entry by the section
# `component::start` was compiled into, which is why this crate's entry has that
# path too — one script, one placement rule, one check.

[dependencies]
f-abi.workspace = true
f-ring.workspace = true

# No override. This crate inherits `unsafe_code = "forbid"` from the workspace,
# and that inheritance is the whole subject of RFC 0033: a driver that touches
# device registers and writes virtqueue descriptors, with no `unsafe` anywhere
# in it, because `f_ring::device` discharges the obligation once on the frame's
# side of the boundary. `cargo xtask lint-unsafe` fails the build if this stops
# being true.
[lints]
workspace = true

# The image half, on by default and turned off by the one crate that links this
# as a library rather than building it into a component file.
#
# It exists because a `#[panic_handler]` is a lang item and there may be exactly
# one in a linked artefact. `component::start` needs one — a component has no
# serial port and no unwinder, so stopping is the whole handler — and the frame
# already has its own. Until E1-B08 schedules components the frame links this
# crate to call the driver's code, so the two would collide; `kernel/Cargo.toml`
# turns this off and says why.
#
# *Reversal:* the day nothing links this as a library, `default-features =
# false` disappears from the kernel's manifest and this feature stops earning
# its keep.
[features]
default = ["image"]
image = []
