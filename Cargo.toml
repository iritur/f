[workspace]
resolver = "3"
members = ["abi", "env", "ring", "hash", "blob", "zone", "index", "generation", "interface", "scene", "semantic", "text", "input", "kernel", "user/assembler", "user/compositor", "user/init", "user/panel", "user/objects", "user/store", "user/supervisor", "user/virtio-blk", "user/virtio-net", "user/virtio-gpu", "user/virtio-input", "bench", "sim", "xtask"]

# The checker's crate, and it is excluded rather than absent for the reason RFC
# 0022 gave the last one: a verification tool's toolchain is the tool's
# business. `kernel/proofs` compiles `kernel/src/cap.rs` a second time under
# the rustc `cargo kani setup` installs, which is not the one pinned above. A
# member would be built by `cargo xtask test` under the pin, which buys nothing
# and breaks on the day the two compilers disagree. `cargo xtask prove` is the
# only thing that builds it, and deleting the directory is the whole of undoing
# this. RFC 0053.
#
# `ring/proofs` is excluded for the same reason and reaches the crate it proves
# a different way: `f-ring` is an ordinary `no_std` library that builds for the
# host, so that crate takes it as a path dependency rather than compiling a file
# out of it. The exclusion is still needed — the checker's rustc is still not
# the pinned one — and `cargo xtask prove` is still the only thing that builds
# it. RFC 0057.
#
# `abi/proofs` is the third, on `ring/proofs`' terms exactly: `f-abi` builds for
# the host, so the crate links it and proves the admission arithmetic RFC 0050
# put there. Three directories that differ only in what they link is a shape
# rather than a finding, and a fourth would be the moment to ask whether the
# shared half wants a name.
exclude = ["kernel/proofs", "ring/proofs", "abi/proofs"]

[workspace.package]
version = "0.0.1"
# Nothing here goes to a registry. These crates are an operating system, not a
# library set: publishing one would be a mistake rather than a release, and
# saying so is also what lets the dependency policy tell an internal path
# dependency apart from an unbounded wildcard on somebody else's crate.
publish = false
edition = "2024"
license = "Apache-2.0 OR MIT"
repository = "https://example.invalid/f"

[workspace.dependencies]
f-abi = { path = "abi" }
f-env = { path = "env" }
f-ring = { path = "ring" }
# The three crates `E3` opens with, and one row each because there is nothing
# to argue: every one is a `no_std` library above the frame with no build
# script, no features and no `default-features` line, on the terms `f-hash`'s
# row below states. They are here before anything outside the workspace root
# takes them so that the path is fixed for whoever does.
f-scene = { path = "scene" }
f-text = { path = "text" }
f-input = { path = "input" }
# The tree the system owns, and the one crate in the workspace that takes both
# `f-abi` and `f-interface`. It exists because neither may take the other: the
# wire is `abi`'s and cannot know what a role means, and `interface/Cargo.toml`
# declines `f-abi` so that the vocabulary stays a leaf that can be deleted. The
# join has to live somewhere that is neither, and this is it. `E3-B06c`, RFC
# 0083, and `semantic/Cargo.toml` is the long version.
f-semantic = { path = "semantic" }
# The vocabulary, and the row exists because the compositor now takes it.
# `interface/src/lib.rs` said this crate depends on nothing and nothing depends
# on it, and that the day a compositor existed it would take these types; that
# day is `E3-B01k`, which publishes the rung `backend::select` chose into the
# component's own state tree. The crate is still a leaf — it has no
# dependencies of its own — so the sentence about being able to abandon it
# survives this row. `f-semantic` above takes it too, which means the claim in
# `interface/src/lib.rs` that *nothing yet depends on it* is now false twice
# over and that sentence is owed an edit.
f-interface = { path = "interface" }
# The one SHA-256 in the tree, and a plain path dependency with no
# `default-features` line: this is a library and not a component, so it carries
# no `image` feature and no `#[panic_handler]`, and RFC 0054's shape — the three
# driver rows below that differ only in a name — does not apply to it. Saying so
# here is the whole comment, because the next reader's question is why this row
# is shorter than those. `f-generation` is here on exactly those terms, and
# `f-blob` joins them when intent 0006's later step lands it.
f-hash = { path = "hash" }
# The chunker and the store, on the same terms as the row above and for the
# same reason: a library, not a component, so no `image` feature and no
# `default-features` line, and RFC 0054's three-driver shape does not apply.
# `f-env` already had a row and gains nothing from this; what changed is who
# takes it, and `blob/Cargo.toml` is where that is argued.
f-blob = { path = "blob" }
# The zoned mapping and the collector, on the same terms as the two rows above:
# a library and not a component, so no `image` feature and no `default-features`
# line. What is worth saying here rather than in that crate is why it is not a
# module of `blob/`: a store that knew about zones would be a second thing that
# could disagree with `f-zone` about an offset, and `blob/src/store.rs` says so
# in its own first paragraph. Two crates and one opinion.
f-zone = { path = "zone" }
# The index, on the same terms as the two rows above and taking the one above it:
# it needs `f_blob::device::Device` and nothing else from that crate, because a
# second block-device trait would be a second thing to keep agreeing about what a
# block is. The row is here before anything outside the workspace root takes it,
# for the reason the three driver rows below give — a workspace row fixes the
# path for everybody who inherits it, and `E2-B08`'s `user/objects` is the
# consumer this was written for.
f-index = { path = "index" }
# The read path, and the row that consumes the four above it. There is no
# `default-features = false` and no `image` feature, because this is not yet a
# component: an image linking `f-blob` needs a `#[global_allocator]`, that is an
# `unsafe impl GlobalAlloc`, and RFC 0001 forbids `unsafe` above the frame — so
# it waits for the heap `intent/0006-state/spec.md`'s decision 4 puts in
# `ring/`, and `user/objects/src/lib.rs` records the debt rather than leaving it
# to be inferred from an absent `manifest.toml`. The row is here now for the
# reason the three driver rows below give: a workspace row fixes the path for
# everybody who inherits it, and adding the feature later is a smaller diff than
# moving the path.
f-objects = { path = "user/objects", default-features = false }
f-generation = { path = "generation" }

# The deductive checker's two runtime crates, taken by `kernel` alone and
# pinned by `=` because both are published by date rather than semantically.
# The row is here rather than in `kernel/Cargo.toml` for the reason every
# other row in this table is: a version this workspace resolves twice is a
# version it can resolve two ways. RFC 0096.
verus_builtin = "=0.0.0-2026-09-16-0054"
verus_builtin_macros = "=0.0.0-2026-09-20-0158"
# The assembler, and the row is short for `f-hash`'s reason: a library and not a
# component, so no `image` feature and no `default-features` line. What is worth
# saying here rather than in that crate is why it is above `user/` and not
# beside `generation/`: it is written as the parent of a supervisor at ring 3,
# `intent/0006-state/spec.md` puts it there, and a library that lives where the
# components live is a library nobody has to move on the day it acquires a
# `manifest.toml`. That day is the heap in `ring/`, and `user/assembler/src/
# lib.rs` records the debt rather than leaving it to be inferred.
f-assembler = { path = "user/assembler" }
# `default-features = false` here rather than at the one consumer, because a
# workspace dependency fixes it for everybody who inherits it and cargo refuses
# to let a member override it. The feature turned off is `image`, which carries
# the component's `#[panic_handler]`; `user/virtio-blk/Cargo.toml` says why and
# names the day it goes. Building the crate itself — which is what
# `cargo xtask component` does to produce the image — uses its own defaults and
# is unaffected.
f-virtio-blk = { path = "user/virtio-blk", default-features = false }
# The second driver, on the same terms and for the same reason. Two lines that
# differ only in a name is the point rather than a duplication: the arrangement
# a component crate needs to be linkable by the frame turned out to be a
# property of *being a component*, not of being the block driver, and a reader
# who wants to disagree should note that neither line had to be argued twice.
f-virtio-net = { path = "user/virtio-net", default-features = false }
# The third driver, on the same terms again. Three lines that differ only in a
# name is no longer a finding, it is a shape — and RFC 0054 says so and declines
# to fix it here for the reason it gives: what these three crates share is the
# whole of the component-linked-by-the-frame arrangement, and a fourth crate
# holding the shared half is a change to two closed tasks' evidence.
f-virtio-gpu = { path = "user/virtio-gpu", default-features = false }
# The fourth driver, on the same terms as the three above. It is the first one
# added *after* RFC 0071 moved the supervisors' shared half into
# `kernel/src/supervisor.rs`, so the thing this row is evidence for has changed:
# three identical rows were a shape, and a fourth that still needs no argument —
# for a device of a kind none of the others drive, one that only ever writes — is
# the shape holding under a case it was not derived from. `E3-B04d`.
f-virtio-input = { path = "user/virtio-input", default-features = false }
# The compositor, on the same terms as the three drivers above and for the first
# reason that is not a driver's. The frame links it for `routing` — the page it
# fills in before the component's first instruction — and for
# `routing::HEAP_BYTES`, which `kernel/src/compositor.rs` checks the manifest's
# declared heap against, so the number the graph needs and the number the boot
# maps are one definition the compiler sees rather than two that agree today.
#
# A fourth line differing only in a name. RFC 0051 said at two that these
# vocabularies belong in `abi/` and RFC 0054 said it again at three; this is the
# fourth crate in the same position and the first that is not a device driver,
# which is the evidence those two RFCs asked for and could not supply — what the
# arrangement is about is *being a component the frame links*, and it never was
# about drivers.
f-compositor = { path = "user/compositor", default-features = false }
# The panel, on the same terms as the row above and for the first reason that is
# not a server's: the frame links it for `routing` — the page it fills in before
# the component's first instruction — and for `f_panel::script`, which is what
# `kernel/src/semantic.rs` checks the tree it kept against. One definition the
# compiler sees rather than two that agree today.
#
# A fifth line differing only in a name. RFC 0051 said at two that these
# vocabularies belong in `abi/`, RFC 0054 said it again at three, and the
# compositor's row said it at four; nothing has changed except the count.
f-panel = { path = "user/panel", default-features = false }
# The same arrangement, one crate over and for a different reason:
# `user/store/Cargo.toml` says which, and the frame links this so that
# `f_store::report` has one definition rather than two.
f-store = { path = "user/store", default-features = false }
# The supervisor, and the frame links it for the one reason the four lines above
# name: a layout both sides read is worth one definition the compiler checks.
# Here it is `f_supervisor::routing`, the page the frame fills in before the
# component's first instruction and the component reads after it — the same
# arrangement `f_virtio_blk::routing` has had since RFC 0047, and the assertion
# that pins it lives in `kernel/src/component.rs` for the same reason.
f-supervisor = { path = "user/supervisor", default-features = false }
f-bench = { path = "bench" }

# ---------------------------------------------------------------------------
# The unsafe policy, enforced by the compiler rather than by review culture.
#
# `unsafe_code = "forbid"` is the workspace default. Exactly three crates
# override it to "allow": abi, ring and kernel — the frame. Every other crate,
# now and in future, inherits the forbid and cannot opt out silently: doing so
# is a visible diff in that crate's Cargo.toml.
#
# See docs/rfc/0004-determinism-substrate.md and LICENSING.md.
# ---------------------------------------------------------------------------
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
missing_safety_doc = "deny"
mem_forget = "deny"
todo = "warn"

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
debug = true

# The profile a component's image is built with. `cargo xtask init` links the
# library this produces against `user/init/link.ld`.
#
# It inherits `release` and turns one thing off, and that one thing is the whole
# reason the profile exists: with link-time optimisation on, a library crate's
# rlib carries bitcode rather than machine code, because the final artifact is
# expected to do the optimising. There is no final artifact here — the linker
# script *is* the last step — so an rlib built that way links to an empty image,
# silently, and the failure looks like the entry point having moved.
#
# `opt-level = "s"` because the image has to fit in the one page the frame maps
# for it, and `debug = false` because nothing reads a component's symbols: the
# kernel is handed a flat blob with no headers at all.
[profile.init]
inherits = "release"
lto = false
opt-level = "s"
debug = false
