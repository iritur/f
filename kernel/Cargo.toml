[package]
name = "f-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The frame. The only code in the system permitted to be unsafe."

[dependencies]
f-abi.workspace = true
f-env.workspace = true
f-ring.workspace = true

# SHA-256, for the frame to measure itself with. RFC 0012 makes the frame hash
# the thing a swap compares to decide whether it needs a reboot, and a frame that
# could not recompute its own would be carrying a field nothing checks.
#
# The one dependency in this list the frame calls *code* from rather than sharing
# a vocabulary with, and it is worth saying why that is acceptable here and is
# refused three lines down for the drivers. `f-hash` is `no_std`, has no
# allocator, no arch-specific path and no dependencies of its own, and it forbids
# `unsafe` — so linking it adds nothing to the surface `lint-unsafe` measures.
# The alternative was a second SHA-256 inside `kernel/`, which is the one shape
# of duplication a content-addressed system cannot afford: two implementations of
# one hash are two answers to *what are you running*.
#
# *Reversal:* a measurement taken before the frame runs — E5's TPM — at which
# point the frame is handed a digest rather than computing one, and this line
# goes with the self-hash it exists for.
f-hash.workspace = true

# The block driver, which is a component and not part of the frame — it inherits
# `unsafe_code = "forbid"` like every other `user/` crate and `cargo xtask
# lint-unsafe` holds it to that.
#
# This line used to say the frame linked it because nothing scheduled a
# component, and that stopped being true at RFC 0047: the driver runs at ring 3
# on a core of its own and `kernel/src/blk.rs` calls no part of it, which
# `cargo xtask lint-datapath` now holds rather than leaving to a reader. What
# the frame links it for is three *shared vocabularies* and no code:
# `routing`'s offsets, which are the layout of a page the frame writes and the
# component reads; `driver::Counters`, which is the shape the frame reads that
# page back into; and `transport::SECTOR_BYTES`. One definition the compiler
# checks is worth more than two that agree today — the same argument the
# `f-store` line below makes.
#
# *Reversal:* those three moving into `abi/`, which is where a wire layout two
# crates agree on belongs and where this would have gone had the layout existed
# before the driver did. Then this line goes, and `lint-unsafe`'s frame list
# gets one crate shorter to justify.
f-virtio-blk.workspace = true

# The network driver, on exactly the same terms and for exactly the same three
# shared vocabularies: `routing`'s offsets, `driver::Counters`' shape, and the
# constants `kernel/src/net.rs` checks a manifest against. The frame calls none
# of its code and `cargo xtask lint-datapath` holds that rather than leaving it
# to a reader.
#
# That this line is a copy of the one above with a name changed is the finding
# E1-B03 exists to produce, not an oversight: the arrangement a component crate
# needs in order to be linkable by the frame turned out to be a property of
# being a component. The *reversal* is the same one and it is now twice as
# well argued — those three vocabularies belong in `abi/`, where a wire layout
# two crates agree on belongs, and the day they move both of these lines go and
# `lint-unsafe`'s frame list gets two crates shorter to justify. RFC 0051.
f-virtio-net.workspace = true

# The display driver, on exactly the same terms and for exactly the same three
# shared vocabularies: `routing`'s offsets, `driver::Counters`' shape, and the
# constants `kernel/src/gpu.rs` checks a manifest against. The frame calls none
# of its code and `cargo xtask lint-datapath` holds that rather than leaving it
# to a reader.
#
# Three copies of one paragraph. RFC 0051 said at two that the reversal was
# those vocabularies moving into `abi/`; RFC 0054 says at three that the
# argument has not improved by being made again, records who owes the move, and
# declines to make it in a task whose evidence is a picture on a screen. Reading
# this comment and the two above it in one sitting is the argument.
f-virtio-gpu.workspace = true

# The component a place holds, and — from E1-B08 — the runtime that holds a
# core. The frame links it for one thing: `f_store::report` is the encoding a
# runtime's exit status carries, and one definition the compiler checks is worth
# more than two that agree today. Its `image` feature is off for the reason
# `f-virtio-blk`'s is: a `#[panic_handler]` is a lang item and there may be one
# per linked artefact.
#
# *Reversal:* a runtime that publishes a state tree of its own under RFC 0013,
# at which point the frame reads nodes rather than a packed word and this line
# goes.
f-store.workspace = true

[lints.rust]
# The frame. This is the crate the < 5% unsafe-of-TCB metric measures.
# Adding another crate to this list is a visible, reviewable diff.
unsafe_code = "allow"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Deliberate defects, off by default and never on in anything that ships.
#
# The first of them exists because property five of the capability
# negative suite — *a process cannot make the kernel panic by trying* — cannot
# have a fixture of the shape the other four have. A table that panics takes the
# machine down rather than being caught, so the mutation has to be a build
# instead: `cargo xtask mutate` makes one, boots it, and requires the boot to go
# red. `kernel/src/cap.rs` argues it at the function it defects.
#
# `cargo xtask lint-mutations` fails the build if any of these appears in a
# default feature list, which is the one way a defect could reach an image
# nobody meant to build.
[features]
mutate-unchecked-index = []
# The defect E0-P02 exists to catch: one unseeded read of the timestamp
# counter on the boot path. It does not make the kernel fail — that is the
# point of it, and why it is not in `xtask`'s MUTATIONS table. It makes two
# runs of the same commit differ, which nothing but a reproduction check
# would ever notice.
mutate-unseeded-time = []
# The defect E2-P06 exists to catch, and the sibling of the one above: it does
# not make two runs on one machine differ, it makes two *checkouts* differ. The
# image compiles the absolute path it was built at into itself, so the frame
# leaf — and therefore the generation root — becomes a function of where the
# tree happens to sit. `cargo xtask generation --mutate` arms it, requires the
# two-path comparison to go red and to name the frame, disarms it and requires
# the same comparison to go green. Everything else in this tree is green on it,
# which is the point.
mutate-path-in-image = []
# `E2-B07`'s, and the only defect in this list that breaks nothing. It changes
# sixteen bytes of `kernel/src/measure.rs`'s `MARK`, which nothing reads, no
# branch depends on and no log line mentions — so the *only* thing in the system
# that can notice this build is different from the clean one is the frame's
# measurement of its own rodata. That is the point: a modification which also
# broke something would have demonstrated that the broken thing goes red, not
# that the identity moved. `cargo xtask attest` boots it twice, once with the
# clean build's declared hash — where the frame must refuse to publish a root —
# and once with its own, where the published root and frame hash must both differ
# from the clean boot's.
mutate-modified-frame = []

[[bin]]
name = "f-kernel"
path = "src/main.rs"
# The kernel is `no_std` and defines its own panic handler, so a host test
# harness cannot be built for it: the harness links `std`, and two crates then
# claim the `panic_impl` lang item. There are no host tests here and there will
# not be — the kernel is exercised in QEMU by `cargo xtask run`, and its logic
# lives in `abi`, `env` and `ring`, which are tested on the host.
test = false
bench = false
