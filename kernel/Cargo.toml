[package]
name = "f-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The frame. The only code in the system permitted to be unsafe."

[dependencies]
f-abi.workspace = true
f-env.workspace = true
f-ring.workspace = true

# SHA-256, for the frame to measure itself with. RFC 0012 makes the frame hash
# the thing a swap compares to decide whether it needs a reboot, and a frame that
# could not recompute its own would be carrying a field nothing checks.
#
# One of the two dependencies in this list the frame calls *code* from rather
# than sharing a vocabulary with — `f-generation` below is the other, and it
# links this one — and it is worth saying why that is acceptable for a library
# and is refused further down for the drivers. `f-hash` is `no_std`, has no
# allocator, no arch-specific path and no dependencies of its own, and it forbids
# `unsafe` — so linking it adds nothing to the surface `lint-unsafe` measures.
# The alternative was a second SHA-256 inside `kernel/`, which is the one shape
# of duplication a content-addressed system cannot afford: two implementations of
# one hash are two answers to *what are you running*.
#
# *Reversal:* a measurement taken before the frame runs — E5's TPM — at which
# point the frame is handed a digest rather than computing one, and this line
# goes with the self-hash it exists for.
f-hash.workspace = true

# `E2-P07`. The frame reads `f.root=` and has to be able to say which of the
# modules the loader offered folds to it, which is the fold used as an identity
# — the *same* function `cargo xtask generation` produced the root with, in the
# same crate, which is what makes the check at boot arithmetic rather than a
# second opinion about the format. `f-generation` is `no_std`, has no allocator
# and pulls in only `f-abi` and `f-hash`, so this costs the frame two leaf
# crates and no capability it did not have.
#
# It is a *library* dependency and not a component crate: unlike the three
# driver lines below, the frame calls this code, and there is no `image`
# feature and no `#[panic_handler]` in it to keep off.
#
# *Reversal:* the frame gaining a supervisor that calls `f-assembler`, at which
# point selection and instantiation are one reader above the frame and this line
# goes with the rest of the boot path's knowledge of the format. RFC 0066 is
# where that day is described.
f-generation.workspace = true

# `E3-B06c`. The tree the system owns, and the frame is the system: this is the
# one dependency in this list the frame takes in order to **hold** something on a
# component's behalf rather than to share a vocabulary with it.
#
# It is acceptable on `f-hash`'s terms and for `f-hash`'s reason: `no_std`, no
# allocator, no architecture, no dependencies beyond `f-abi` and `f-interface`,
# and it forbids `unsafe` — so linking it adds nothing to the surface
# `lint-unsafe` measures. The alternative was a second semantic tree inside
# `kernel/`, which is the one shape of duplication this layer cannot afford: two
# implementations of one tree are two answers to *what is this machine
# presenting*.
#
# *Reversal:* the tree moving above the frame, which is the day something other
# than the frame is the system a component's interface belongs to. RFC 0072's
# *a runtime is a component so it publishes a tree* is the shape that would ask
# for it.
f-semantic.workspace = true

# The vocabulary, for `Role::from_index` and `Role::name`. Taken directly rather
# than through the row above, because what the frame does with it is *print* —
# `kernel/src/semantic.rs` names the roles it found in the boot log — and a log
# line that said `role 0` would be a log nobody can check against
# `interface/src/node.rs` by eye.
#
# `kernel/src/compositor.rs` is the second reader and wants something else from
# the same crate: it describes a backend to the compositor and names the
# capabilities by their own `Capability::index()` rather than by a bitmask it
# made up. Both uses are the frame refusing to write down a number that already
# has a name — a role's spelling in one case and a bit position in the other —
# and neither makes the frame a consumer of the interface layer.
#
# `no_std`, no allocator, no dependencies at all, forbids `unsafe`.
# *Reversal:* the boot log ceasing to name roles **and** a backend that reports
# for itself. Either alone leaves the other reader, so this row goes when both
# have gone: the day a GPU driver says what it can do, the capability constant
# moves to the driver and `kernel/src/compositor.rs` stops composing one.
f-interface.workspace = true

# `E3-B03b`'s fixture face, and this row takes one thing from the crate:
# `face::fixture`, which is *bytes* — the declared face and its undeclared twin
# — plus `face::Face` to parse what came back. The frame lays out no text, holds
# no metric and shapes nothing; what it does is decide whether a content address
# is one the component's manifest declared, and then read the answer back and
# check that it is a face rather than a run of the right length.
#
# It is here rather than a second copy of those bytes for `f-hash`'s reason one
# row up, sharpened by what this particular duplication would cost: the frame
# computes the address of the face the component stored, so a second
# transcription would be a second face with a different address, and the symptom
# would be a read that resolves to nothing rather than a diff anybody can see.
#
# `no_std`, no allocator, no architecture, no dependencies at all, forbids
# `unsafe` — so linking it adds nothing to the surface `lint-unsafe` measures.
#
# *Reversal:* a face that arrives from outside the build — RFC 0082's imported
# shaper — at which point the bytes are not a fixture, the parser is not this
# one, and this row goes with the stocking it exists for.
f-text.workspace = true

# The block driver, which is a component and not part of the frame — it inherits
# `unsafe_code = "forbid"` like every other `user/` crate and `cargo xtask
# lint-unsafe` holds it to that.
#
# This line used to say the frame linked it because nothing scheduled a
# component, and that stopped being true at RFC 0047: the driver runs at ring 3
# on a core of its own and `kernel/src/blk.rs` calls no part of it, which
# `cargo xtask lint-datapath` now holds rather than leaving to a reader. What
# the frame links it for is three *shared vocabularies* and no code:
# `routing`'s offsets, which are the layout of a page the frame writes and the
# component reads; `driver::Counters`, which is the shape the frame reads that
# page back into; and `transport::SECTOR_BYTES`. One definition the compiler
# checks is worth more than two that agree today — the same argument the
# `f-store` line below makes.
#
# *Reversal:* those three moving into `abi/`, which is where a wire layout two
# crates agree on belongs and where this would have gone had the layout existed
# before the driver did. Then this line goes, and `lint-unsafe`'s frame list
# gets one crate shorter to justify.
f-virtio-blk.workspace = true

# The network driver, on exactly the same terms and for exactly the same three
# shared vocabularies: `routing`'s offsets, `driver::Counters`' shape, and the
# constants `kernel/src/net.rs` checks a manifest against. The frame calls none
# of its code and `cargo xtask lint-datapath` holds that rather than leaving it
# to a reader.
#
# That this line is a copy of the one above with a name changed is the finding
# E1-B03 exists to produce, not an oversight: the arrangement a component crate
# needs in order to be linkable by the frame turned out to be a property of
# being a component. The *reversal* is the same one and it is now twice as
# well argued — those three vocabularies belong in `abi/`, where a wire layout
# two crates agree on belongs, and the day they move both of these lines go and
# `lint-unsafe`'s frame list gets two crates shorter to justify. RFC 0051.
f-virtio-net.workspace = true

# The display driver, on exactly the same terms and for exactly the same three
# shared vocabularies: `routing`'s offsets, `driver::Counters`' shape, and the
# constants `kernel/src/gpu.rs` checks a manifest against. The frame calls none
# of its code and `cargo xtask lint-datapath` holds that rather than leaving it
# to a reader.
#
# Three copies of one paragraph. RFC 0051 said at two that the reversal was
# those vocabularies moving into `abi/`; RFC 0054 says at three that the
# argument has not improved by being made again, records who owes the move, and
# declines to make it in a task whose evidence is a picture on a screen. Reading
# this comment and the two above it in one sitting is the argument.
f-virtio-gpu.workspace = true

# The input driver, on exactly the same terms as the three rows above it and for
# the same three shared vocabularies: `routing`'s offsets, `driver::Counters`'
# shape, and the constants `kernel/src/input.rs` checks a manifest against. The
# frame calls none of its code and `cargo xtask lint-datapath` holds that rather
# than leaving it to a reader.
#
# The fourth copy of one paragraph, and RFC 0051 and RFC 0054 have already said
# everything there is to say about that: the reversal is those vocabularies
# moving into `abi/`, where a wire layout two crates agree on belongs. What is
# worth adding at the fourth is the one thing that is *not* a copy. This driver
# routes a word the other three have no counterpart for — the clock it is told
# to take its stamps against — and that word is a page offset like every other,
# so it arrives through `routing` and costs this row nothing. The frame writes
# it, the component reads it, and neither of them is the code that takes the
# reading: `cargo xtask lint-stamp` names the driver and not this crate, and
# `kernel/src/input.rs` says at length why the frame on this path is a courier
# rather than a stage.
f-virtio-input.workspace = true

# The compositor, and the first of these rows that is not a driver. The frame
# links it for `routing` — the page it fills in before the component's first
# instruction and reads after it — and for `routing::HEAP_BYTES`, which
# `kernel/src/compositor.rs` checks the manifest's declared heap against so that
# the graph's size and the region the boot maps are one definition the compiler
# sees rather than two that agree today. Its `image` feature is off for the
# reason every row above gives: a `#[panic_handler]` is a lang item and there may
# be one per linked artefact.
#
# *Reversal:* the routing layout moving into `abi/`, which RFC 0051 named at two
# drivers and RFC 0054 named again at three. This is the fourth crate in the same
# position and the first that drives no device, which is what turns that
# reversal's argument from *drivers share a shape* into *components the frame
# links share a shape*.
f-compositor.workspace = true

# `E3-B06c`'s application. The frame links it for `f_panel::routing` — the page
# it fills in before the component's first instruction — and for
# `f_panel::script`, which is what `kernel/src/semantic.rs` checks the tree it
# kept against. One definition the compiler sees rather than two that agree
# today, which is the argument the four component rows above this one make.
f-panel.workspace = true


# The component a place holds, and — from E1-B08 — the runtime that holds a
# core. The frame links it for one thing: `f_store::report` is the encoding a
# runtime's exit status carries, and one definition the compiler checks is worth
# more than two that agree today. Its `image` feature is off for the reason
# `f-virtio-blk`'s is: a `#[panic_handler]` is a lang item and there may be one
# per linked artefact.
#
# *Reversal:* a runtime that publishes a state tree of its own under RFC 0013,
# at which point the frame reads nodes rather than a packed word and this line
# goes.
f-store.workspace = true

# The component that spawns the others. The frame links it for `routing`, which
# is the page it fills in before the supervisor's first instruction: one
# definition of that layout, checked by the compiler, rather than two that agree
# today. It does not link it for `policy` — that is the whole of RFC 0008's
# move, and a frame that called the supervisor's policy would have moved a file
# and kept the decision.
#
# *Reversal:* the routing page becoming something a supervisor is handed on its
# ring rather than told in memory, at which point this line goes and the layout
# is `abi/`'s.
f-supervisor.workspace = true

# The deductive checker's two runtime crates, and RFC 0096 is where the
# price is argued rather than here. `verus!{ … }` in `src/watermark.rs` is
# a macro from the second and the specification types it expands against
# live in the first, so the frame — the one tree RFC 0001 concentrates
# `unsafe` in — takes two dependencies for a *checker* rather than for a
# thing it does. Under rustc the macro erases every specification and what
# is left is three function bodies; under `verus` they are the proof.
#
# Pinned with `=` and not with a caret, because both are published by date
# rather than semantically: `cargo add` resolves them against *latest Rust
# 1.99.0-nightly compatible version*, and without the `=` a newer date would
# arrive as a toolchain bump nobody asked for — which `CLAUDE.md` forbids as
# a side effect and `claims/README.md` prices as a full re-run.
#
# They pull `verus_syn`, `verus_prettyplease`, `syn`, `quote`,
# `proc-macro2`, `convert_case`, `synstructure` and `unicode-ident` behind
# them. Every one of those is a proc-macro dependency and none of them is in
# the image: the frame leaf `cargo xtask generation` measures is the linked
# artefact, and a macro that ran at compile time is not in it.
verus_builtin.workspace = true
verus_builtin_macros.workspace = true

[lints.rust]
# The frame. This is the crate the < 5% unsafe-of-TCB metric measures.
# Adding another crate to this list is a visible, reviewable diff.
unsafe_code = "allow"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

# Deliberate defects, off by default and never on in anything that ships.
#
# The first of them exists because property five of the capability
# negative suite — *a process cannot make the kernel panic by trying* — cannot
# have a fixture of the shape the other four have. A table that panics takes the
# machine down rather than being caught, so the mutation has to be a build
# instead: `cargo xtask mutate` makes one, boots it, and requires the boot to go
# red. `kernel/src/cap.rs` argues it at the function it defects.
#
# `cargo xtask lint-mutations` fails the build if any of these appears in a
# default feature list, which is the one way a defect could reach an image
# nobody meant to build.
[features]
mutate-unchecked-index = []
# The defect E0-P02 exists to catch: one unseeded read of the timestamp
# counter on the boot path. It does not make the kernel fail — that is the
# point of it, and why it is not in `xtask`'s MUTATIONS table. It makes two
# runs of the same commit differ, which nothing but a reproduction check
# would ever notice.
mutate-unseeded-time = []
# The defect E2-P06 exists to catch, and the sibling of the one above: it does
# not make two runs on one machine differ, it makes two *checkouts* differ. The
# image compiles the absolute path it was built at into itself, so the frame
# leaf — and therefore the generation root — becomes a function of where the
# tree happens to sit. `cargo xtask generation --mutate` arms it, requires the
# two-path comparison to go red and to name the frame, disarms it and requires
# the same comparison to go green. Everything else in this tree is green on it,
# which is the point.
mutate-path-in-image = []
# `E2-B07`'s, and the only defect in this list that breaks nothing. It changes
# sixteen bytes of `kernel/src/measure.rs`'s `MARK`, which nothing reads, no
# branch depends on and no log line mentions — so the *only* thing in the system
# that can notice this build is different from the clean one is the frame's
# measurement of its own rodata. That is the point: a modification which also
# broke something would have demonstrated that the broken thing goes red, not
# that the identity moved. `cargo xtask attest` boots it twice, once with the
# clean build's declared hash — where the frame must refuse to publish a root —
# and once with its own, where the published root and frame hash must both differ
# from the clean boot's.
mutate-modified-frame = []
# `E0-P18`'s, and the first defect in this list that an emulator cannot see
# happen. It writes the ring-3 field of `IA32_STAR` without its privilege bits,
# which is what this kernel did until 2026-09-12: Intel's `sysret` — and QEMU's,
# whatever vendor it is told to be — forces the stack selector to level three
# and hides it, AMD's adds eight and loads what it gets, and the next `iretq`
# into the process refuses the stack selector it was handed. So the check that
# catches it is arithmetic rather than a boot: `process::self_test` must refuse
# the field before anything enters ring 3, and `cargo xtask mutate` requires it
# to. `kernel/src/arch/x86_64/gdt.rs` at `SYSRET_BASE`, and RFC 0074.
mutate-sysret-base-without-privilege = []
# The first defect in this list no boot can reach, and that is the point of
# it. It takes the overflow guard out of `watermark::refunded`, which is
# what the shipped `Table::refund` did before RFC 0096 pointed a deductive
# checker at it: `extent.saturating_add(bytes)` answers `Ok` and loses the
# difference, so `object + extent` is not preserved. `extent` is bytes left
# in an untyped region and no machine here has one within a refund of
# `u64::MAX`, so `cargo xtask mutate` cannot catch it and never will —
# `cargo xtask verus` does, and requires the conservation postcondition to
# be refuted and `watermark.rs` to be named.
mutate-saturating-refund = []

[[bin]]
name = "f-kernel"
path = "src/main.rs"
# The kernel is `no_std` and defines its own panic handler, so a host test
# harness cannot be built for it: the harness links `std`, and two crates then
# claim the `panic_impl` lang item. There are no host tests here and there will
# not be — the kernel is exercised in QEMU by `cargo xtask run`, and its logic
# lives in `abi`, `env` and `ring`, which are tested on the host.
test = false
bench = false
