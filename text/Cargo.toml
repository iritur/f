[package]
name = "f-text"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Text metrics as fixed-point integers, and the corpus of scripts and directions those metrics are argued against."

# No dependencies, and `hash/Cargo.toml`'s reason applies with one addition of
# its own. Section 08 of `ring-scene-boot` says text is the part of a renderer
# that is always underestimated, and RFC 0004 says why it is underestimated
# *here* in particular: text metrics are the single most natural place in this
# system to reach for a float, and a shaping cache is the single most natural
# place to reach for a `HashMap`. A crate with no dependencies cannot inherit
# either from somebody else's public type, which leaves both of them as choices
# this crate makes in the open. The shaper itself is `E3-B03a`'s decision and
# may land behind the licence boundary, where it is reached over a ring and not
# by a dependency row.

[lints]
workspace = true

# `E3-B03e`'s exit: UAX #9's two conformance files, read from the import by
# path on the host (RFC 0114, RFC 0115). A target of its own, and `harness =
# false`, because what the exit asks for is a printed count — cases run, passed
# and excluded per file — and libtest would capture it on every run that
# passes, which is every run that matters. `blob/tests/million.rs` is the
# precedent for the shape. `IMPORT_READERS` in `xtask/src/main.rs` names the
# file, which is what lets it open the corpus when nothing else here may.
[[test]]
name = "bidi_conformance"
path = "tests/bidi_conformance.rs"
harness = false
