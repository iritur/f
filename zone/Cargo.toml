# SPDX-License-Identifier: Apache-2.0 OR MIT
[package]
name = "f-zone"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The zoned mapping and the collector: sequential fill, seal, copy-forward, reset."

[dependencies]
# The record types the mapping writes through and the collector walks — the
# superblock, the blob header, the object head and the root record — plus
# `class::BATCH` and `NO_DEADLINE`, which every entry the collector submits
# carries under RFC 0059. They are in `abi/` for the reason that crate states:
# the only use for `#[repr(C)]` over them is a pointer cast, and RFC 0001 puts a
# pointer cast inside the frame, which this crate is not in.
f-abi.workspace = true

# The `Device` trait this crate sits under, the `Store` it sits over, and the
# chunker's constants. `f-zone` is not a second implementation of the format: it
# maps a flat block address space onto zones and never decodes a record it did
# not first ask `f_abi::store` to believe.
f-blob.workspace = true

# The root record's `check` is a SHA-256 over the record's preceding fields, and
# a blob's name is a SHA-256 over its bytes. One function in the tree, RFC 0012.
f-hash.workspace = true

[dev-dependencies]
# The workload draws its objects and its pin choices from a seeded `Env`.
# Nothing under `zone/src/` names this crate at all — a collector that read a
# clock or drew a number would be RFC 0004's exact failure — which is why the
# row is here and not above, and why `lint-determinism` finding nothing under
# `zone/` is the design rather than an oversight.
f-env.workspace = true

# There is deliberately no `f-virtio-blk` row, and the reason is worth a
# paragraph because the obvious diff adds one.
#
# RFC 0059 derives `collector_operations_ahead_of_hard_read` = 1 from
# `f_virtio_blk::pending::IN_FLIGHT` and says the row moves when `E1-B09` raises
# it, so the two constants must be checkably the same. A dev-dependency was the
# first attempt and does not work: `cargo clippy --workspace --all-targets`
# builds `f-virtio-blk` as a member with its own default features, `image` is
# one of them, `image` carries the component's `#[panic_handler]`, and feature
# unification then links a second `panic_impl` into this crate's std test
# binary. `kernel/Cargo.toml` avoids that with `default-features = false` and is
# excluded from that clippy run; a library here cannot be.
#
# So the bound is declared in `zone/src/queue.rs` and
# `zone/tests/cycle.rs` reads the driver's source to check the two agree —
# which is the shape `xtask`'s `the_record_layout_matches_the_abi` already uses
# on `abi/src/transfer.rs`, and which has the property the dependency was
# wanted for: the day `E1-B09` raises `IN_FLIGHT` and does not re-derive this,
# the run goes red.

# The deliberate defect, off by default and refused as a default by
# `cargo xtask lint-mutations`. `zone/src/publish.rs` argues why it lives in the
# shipped source rather than in a patch, and RFC 0040 is the record.
#
# One rather than two, and the arithmetic RFC 0042 asks for is answered by what
# it breaks rather than by a second feature: the publish's two barriers are one
# ordering, and a build that skips the first is a build in which a root record
# can name blobs that are not there. `cargo xtask cut` requires the sweep to find
# it and to print the cut point it was found at.
#
# There is no `default` key here on purpose: a defect on by default is the
# defect, shipped.
[features]
mutate-root-before-blobs = []

[lints]
workspace = true

# The fill-and-collect cycle, and a target of its own for
# `blob/tests/million.rs`'s reason: the exit and the per-commit gate differ by a
# *number* — how many objects are written before the collector is let go — and a
# libtest harness would swallow the argument that carries it. `harness = false`
# therefore, and the write amplification this run records is the run's own
# output rather than a comment.
[[test]]
name = "cycle"
path = "tests/cycle.rs"
harness = false

# `E2-P01`'s sweep, and a target of its own for the reason above it: the gate and
# the exit differ by *numbers* — how many seeds, and whether every publish is
# swept or the four that matter — and a libtest harness would swallow the
# arguments that carry them. It also prints its four required observations, and a
# harness that captured output would make them visible only to somebody who knew
# to pass `--nocapture`.
[[test]]
name = "cut"
path = "tests/cut.rs"
harness = false

# `E2-P03`: RFC 0059's three invariants asserted at every step of a run in which
# collection, adversarial allocation and a hard-class reader are interleaved.
# `harness = false` for the target above's reason and one more of its own: the
# gate and a sweep differ by a *number* — how many seeds the interleaving is
# drawn over — and the counts each invariant was checked against are the run's
# output rather than something a reader has to pass `--nocapture` to see. A
# property whose evidence is invisible by default is a property nobody can
# report.
[[test]]
name = "invariants"
path = "tests/invariants.rs"
harness = false
