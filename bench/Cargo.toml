[package]
name = "f-bench"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Measurement harness. Records distributions, never summaries."
publish = false

[dependencies]
f-abi.workspace = true
f-env.workspace = true
f-ring.workspace = true

# Claim 0017's workload, `bench/src/bin/rechunk.rs`, drives the two object kinds
# through the code that ships rather than through a model of it. A benchmark
# that reimplemented the chunker or the copy-on-write unit would be a second
# implementation nobody checks against the first, and the number it published
# would be about that one.
f-blob.workspace = true

# And the same rule one level down: the chunked kind's re-hash cost is bytes fed
# to the hash the store actually uses, so the workload feeds them to that hash.
# Counting them without hashing them would report an arithmetic rather than a
# measurement.
f-hash.workspace = true

# The component, as a library. `E2-B09`'s last clause is that claim 0017's
# denominator be an application byte as `intent/0006-state/spec.md` defines one
# — a byte the client submitted **on the objects ring** — and until this
# dependency the bench computed it as `edits * WRITE_BYTES` and nothing had
# crossed a ring. `rechunk` now fills a registered buffer, submits an
# `f_abi::Sqe`, and reads both halves of the ratio back off
# `f_objects::Served`.
#
# The workspace row's `default-features = false` is inherited and is what is
# wanted here: the `image` feature carries a `#[panic_handler]`, a linked
# artefact may hold exactly one, and this binary links `std`'s. The crate's own
# `target_os = "none"` gate would cover it anyway, and the two agreeing is not a
# reason to rely on either alone.
f-objects.workspace = true

# The two crates `f_objects::read::ReadPath` mounts, and they are here because a
# service is put in front of a *read* path rather than because this workload
# reads anything: the store is zoned and the path owns an index. Sized to the
# smallest thing each will accept, with the reason written at the constant.
f-zone.workspace = true
f-index.workspace = true

[lints]
workspace = true
