[package]
name = "f-ring"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The universal system interface. One implementation, used by both kernel and user space."

[dependencies]
f-abi.workspace = true

# A dev-dependency and never a dependency. The ring must not consult an Env
# on its hot path — a fault check inside `submit` is a branch on the one path
# this whole design exists to keep short. What the tests do instead is drive
# the ring from outside while a seeded Env decides what the world does to it.
[dev-dependencies]
f-env.workspace = true

[features]
# A deliberate defect, and never on by default — `cargo xtask lint-mutations`
# is what says so, and it reads every manifest in the workspace rather than the
# kernel's alone, because this is the second defect and a second list is how a
# defect gets forgotten.
#
# It weakens the completion ring's publishing store from `Release` to
# `Relaxed`. `ring/tests/litmus.rs` is what must then fail — on AArch64, where
# it means something. On x86-64 it will pass, which is the whole reason that
# file exists.
mutate-relaxed-completion = []

# The second, and the one that is observable on x86-64: it removes the
# `SeqCst` fence between publishing an entry and reading the consumer's
# NEED_WAKEUP flag. Store-load is the one reordering total store order permits,
# so this defect is caught on the ordinary runner and not only on the arm one.
# `ring/tests/litmus.rs` is what must fail. RFC 0020.
mutate-no-doorbell-fence = []

[lints.rust]
# The frame. Overrides the workspace forbid — see the note in the root Cargo.toml.
unsafe_code = "allow"
missing_docs = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
