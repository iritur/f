[package]
name = "f-hash"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "SHA-256, once. Every content address in the system is this function."

# No dependencies, and that is a property rather than an accident: the function
# that names a release, a blob and a generation must not be able to change
# because somebody else's crate did. `env/Cargo.toml` is the pattern otherwise —
# a `no_std` library with no build script and no features, whose tests run under
# the host's harness because a `#[cfg(test)]` build is a host build.

[lints]
workspace = true
