name: security scan

# Weekly, because a scan that runs on every push is a scan people learn to
# scroll past, and the things it finds do not arrive on the schedule commits do.
#
# Two halves. The advisory check is deterministic and gates: cargo deny knows
# what is published about the dependency graph. The review half is a model
# reading the tree, which does not gate and cannot — it produces findings for a
# person, in intent/ format, with a stated confidence.

on:
  schedule:
    - cron: "41 6 * * 2"
  workflow_dispatch:
    inputs:
      # The half of the alarm a person can exercise without waiting for the
      # schedule. `dry-run` makes the `alarm` job compute the decision, the
      # title and the whole issue body, write them to the run summary, and open
      # nothing — so what a reviewer is being asked to trust can be read before
      # it has ever run for real. `post` is the deliberate end-to-end test and
      # opens a real issue; `off` wants neither. A `schedule` run ignores this
      # and always posts. `nightly.yml` carries the argument.
      alarm:
        description: "On a manual run: dry-run (default), post, or off"
        required: false
        type: choice
        default: "dry-run"
        options: ["dry-run", "post", "off"]

jobs:
  advisories:
    name: advisory database
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources

  review:
    name: scan the tree
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: is there a credential
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=scan skipped::ANTHROPIC_API_KEY is not set on this repository."
          fi

      - if: steps.gate.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - if: steps.gate.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # The scope is narrow on purpose. This is an operating system at M0: a
        # general "look for vulnerabilities" prompt returns a page of things
        # that are true of every kernel and useful to nobody. What is asked for
        # here is what this tree's own structure says is dangerous.
        run: |
          claude -p "Read REVIEW.md pass 3 and .claude/skills/frame-and-unsafe/SKILL.md.

          Scan this repository for, in order:

          1. unsafe blocks that trust a value which crossed a trust boundary
             without validating it first. Everything in abi/ crosses one.
          2. a path from the permissive tree into third_party/ that is not a ring.
          3. credentials, tokens or private hostnames anywhere in the tree,
             tests and fixtures included.
          4. dependencies added since the last release, with what each is for.

          For each finding give a confidence: high, medium or low. Validate
          before reporting — read the surrounding code and say what you checked.
          Report nothing you could not confirm by reading. If there are no
          findings, say so in one line.

          If a finding is larger than a patch, write it as an
          intent/NNNN-name/intent.md following .claude/agents/incident-intent.md
          and say so. Otherwise report it here." \
            2>&1 | tee scan.md

      - if: steps.gate.outputs.ready == 'true'
        run: cat scan.md >> "$GITHUB_STEP_SUMMARY"

      - if: steps.gate.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: security-scan
          path: |
            scan.md
            intent/
          if-no-files-found: ignore
  # A red schedule is loud, and until this job existed it was not.
  #
  # `nightly.yml`'s `alarm` job carries the whole argument: the two post-mortems
  # of a red schedule nobody read, why this is a job rather than a step inside
  # one, why it runs outside any container, why the title is a sorted signature
  # so a second consecutive failure is a comment rather than a second issue, and
  # why a green run closes what it opened. This is that job watching this file.
  #
  # `review` is a model reading the tree and does not gate, but it can still fail
  # for reasons that are about this repository — a missing credential, a changed
  # prompt path — and a weekly job that fails into a tab is the thing A-06 names.
  #
  # The three permissions replace the default set rather than adding to it, and
  # each row is here for one call: `contents: read` for the checkout and one
  # read of the default branch's head, `actions: read` for the failing job's
  # log, `issues: write` for the open, the comment and the close. No
  # `packages:`, because this pulls no image, and no write to anything else.
  #
  # `cargo xtask lint-schedules` is what keeps the list below complete: it runs
  # in `verify` and in the pull-request gate and refuses a scheduled workflow
  # whose alarm does not name every other job in its file.
  alarm:
    name: a red run says so in this repository
    needs: [advisories, review]
    # Not `failure()`: closing a stale issue on a green run is half of the job.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: what happened, and what to say about it
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ALARM_JOBS: alarm/jobs.tsv
          ALARM_WORKFLOW: security-scan
          ALARM_SHA: ${{ github.sha }}
          ALARM_BRANCH: ${{ github.event.repository.default_branch }}
          ALARM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_LOG: alarm/log.txt
          ALARM_OUT: alarm
        run: |
          mkdir -p alarm
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' > alarm/jobs.tsv
          cat alarm/jobs.tsv
          # Per job and not per run: the run-level log archive is not served
          # until the whole run has finished, and this job is part of the run.
          : > alarm/log.txt
          for id in $(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
                        --jq '.jobs[] | select(.conclusion == "failure") | .id' || true); do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" >> alarm/log.txt || true
          done
          ALARM_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ALARM_BRANCH" --jq .sha || true) \
            bash ops/alarm.sh
          {
            echo "## $(cat alarm/title)"
            echo
            echo "decision: \`$(cat alarm/decision)\`"
            echo
            cat alarm/body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: open it, comment on it, or close it
        if: github.event_name == 'schedule' || github.event.inputs.alarm == 'post'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/alarm-post.sh