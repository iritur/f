name: image

# The development environment, published so CI can run inside it.
#
# `docker/README.md` states the rule this serves: no step may exist that is not
# in the repository, and a developer's laptop is a step. Once CI runs in the
# same image the laptop does, "works on my machine" and "works in CI" stop
# being two different claims.
#
# Built on a change to anything that goes into the image, and never otherwise.
# The toolchain pin is one of those inputs, which is the point: bumping
# `rust-toolchain.toml` rebuilds the environment in the same commit that bumps
# it, so the two cannot drift.
on:
  push:
    branches: [main]
    paths:
      - docker/**
      - rust-toolchain.toml
      - .github/workflows/image.yml
  # So the image can be published before the first ci.yml run that needs it,
  # and rebuilt when a base image moves under us without this tree changing.
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/f-dev

jobs:
  # Two native builds rather than one emulated multi-platform build. Installing
  # a Rust nightly and a QEMU under binfmt emulation takes tens of minutes and
  # fails in ways that have nothing to do with this tree; each architecture
  # builds on its own metal and the manifest is assembled afterwards.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            suffix: amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            suffix: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both targets from one Dockerfile. `dev` is what every job but the
      # dependency-policy one runs in; `full` adds cargo-deny, cargo-llvm-cov
      # and cargo-nextest and is slower to build, which is why it is a separate
      # stage rather than the default.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: dev
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=dev-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=dev-${{ matrix.suffix }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: full
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:full-${{ github.sha }}-${{ matrix.suffix }}
          cache-from: type=gha,scope=full-${{ matrix.suffix }}
          cache-to: type=gha,mode=max,scope=full-${{ matrix.suffix }}

  # One name per image, pointing at both architectures. The AArch64 CI jobs and
  # the x86-64 ones then name the same tag, which is what stops the two from
  # quietly diverging into two environments with one name.
  manifest:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: assemble dev
        run: |
          for tag in latest "${{ github.sha }}"; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE}:${tag}" \
              "${REGISTRY}/${IMAGE}:${{ github.sha }}-amd64" \
              "${REGISTRY}/${IMAGE}:${{ github.sha }}-arm64"
          done

      - name: assemble full
        run: |
          for tag in full "full-${{ github.sha }}"; do
            docker buildx imagetools create \
              --tag "${REGISTRY}/${IMAGE}:${tag}" \
              "${REGISTRY}/${IMAGE}:full-${{ github.sha }}-amd64" \
              "${REGISTRY}/${IMAGE}:full-${{ github.sha }}-arm64"
          done
