name: agent evals

# The gate on changes whose effect is otherwise invisible.
#
# Editing a skill or a hook feels like editing a document and behaves like
# editing a compiler flag: nothing fails, and the next twenty sessions are
# different. This job is the only thing that turns such an edit into an
# observation, which is why it triggers on exactly those paths.
#
# The weekly run exists because the model moves even when the repository does
# not, and a suite that only runs on configuration diffs cannot tell those two
# apart.

on:
  pull_request:
    paths:
      - "CLAUDE.md"
      - "REVIEW.md"
      - ".claude/**"
      - "evals/**"
      - ".github/workflows/agent-evals.yml"
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      # The half of the alarm a person can exercise without waiting for the
      # schedule. `dry-run` makes the `alarm` job compute the decision, the
      # title and the whole issue body, write them to the run summary, and open
      # nothing — so what a reviewer is being asked to trust can be read before
      # it has ever run for real. `post` is the deliberate end-to-end test and
      # opens a real issue; `off` wants neither. A `schedule` run ignores this
      # and always posts. `nightly.yml` carries the argument.
      alarm:
        description: "On a manual run: dry-run (default), post, or off"
        required: false
        type: choice
        default: "dry-run"
        options: ["dry-run", "post", "off"]

jobs:
  hooks:
    name: hooks fire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # No credential needed and no model involved: the hooks are shell, and a
      # hook that has stopped firing looks exactly like a hook with nothing to
      # complain about.
      - run: bash .claude/hooks/selftest.sh

  evals:
    name: eval suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: is there a credential
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=eval suite skipped::ANTHROPIC_API_KEY is not set on this repository, so the suite did not run. It reports skipped rather than green: a suite that passes when it did not run is worse than no suite."
          fi

      - if: steps.gate.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - if: steps.gate.outputs.ready == 'true'
        run: rustup show

      - if: steps.gate.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        # Fails below the floor in evals/suite.toml. Moving that floor is a
        # reviewable diff and a decision about what this repository accepts —
        # not a way to make a red build green.
        run: cargo xtask eval
  # A red schedule is loud, and until this job existed it was not.
  #
  # `nightly.yml`'s `alarm` job carries the whole argument: the two post-mortems
  # of a red schedule nobody read, why this is a job rather than a step inside
  # one, why it runs outside any container, why the title is a sorted signature
  # so a second consecutive failure is a comment rather than a second issue, and
  # why a green run closes what it opened. This is that job watching this file.
  #
  # This file also runs on pull requests touching `.claude/`, so the decision half
  # of the alarm is exercised by ordinary work rather than only by a schedule.
  # The posting step is still `schedule`-only: a pull request that went red
  # should be read in the pull request.
  #
  # The three permissions replace the default set rather than adding to it, and
  # each row is here for one call: `contents: read` for the checkout and one
  # read of the default branch's head, `actions: read` for the failing job's
  # log, `issues: write` for the open, the comment and the close. No
  # `packages:`, because this pulls no image, and no write to anything else.
  #
  # `cargo xtask lint-schedules` is what keeps the list below complete: it runs
  # in `verify` and in the pull-request gate and refuses a scheduled workflow
  # whose alarm does not name every other job in its file.
  alarm:
    name: a red run says so in this repository
    needs: [hooks, evals]
    # Not `failure()`: closing a stale issue on a green run is half of the job.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: what happened, and what to say about it
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ALARM_JOBS: alarm/jobs.tsv
          ALARM_WORKFLOW: agent-evals
          ALARM_SHA: ${{ github.sha }}
          ALARM_BRANCH: ${{ github.event.repository.default_branch }}
          ALARM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_LOG: alarm/log.txt
          ALARM_OUT: alarm
        run: |
          mkdir -p alarm
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' > alarm/jobs.tsv
          cat alarm/jobs.tsv
          # Per job and not per run: the run-level log archive is not served
          # until the whole run has finished, and this job is part of the run.
          #
          # Every line tagged with its job's name and id, tab-separated, so that
          # ops/alarm.sh can quote a headline and an excerpt from one job and say
          # which. Untagged, two failures were one undifferentiated log and the
          # excerpt could be about the other job.
          : > alarm/log.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' \
            > alarm/failed.tsv || true
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" |
              awk -v job="$name" -v id="$id" '{ print job "\t" id "\t" $0 }' >> alarm/log.txt || true
          done < alarm/failed.tsv
          ALARM_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ALARM_BRANCH" --jq .sha || true) \
            bash ops/alarm.sh
          {
            echo "## $(cat alarm/title)"
            echo
            echo "decision: \`$(cat alarm/decision)\`"
            echo
            cat alarm/body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: open it, comment on it, or close it
        if: github.event_name == 'schedule' || github.event.inputs.alarm == 'post'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/alarm-post.sh
