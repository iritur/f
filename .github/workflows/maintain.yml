name: maintain

# The maintain-stage loop: detect deterministically, then let the bands decide
# how much a model is allowed to do about it.
#
#   ops/detect.sh  ->  max-band  ->  what ops/bands.yaml permits  ->  intent/
#
# Band 0 and 1 end here, in the log. Band 2 opens a read-only diagnosis that
# ends in a draft intent. Band 3 permits the same diagnosis to arrive as a pull
# request. Nothing in this file deploys anything, and no band lets it.

on:
  schedule:
    - cron: "23 5 * * *"
  workflow_dispatch:
    inputs:
      # The half of the alarm a person can exercise without waiting for the
      # schedule. `dry-run` makes the `alarm` job compute the decision, the
      # title and the whole issue body, write them to the run summary, and open
      # nothing — so what a reviewer is being asked to trust can be read before
      # it has ever run for real. `post` is the deliberate end-to-end test and
      # opens a real issue; `off` wants neither. A `schedule` run ignores this
      # and always posts. `nightly.yml` carries the argument.
      alarm:
        description: "On a manual run: dry-run (default), post, or off"
        required: false
        type: choice
        default: "dry-run"
        options: ["dry-run", "post", "off"]

jobs:
  detect:
    name: bands
    runs-on: ubuntu-latest
    outputs:
      band: ${{ steps.detect.outputs.band }}
      report: ${{ steps.detect.outputs.report }}
    steps:
      - uses: actions/checkout@v7

      - id: detect
        run: |
          bash ops/detect.sh | tee detect.txt
          band=$(sed -n 's/^max-band: //p' detect.txt | tail -n 1)
          echo "band=${band:-0}" >> "$GITHUB_OUTPUT"
          {
            echo "report<<REPORT_EOF"
            cat detect.txt
            echo "REPORT_EOF"
          } >> "$GITHUB_OUTPUT"

      - run: cat detect.txt >> "$GITHUB_STEP_SUMMARY"

  diagnose:
    name: read-only diagnosis
    needs: detect
    if: needs.detect.outputs.band >= 2
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7

      - name: is there a credential
        id: gate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=band ${{ needs.detect.outputs.band }} with no credential::Something moved and nothing diagnosed it. The report is in the detect job summary."
          fi

      - if: steps.gate.outputs.ready == 'true'
        run: npm install -g @anthropic-ai/claude-code

      # Read-only by construction: the only tool that can write is Write, and
      # the prompt confines it to intent/. The band, not the prompt, is what
      # decides whether the result may become a pull request — see the next
      # step's condition.
      - if: steps.gate.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          REPORT: ${{ needs.detect.outputs.report }}
          BAND: ${{ needs.detect.outputs.band }}
        run: |
          claude -p "Follow .claude/agents/incident-intent.md exactly.

          ops/detect.sh reported band $BAND. Its output, quoted verbatim, is:

          $REPORT

          Write one intent/NNNN-short-name/intent.md and change nothing else.
          Quote the detector output in the Problem section rather than
          paraphrasing it. State your confidence, and put everything you
          inferred in Open questions. status stays draft."

      - name: open it as a pull request
        if: steps.gate.outputs.ready == 'true' && needs.detect.outputs.band >= 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain intent/)" ]; then
            echo "::notice::the diagnosis wrote no intent; nothing to open"
            exit 0
          fi
          branch="maintain/band-${{ needs.detect.outputs.band }}-${{ github.run_id }}"
          git config user.name  "maintain workflow"
          git config user.email "noreply@example.invalid"
          git checkout -b "$branch"
          git add intent/
          git commit -m "intent: band ${{ needs.detect.outputs.band }} detection, drafted by the maintain workflow"
          git push origin "$branch"
          gh pr create \
            --title "intent: band ${{ needs.detect.outputs.band }} detection" \
            --body "Drafted by .github/workflows/maintain.yml from ops/detect.sh. Nobody has read this yet: triage it as fix now, schedule, or dismiss with a reason. If it is real, it also becomes a task in evals/."

      # Band 2 stops short of a branch. The draft is an artifact somebody
      # collects, which is the difference between a diagnosis and a claim on
      # everybody's attention.
      - name: keep the draft as an artifact
        if: steps.gate.outputs.ready == 'true' && needs.detect.outputs.band < 3
        uses: actions/upload-artifact@v4
        with:
          name: intent-draft
          path: intent/
          if-no-files-found: ignore
  # A red schedule is loud, and until this job existed it was not.
  #
  # `nightly.yml`'s `alarm` job carries the whole argument: the two post-mortems
  # of a red schedule nobody read, why this is a job rather than a step inside
  # one, why it runs outside any container, why the title is a sorted signature
  # so a second consecutive failure is a comment rather than a second issue, and
  # why a green run closes what it opened. This is that job watching this file.
  #
  # `diagnose` is skipped on every day nothing moved, and a skip is not a failure
  # — `ops/alarm.sh` treats `skipped` as neither red nor green for exactly this
  # file's sake. What this adds is that a red `detect` is now heard: until now
  # the detector failing looked identical to the detector finding nothing.
  #
  # The three permissions replace the default set rather than adding to it, and
  # each row is here for one call: `contents: read` for the checkout and one
  # read of the default branch's head, `actions: read` for the failing job's
  # log, `issues: write` for the open, the comment and the close. No
  # `packages:`, because this pulls no image, and no write to anything else.
  #
  # `cargo xtask lint-schedules` is what keeps the list below complete: it runs
  # in `verify` and in the pull-request gate and refuses a scheduled workflow
  # whose alarm does not name every other job in its file.
  alarm:
    name: a red run says so in this repository
    needs: [detect, diagnose]
    # Not `failure()`: closing a stale issue on a green run is half of the job.
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      issues: write
    steps:
      - uses: actions/checkout@v7
      - name: what happened, and what to say about it
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS: ${{ toJSON(needs) }}
          ALARM_JOBS: alarm/jobs.tsv
          ALARM_WORKFLOW: maintain
          ALARM_SHA: ${{ github.sha }}
          ALARM_BRANCH: ${{ github.event.repository.default_branch }}
          ALARM_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          ALARM_LOG: alarm/log.txt
          ALARM_OUT: alarm
        run: |
          mkdir -p alarm
          printf '%s' "$NEEDS" | jq -r 'to_entries[] | "\(.key)\t\(.value.result)"' > alarm/jobs.tsv
          cat alarm/jobs.tsv
          # Per job and not per run: the run-level log archive is not served
          # until the whole run has finished, and this job is part of the run.
          #
          # Every line tagged with its job's name and id, tab-separated, so that
          # ops/alarm.sh can quote a headline and an excerpt from one job and say
          # which. Untagged, two failures were one undifferentiated log and the
          # excerpt could be about the other job.
          : > alarm/log.txt
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '.jobs[] | select(.conclusion == "failure") | "\(.id)\t\(.name)"' \
            > alarm/failed.tsv || true
          while IFS=$'\t' read -r id name; do
            gh api "repos/$GITHUB_REPOSITORY/actions/jobs/$id/logs" |
              awk -v job="$name" -v id="$id" '{ print job "\t" id "\t" $0 }' >> alarm/log.txt || true
          done < alarm/failed.tsv
          ALARM_HEAD=$(gh api "repos/$GITHUB_REPOSITORY/commits/$ALARM_BRANCH" --jq .sha || true) \
            bash ops/alarm.sh
          {
            echo "## $(cat alarm/title)"
            echo
            echo "decision: \`$(cat alarm/decision)\`"
            echo
            cat alarm/body.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: open it, comment on it, or close it
        if: github.event_name == 'schedule' || github.event.inputs.alarm == 'post'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ops/alarm-post.sh