# SPDX-License-Identifier: Apache-2.0 OR MIT
#
# The machine-readable half of docs/test-taxonomy.md. One [[row]] per class of
# bug, with the layers that catch it, the concrete check today, how often that
# check runs, and — where nothing catches it — who is scheduled to, or why the
# gap is accepted and what would reverse the acceptance.
#
# This file exists because the page beside it is the kind of document that is
# true on the day it is written and quietly false a quarter later, and the
# failure mode is invisible: nothing goes red when a row stops being true.
# Nothing reads this yet. `cargo xtask lint-taxonomy` is the follow-up named at
# the end of the page — every `check` naming a verb that exists, every
# `scheduled_by` naming a TODO.md id that exists and is still open, every
# `accepted_because` carrying a `reversal`, and every row in the page present
# here.
#
# Fields, and the vocabulary each is drawn from:
#
#   id              stable slug, referenced by the lint rather than by prose
#   group           A..I, the section of the page this row appears in
#   class           the bug class, as the page states it
#   layers          L0..L7 from docs/design/proving-ground.html, plus the two
#                   this page names because the ladder has no row for them:
#                   P "provoke the real kernel", X "policy made executable".
#                   Letters rather than L8 and L9 on purpose — the numbering
#                   belongs to proving-ground.html and this file does not extend it.
#   check           the command, job, hook or test that would catch it today
#   cadence         one or more of: every-edit, every-build, every-verify,
#                   every-pr, daily, weekly, per-release, on-demand, never
#   status          catches | partially | gap
#   scheduled_by    TODO.md task ids, for a gap somebody owns
#   accepted_because + reversal   for a gap nobody owns, and why that is fine
#
# A row with status = "gap" carries exactly one of `scheduled_by` or
# `accepted_because`. A row with `accepted_because` and no `reversal` is a
# preference wearing a decision's clothes.

schema = 1
source = "docs/test-taxonomy.md"

# --- A — the ring and the memory model ---------------------------------------

[[row]]
id      = "ring-relaxed-submission"
group   = "A"
class   = "Submission publishing store weakened to Relaxed"
layers  = ["L2"]
check   = "cargo test -p f-ring --test litmus --release, both runners; mutate-relaxed-submission exists as a fixture and gates nothing"
cadence = ["every-pr"]
status  = "partially"
notes   = "The fixture was a gate on the AArch64 runner for one run and the suite passed with it on. The stress tests were given the exact defect on the exact hardware and did not see it."
scheduled_by = ["E0-P16"]

[[row]]
id      = "ring-relaxed-completion"
group   = "A"
class   = "Completion publishing store weakened to Relaxed"
layers  = ["L2"]
check   = "the same litmus job; mutate-relaxed-completion"
cadence = ["every-pr"]
status  = "partially"
scheduled_by = ["E0-P16"]

[[row]]
