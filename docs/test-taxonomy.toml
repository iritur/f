[[row]]
id      = "component-outgrows-table"
group   = "H"
class   = "A component that legitimately outgrows the capability table"
layers  = ["P"]
check   = "cargo xtask cap flood holds 160 capabilities, five times the fixed count, with the growth debited from its untyped region; cap quota holds 32 because it spent that region first"
cadence = ["every-pr"]
status  = "catches"
notes   = "E1-B13 made the table storage the component pays for, so outgrowing the fixed count is an ordinary thing a component does rather than a bound it meets. What is still sampled rather than proved is the size: one page, because the untyped region the frame grants is one frame. A real supervisor holding several is E1-B05."

