cadence = ["every-pr"]
status  = "catches"
notes   = "The one defect the stress suite does see, and on the runner nobody would guess: 58 971 lost wakeups in 500 000 rounds on x86-64, a clean pass on arm, because stlr/ldar are RCsc."

[[row]]
id      = "ring-unexplored-interleaving"
group   = "A"
