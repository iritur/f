cadence = ["never"]
status  = "gap"
scheduled_by = ["E1-B14", "E1-P06", "E1-B10"]

[[row]]
id      = "allocator-split-coalesce"
group   = "D"
class   = "Allocator split/coalesce corruption"
layers  = ["L1", "P"]
check   = "cargo xtask run — mem::self_test phases two to four: an Env-driven mix of orders 0 to 9, a probe upward from order 9, and a 2 MiB block handed back as 512 shuffled frames that must reappear as a 2 MiB block. cargo xtask orders boots a machine with a gibibyte in it and requires order 18, which the 128 MiB fixture has no memory for"
cadence = ["every-verify", "every-pr"]
status  = "catches"
notes   = "Every phase requires the free count to be exactly what it was, which is what catches a leak of a fixed number of frames per iteration. What it does not catch is fragmentation between coalescing passes — nothing schedules the pass, so its cost is argued rather than measured until E1-B07's batch class arrives."

