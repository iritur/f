[[row]]
id      = "test-on-no-runner"
group   = "I"
class   = "A test that exists and runs on no runner"
layers  = ["X"]
check   = "cargo xtask test is --workspace --exclude f-kernel; the CI test jobs name four crates, so xtask and bench tests run locally and not in the gate"
cadence = ["every-verify"]
status  = "partially"
notes   = "The same drift xtask test was changed to fix: a hand-written crate list stops matching the workspace the moment a crate is added, and silently."
scheduled_by = ["E0-P01"]

[[row]]
id      = "kernel-fault-path-rot"
group   = "I"
class   = "A kernel fault path that no longer reports"
layers  = ["P"]
check   = "cargo xtask fault pf|ud|df|nx|wx|stack"
cadence = ["on-demand"]
status  = "gap"
accepted_because = "Narrowly. The exception path does run in the gate — cargo xtask user boots six processes that fault and requires the kernel to report each and survive it. What is unscheduled is the kernel-mode half: the double-fault stack, the W^X and NX faults, the guard page under the fault stack, all of which change only when the address space or the IDT changes."
reversal = "A kernel-mode fault path breaks without `user` noticing, or the kernel job stops being the longest in the gate and six more boots are free. The gate's measured wall clock is 2 m 56 s against a ten-minute budget, so this is the weakest acceptance in this file."

