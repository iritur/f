[package]
name = "f-blob"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Content-defined chunking, and the store built on it. A blob is named by what it contains."

[dependencies]
# The record types and their codecs: the superblock, the blob header, the object
# head and the root record, with the four blob kinds and the refusals a caller
# compares against. They are in `abi/` and not here for the reason that crate's
# `store` module states in its first paragraph — the only use for `#[repr(C)]`
# over them is to view device bytes as a struct, and a library above the frame
# may not write the cast that view is. So this crate consumes them, and the
# dependency is what makes "one definition of the format" true rather than
# stated.
f-abi.workspace = true

# The one SHA-256 in the tree. A chunk's name is this function over its bytes
# and nothing else, which is what makes two objects that share content share
# storage without either of them knowing about the other.
f-hash.workspace = true

# A real dependency and not a dev one, and the reason is worth stating because
# a reader who knows RFC 0004 will expect the opposite. `gear.rs` derives its
# table and its two masks from `f_env::split`'s `const fn`s *at compile time*:
# the names appear in a `const` initialiser and on no run-time path. RFC 0026's
# argument is that there is one derivation in this tree, and a local SplitMix64
# here would be the third transcription of it. The crate doc says the store
# draws nothing from an `Env` when it runs; the tests draw their objects and
# their edits from one, which is a different thing and is why this row is not
# under `[dev-dependencies]`.
f-env.workspace = true

[lints]
workspace = true

# `E2-B01`'s first exit, and a target of its own for the reason
# `ring/tests/hostile.rs` gives: the exit and the per-commit gate differ by a
# *number* — a million blobs against ten thousand — and a libtest harness would
# swallow the argument that carries it, leaving the two to differ by a build
# instead. `harness = false` therefore, and `cargo test --workspace` runs it at
# the default in the file, which is the gate. `--blobs 1000000` in release is
# the exit. RFC 0046 argued this shape for a fuzzer; it is the same shape.
[[test]]
name = "million"
path = "tests/million.rs"
harness = false
