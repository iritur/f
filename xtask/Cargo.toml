[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Build orchestration as Rust rather than as a Makefile."
publish = false

# The measurement harness, so that a claim run from here records the same way a
# claim run from a benchmark binary does. The alternative was a second histogram
# and a second environment check living in the tooling, which is how a registry
# ends up with two definitions of what a percentile is.
[dependencies]
f-bench.workspace = true

# The content address, so that the release package and the store name bytes with
# one function rather than two that agree until they do not. xtask is `std` and
# `f-hash` is a `no_std` library that builds for the host, which is the same
# arrangement `ring/proofs` uses in the other direction — a `no_std` library is
# not a smaller crate, it is one that names nothing outside `core`, and a `std`
# binary may depend on it freely.
f-hash.workspace = true

# The node kinds and their codecs, and the checker and fold over them, so that
# `cargo xtask generation` encodes a record tree with the same codec the machine
# decodes it with. That is the whole of "one implementation": an encoder written
# here against a format described elsewhere is the second reader of the format
# the spec spends a page refusing to have. Both are `no_std` libraries that build
# for the host, on the same argument `f-hash`'s comment above makes.
f-abi.workspace = true
f-generation.workspace = true

# The assembler, so that `cargo xtask generation` instantiates the module it just
# packed rather than only writing it. Two reasons, and the second is the one
# worth stating: the writer believing its own output through the reader that will
# read it at boot is the cheapest way to keep a defect here from being found by a
# boot; and `E2-B05`'s exit is about *this* tree's generation and not only about
# a test's fixture, so the command that produces the real one is where the
# byte-identity is demonstrated on it. `no_std` library, `std` binary — the same
# arrangement the three rows above take, on `f-hash`'s argument.
f-assembler.workspace = true

[lints]
workspace = true
