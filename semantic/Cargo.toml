[package]
name = "f-semantic"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "The semantic tree the system owns, and the handle an application holds to it."

[dependencies]
# The wire, and the key. `f_abi::semantic` is the entry format `E3-B06b` froze
# and `f_abi::semantic::Sealed` is the right this crate's apply path demands —
# RFC 0083 names that path as this task's and states its reversal condition as
# an apply path that takes a `Delta` and no `Sealed`. A crate that took the
# deltas and not the key would be that reversal with a different file name.
f-abi.workspace = true

# The meaning. `f_interface::node` is the closed vocabulary RFC 0077 froze, and
# `vocabulary.rs` is the first implementor of `f_abi::semantic::Vocabulary`
# outside `abi`'s own test fixtures — which RFC 0083 records as owed here.
#
# This is the crate that joins the two, and it exists because neither may take
# the other: `abi` holds the wire and cannot know what a role means,
# `interface/Cargo.toml` declines `f-abi` so that the vocabulary stays a leaf
# that can be deleted. The join has to live somewhere that is neither, and this
# is it. *Reversal:* `interface` taking `f-abi`, at which point the vocabulary
# is no longer abandonable and that crate's own comment is what has changed.
f-interface.workspace = true

# The graph's vocabulary of kinds, for `emit.rs` — `E3-B06f`. A projection has
# to decide what kind of scene node a role becomes, and deciding it against
# `f_abi::scene::kind`'s `u16` constants would be deciding it against numbers:
# `f_scene::kind::Kind` is the type whose closedness the compiler enforces, and
# `Kind::family` is what makes *a paint belongs where a mark is* derived rather
# than decided a second time.
#
# The direction of this row is the whole of why it is safe. `scene/` does not
# take this crate and must not: a retained graph that depended on the meaning
# layer would be a graph the meaning layer could take down with it, and part
# III's one property of part II is that it cannot. Deleting `interface` and
# `semantic` leaves `scene` standing, which is the property stated as a
# dependency direction rather than as a paragraph. *Reversal:* `scene/`
# acquiring a row for `f-interface` or `f-semantic`, which is the abandonment
# argument gone.
f-scene.workspace = true

# The text path, for `draw.rs` — `E3-B03k`. A node's text is set in lines by
# `f_text::paragraph`, which composes the bidi, line-breaking and metric stages
# `E3-B03d` to `E3-B03f` wrote, and the display projection is the first thing in
# the tree with a text to set. It lands here for the reason every other join in
# this crate does: `interface/Cargo.toml` declines every dependency so the
# vocabulary stays a leaf, and `text/Cargo.toml` declines them for RFC 0004's
# reason, so neither may take the other and the meeting has to be somewhere
# that is neither. `f-text` has no dependencies, so the row adds one crate and
# not a subtree; the frame already links it for `face`. *Reversal:* `f-text`
# taking `f-interface` or the other way round, which is either leaf's own
# comment being what changed.
f-text.workspace = true

[lints]
workspace = true
