# Pinned so that a build is reproducible and so that a toolchain bump is a
# reviewable commit rather than an ambient change. Bumping this file requires
# a full claims re-run: see claims/README.md.
[toolchain]
channel = "nightly-2026-08-01"
components = ["rust-src", "llvm-tools", "clippy", "rustfmt"]
targets = ["x86_64-unknown-none", "aarch64-unknown-none"]
profile = "minimal"
